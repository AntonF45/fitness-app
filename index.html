<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitnary</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tgBg: 'var(--tg-theme-bg-color, #1c1c1e)',
                        tgText: 'var(--tg-theme-text-color, #ffffff)',
                        tgHint: 'var(--tg-theme-hint-color, #8e8e93)',
                        tgLink: 'var(--tg-theme-link-color, #3b82f6)',
                        tgButton: 'var(--tg-theme-button-color, #3b82f6)',
                        tgSecondaryBg: 'var(--tg-theme-secondary-bg-color, #2c2c2e)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        input, select, textarea {
            background-color: var(--tg-theme-secondary-bg-color, #2c2c2e);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid var(--tg-theme-hint-color, #8e8e93);
        }
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        .scroll-container {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .scroll-container::-webkit-scrollbar {
            display: none;
        }
        
        .snap-x {
            scroll-snap-type: x mandatory;
        }
        .snap-center {
            scroll-snap-align: center;
        }

        /* Фиксированная область графика */
        .chart-wrapper {
            position: relative;
            height: 220px;
            touch-action: pan-y pinch-zoom;
        }
        .chart-wrapper canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header id="app-header" class="sticky top-0 z-10 bg-tgBg/90 backdrop-blur-md px-4 py-3 flex items-center justify-between border-b border-tgSecondaryBg">
        <button id="btn-back" class="text-tgLink text-xl hidden" onclick="navigateBack()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h1 id="header-title" class="text-lg font-semibold flex-1 text-center">Fitnary</h1>
        <div class="w-6"></div>
    </header>

    <main id="app-content" class="p-4 fade-in"></main>

    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-tgBg border-t border-tgSecondaryBg flex justify-around py-3 z-20">
        <button onclick="switchTab('stats')" id="tab-stats" class="flex flex-col items-center text-tgLink">
            <i class="fa-solid fa-chart-line text-xl mb-1"></i>
            <span class="text-xs">Статистика</span>
        </button>
        <button onclick="switchTab('programs')" id="tab-programs" class="flex flex-col items-center text-tgHint">
            <i class="fa-solid fa-list-check text-xl mb-1"></i>
            <span class="text-xs">Программы</span>
        </button>
        <button onclick="switchTab('history')" id="tab-history" class="flex flex-col items-center text-tgHint">
            <i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i>
            <span class="text-xs">История</span>
        </button>
    </nav>

    <script>
        function esc(str = '') {
            return String(str)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function createId() {
            return typeof crypto !== 'undefined' && crypto.randomUUID 
                ? crypto.randomUUID() 
                : Date.now().toString(36) + Math.random().toString(36).slice(2);
        }

        function parseOptionalInt(value) {
            const n = parseInt(value, 10);
            return Number.isFinite(n) && n >= 0 ? n : null;
        }

        function appConfirm(message) {
            return new Promise(resolve => {
                tg.showConfirm(message, ok => resolve(ok));
            });
        }

        const MUSCLE_GROUPS = ['Грудь', 'Спина', 'Ноги', 'Плечи', 'Руки'];

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        const USER_ID = tg.initDataUnsafe?.user?.id || 'local_test_user_' + Math.random().toString(36).substr(2, 9);
        const haptic = (type = 'light') => tg.HapticFeedback?.impactOccurred(type);

        tg.MainButton.hide();

        const DataAPI = {
            _key(type) { return `twa_fitness_${type}_${USER_ID}`; },
            
            getPrograms() { return JSON.parse(localStorage.getItem(this._key('programs')) || '[]'); },
            savePrograms(data) { localStorage.setItem(this._key('programs'), JSON.stringify(data)); },
            
            getHistory() { return JSON.parse(localStorage.getItem(this._key('history')) || '[]'); },
            saveHistory(data) { localStorage.setItem(this._key('history'), JSON.stringify(data)); },

            getProgramById(id) { return this.getPrograms().find(p => p.id === id); },
            getHistoryEntryById(id) { return this.getHistory().find(h => h.id === id); },

            // ИСПРАВЛЕНИЕ #4: Гарантированная уникальность по имени
            getUserExercises() {
                const exerciseMap = new Map();
                
                const addExercise = (ex) => {
                    if (!ex.name) return;
                    if (!exerciseMap.has(ex.name)) {
                        exerciseMap.set(ex.name, {
                            name: ex.name,
                            muscleGroup: ex.muscleGroup || 'Другое'
                        });
                    }
                };
                
                this.getPrograms().forEach(program => {
                    program.exercises.forEach(addExercise);
                });
                
                this.getHistory().forEach(entry => {
                    entry.exercises.forEach(addExercise);
                });
                
                return Array.from(exerciseMap.values());
            },

            getExerciseHistory(exerciseName) {
                const history = this.getHistory();
                const results = [];
                
                history.forEach(entry => {
                    entry.exercises.forEach(ex => {
                        if (ex.name === exerciseName) {
                            ex.sets.forEach(set => {
                                results.push({
                                    date: entry.date,
                                    weight: set.weight,
                                    reps: set.reps
                                });
                            });
                        }
                    });
                });
                
                return results.sort((a, b) => new Date(a.date) - new Date(b.date));
            },

            exportData() {
                try {
                    const data = {
                        userId: USER_ID,
                        exportDate: new Date().toISOString(),
                        programs: this.getPrograms(),
                        history: this.getHistory()
                    };
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `fitnary_backup_${USER_ID}.json`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);
                    tg.showPopup({ title: 'Экспорт', message: 'Файл успешно сформирован для скачивания' });
                } catch (e) {
                    tg.showPopup({ title: 'Ошибка', message: 'Не удалось скачать файл.' });
                }
            }
        };

        const ACTIVE_KEY = `twa_fitness_active_workout_${USER_ID}`;
        function saveActiveWorkout() {
            if (state.activeWorkout) {
                localStorage.setItem(ACTIVE_KEY, JSON.stringify(state.activeWorkout));
            } else {
                localStorage.removeItem(ACTIVE_KEY);
            }
        }

        function restoreActiveWorkout() {
            const saved = localStorage.getItem(ACTIVE_KEY);
            if (!saved) return false;
            try {
                state.activeWorkout = JSON.parse(saved);
                return true;
            } catch (e) {
                localStorage.removeItem(ACTIVE_KEY);
                return false;
            }
        }

        let state = {
            currentScreen: 'stats',
            currentTab: 'stats',
            activeWorkout: null,
            editingProgram: null,
            workoutTimer: null,
            selectedMuscleGroup: 'Грудь',
            selectedExercise: null
        };

        function switchTab(tab) {
            state.currentTab = tab;
            haptic('light');
            
            ['stats', 'programs', 'history'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.classList.remove('text-tgHint');
                    btn.classList.add('text-tgLink');
                } else {
                    btn.classList.remove('text-tgLink');
                    btn.classList.add('text-tgHint');
                }
            });
            
            navigate(tab);
        }

        // ИСПРАВЛЕНИЕ #1: Умная кнопка "Назад"
        function navigateBack() {
            haptic('light');
            const tabMap = {
                'program_edit': 'programs',
                'history_detail': 'history',
                'workout': state.currentTab || 'stats'
            };
            const target = tabMap[state.currentScreen] || state.currentTab || 'stats';
            navigate(target);
        }

        function navigate(screen, data = {}) {
            haptic('light');
            
            if (state.workoutTimer) {
                clearInterval(state.workoutTimer);
                state.workoutTimer = null;
            }
            
            state.currentScreen = screen;
            if (data.programId !== undefined) {
                state.editingProgram = data.programId ? DataAPI.getProgramById(data.programId) : { name: '', exercises: [] };
            }
            
            const content = document.getElementById('app-content');
            const title = document.getElementById('header-title');
            const backBtn = document.getElementById('btn-back');
            
            content.classList.remove('fade-in');
            void content.offsetWidth;
            content.classList.add('fade-in');

            // Кнопка назад видна только на вложенных экранах
            const isSubScreen = ['program_edit', 'history_detail', 'workout'].includes(screen);
            backBtn.classList.toggle('hidden', !isSubScreen);

            switch(screen) {
                case 'stats': renderStats(); break;
                case 'programs': renderPrograms(); break;
                case 'program_edit': renderProgramEdit(); break;
                case 'workout': renderWorkout(); break;
                case 'history': renderHistory(); break;
                case 'history_detail': renderHistoryDetail(data.entryId); break;
            }
        }

        function renderStats() {
            document.getElementById('header-title').innerText = 'Fitnary';
            const exercises = DataAPI.getUserExercises();
            
            const muscleGroupsHTML = MUSCLE_GROUPS.map(group => `
                <div onclick="selectMuscleGroup('${group}')" 
                    class="snap-center min-w-[120px] p-4 rounded-xl cursor-pointer transition-all ${
                        state.selectedMuscleGroup === group 
                            ? 'bg-tgLink text-white' 
                            : 'bg-tgSecondaryBg text-tgText'
                    }">
                    <div class="font-semibold text-center">${group}</div>
                </div>
            `).join('');
            
            const filteredExercises = exercises.filter(ex => ex.muscleGroup === state.selectedMuscleGroup);
            const exercisesHTML = filteredExercises.length ? filteredExercises.map(ex => `
                <div onclick="selectExercise('${esc(ex.name)}')" 
                    class="snap-center min-w-[140px] p-4 rounded-xl cursor-pointer transition-all ${
                        state.selectedExercise === ex.name 
                            ? 'bg-tgLink text-white' 
                            : 'bg-tgSecondaryBg text-tgText'
                    }">
                    <div class="font-medium text-center truncate">${esc(ex.name)}</div>
                </div>
            `).join('') : '<p class="text-tgHint text-sm px-4">Нет упражнений в этой группе</p>';
            
            document.getElementById('app-content').innerHTML = `
                <div class="bg-tgSecondaryBg p-4 rounded-xl mb-6">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-sm font-semibold text-tgHint">Прогресс</h3>
                        <span class="text-xs text-tgHint">щипок для зума</span>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="progressChart"></canvas>
                    </div>
                </div>
                
                <div class="mb-4">
                    <h3 class="text-sm font-semibold mb-2 text-tgHint">Группа мышц</h3>
                    <div class="flex overflow-x-auto gap-3 pb-2 snap-x scroll-container">
                        ${muscleGroupsHTML}
                    </div>
                </div>
                
                <div class="mb-4">
                    <h3 class="text-sm font-semibold mb-2 text-tgHint">Упражнения</h3>
                    <div class="flex overflow-x-auto gap-3 pb-2 snap-x scroll-container">
                        ${exercisesHTML}
                    </div>
                </div>
            `;
            
            renderChart();
        }

        // ИСПРАВЛЕНИЕ #5: График с фиксированной высотой и зумом
        function renderChart() {
            const ctx = document.getElementById('progressChart');
            if (!ctx) return;
            
            // Уничтожаем предыдущий график чтобы не рос
            const existingChart = Chart.getChart(ctx);
            if (existingChart) existingChart.destroy();
            
            if (!state.selectedExercise) {
                const context = ctx.getContext('2d');
                context.clearRect(0, 0, ctx.width, ctx.height);
                context.font = '14px sans-serif';
                context.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-hint-color') || '#8e8e93';
                context.textAlign = 'center';
                context.fillText('Выберите упражнение', ctx.width / 2, ctx.height / 2);
                return;
            }
            
            const history = DataAPI.getExerciseHistory(state.selectedExercise);
            if (history.length === 0) {
                const context = ctx.getContext('2d');
                context.clearRect(0, 0, ctx.width, ctx.height);
                context.font = '14px sans-serif';
                context.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-hint-color') || '#8e8e93';
                context.textAlign = 'center';
                context.fillText('Нет данных', ctx.width / 2, ctx.height / 2);
                return;
            }
            
            const dataByDate = {};
            history.forEach(h => {
                const date = new Date(h.date).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
                if (!dataByDate[date] || h.weight > dataByDate[date]) {
                    dataByDate[date] = h.weight;
                }
            });
            
            const labels = Object.keys(dataByDate);
            const data = Object.values(dataByDate);
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Вес (кг)',
                        data: data,
                        borderColor: getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-link-color') || '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.3,
                        fill: true,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        zoom: {
                            pan: {
                                enabled: true,
                                mode: 'x'
                            },
                            zoom: {
                                pinch: { enabled: true },
                                mode: 'x',
                                limits: { x: { min: 'original', max: 'original' } }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-hint-color') || '#8e8e93' }
                        },
                        x: {
                            ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-hint-color') || '#8e8e93' }
                        }
                    }
                }
            });
        }

        function selectMuscleGroup(group) {
            state.selectedMuscleGroup = group;
            state.selectedExercise = null;
            renderStats();
        }

        function selectExercise(name) {
            state.selectedExercise = name;
            renderStats();
        }

        // ИСПРАВЛЕНИЕ #3: Показываем упражнения в списке программ
        function renderPrograms() {
            document.getElementById('header-title').innerText = 'Программы';
            const programs = DataAPI.getPrograms();
            
            let listHTML = programs.length ? programs.map(p => {
                const exercisesPreview = p.exercises.slice(0, 3).map(ex => 
                    `${esc(ex.name)} ${ex.targetSets ?? 3}×${ex.targetReps ?? 10}`
                ).join(' • ');
                const moreCount = p.exercises.length > 3 ? ` +${p.exercises.length - 3}` : '';
                
                return `
                    <div class="bg-tgSecondaryBg p-4 rounded-xl mb-3">
                        <div class="flex justify-between items-start mb-2">
                            <div onclick="navigate('program_edit', {programId: '${p.id}'})" class="flex-1 active:opacity-70">
                                <div class="font-semibold">${esc(p.name)}</div>
                                <div class="text-tgHint text-xs mt-1 leading-tight">
                                    ${exercisesPreview || '<span class="italic">Нет упражнений</span>'}${moreCount}
                                </div>
                            </div>
                            <div class="flex gap-3 text-tgHint ml-2">
                                <button onclick="startWorkout('${p.id}')" class="text-tgLink text-xl"><i class="fa-solid fa-play"></i></button>
                                <button onclick="deleteProgram('${p.id}')" class="text-red-500 text-xl"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('') : '<p class="text-center text-tgHint mt-10">Нет созданных программ</p>';

            document.getElementById('app-content').innerHTML = `
                ${listHTML}
                <button onclick="navigate('program_edit', {programId: null})" 
                    class="w-full mt-4 bg-tgButton text-white font-semibold py-3 rounded-xl active:opacity-70 transition-opacity">
                    <i class="fa-solid fa-plus mr-2"></i> Создать программу
                </button>
            `;
        }

        function renderProgramEdit() {
            const isEdit = !!state.editingProgram && state.editingProgram.id;
            document.getElementById('header-title').innerText = isEdit ? 'Редактирование' : 'Новая программа';
            
            const prog = state.editingProgram || { name: '', exercises: [] };

            let exercisesHTML = prog.exercises.map((ex, idx) => `
                <div class="bg-tgSecondaryBg p-3 rounded-xl mb-2">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-medium">Упражнение ${idx + 1}</span>
                        <button onclick="removeExercise(${idx})" class="text-red-500"><i class="fa-solid fa-times"></i></button>
                    </div>
                    <input type="text" placeholder="Название (напр. Жим лежа)" value="${esc(ex.name)}" 
                        oninput="updateExercise(${idx}, 'name', this.value)"
                        class="w-full p-2 rounded-lg mb-2 text-sm">
                    <select onchange="updateExercise(${idx}, 'muscleGroup', this.value)" 
                        class="w-full p-2 rounded-lg mb-2 text-sm">
                        <option value="">Выберите группу мышц</option>
                        ${MUSCLE_GROUPS.map(g => `<option value="${g}" ${ex.muscleGroup === g ? 'selected' : ''}>${g}</option>`).join('')}
                    </select>
                    <div class="flex gap-2">
                        <div class="flex-1">
                            <label class="text-xs text-tgHint">Подходы</label>
                            <input type="number" value="${ex.targetSets ?? 3}" onchange="updateExercise(${idx}, 'targetSets', parseOptionalInt(this.value))"
                                class="w-full p-2 rounded-lg text-sm">
                        </div>
                        <div class="flex-1">
                            <label class="text-xs text-tgHint">Повторения</label>
                            <input type="number" value="${ex.targetReps ?? 10}" onchange="updateExercise(${idx}, 'targetReps', parseOptionalInt(this.value))"
                                class="w-full p-2 rounded-lg text-sm">
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('app-content').innerHTML = `
                <input type="text" id="prog-name" placeholder="Название программы" value="${esc(prog.name)}" 
                    oninput="updateProgramName(this.value)"
                    class="w-full p-3 rounded-xl mb-4 text-lg font-semibold">
                <div id="exercises-list">
                    ${exercisesHTML}
                </div>
                <button onclick="addExercise()" class="w-full py-3 border-2 border-dashed border-tgHint rounded-xl text-tgHint mt-2 active:bg-tgSecondaryBg">
                    <i class="fa-solid fa-plus mr-2"></i> Добавить упражнение
                </button>
                <button onclick="saveProgram()" 
                    class="w-full mt-4 bg-tgButton text-white font-semibold py-3 rounded-xl active:opacity-70 transition-opacity">
                    <i class="fa-solid fa-save mr-2"></i> Сохранить программу
                </button>
            `;
        }

        function updateProgramName(value) {
            if (!state.editingProgram) state.editingProgram = { name: '', exercises: [] };
            state.editingProgram.name = value;
        }

        function renderWorkout() {
            const w = state.activeWorkout;
            document.getElementById('header-title').innerText = 'Тренировка';
            
            let exercisesHTML = w.exercises.map((ex, exIdx) => {
                let setsHTML = ex.sets.map((s, sIdx) => `
                    <div class="flex items-center gap-2 bg-tgBg p-2 rounded-lg mb-1">
                        <span class="text-tgHint w-6">${sIdx + 1}.</span>
                        <input type="number" placeholder="Вес" value="${s.weight}" 
                            onchange="updateSet(${exIdx}, ${sIdx}, 'weight', parseFloat(this.value)||0)"
                            class="flex-1 p-1 rounded text-center text-sm">
                        <span class="text-tgHint">кг ×</span>
                        <input type="number" placeholder="Повт" value="${s.reps}" 
                            onchange="updateSet(${exIdx}, ${sIdx}, 'reps', parseOptionalInt(this.value) ?? 0)"
                            class="flex-1 p-1 rounded text-center text-sm">
                        <button onclick="removeSet(${exIdx}, ${sIdx})" class="text-red-500 px-2"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `).join('');

                return `
                    <div class="bg-tgSecondaryBg p-3 rounded-xl mb-4">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-lg">${esc(ex.name)}</h3>
                            <span class="text-xs text-tgHint">Цель: ${ex.targetSets ?? 3} × ${ex.targetReps ?? 10}</span>
                        </div>
                        ${setsHTML}
                        <button onclick="addSet(${exIdx})" class="w-full py-2 mt-2 bg-tgBg rounded-lg text-tgLink text-sm font-medium active:opacity-70">
                            + Добавить подход
                        </button>
                    </div>
                `;
            }).join('');

            document.getElementById('app-content').innerHTML = `
                <div class="text-center mb-4">
                    <div class="text-3xl font-mono font-bold text-tgLink" id="workout-timer">00:00:00</div>
                    <div class="text-tgHint text-sm">Время тренировки</div>
                </div>
                ${exercisesHTML}
                <button onclick="finishWorkout()" 
                    class="w-full mt-4 bg-red-600 text-white font-semibold py-3 rounded-xl active:opacity-70 transition-opacity">
                    <i class="fa-solid fa-stop mr-2"></i> Завершить тренировку
                </button>
            `;
            startTimer();
        }

        function renderHistory() {
            document.getElementById('header-title').innerText = 'История';
            const history = DataAPI.getHistory().sort((a, b) => new Date(b.date) - new Date(a.date));
            
            let listHTML = history.length ? history.map(h => {
                const date = new Date(h.date);
                const dateStr = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
                const timeStr = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                const durationMin = Math.round(h.duration / 60);
                const totalSets = h.exercises.reduce((acc, ex) => acc + ex.sets.length, 0);

                return `
                    <div onclick='navigate("history_detail", {entryId: "${h.id}"})' 
                        class="bg-tgSecondaryBg p-4 rounded-xl mb-3 active:scale-95 transition-transform cursor-pointer">
                        <div class="flex justify-between items-start mb-2">
                            <div class="font-semibold">${esc(h.programName)}</div>
                            <div class="text-tgHint text-sm">${dateStr}</div>
                        </div>
                        <div class="flex gap-4 text-sm text-tgHint">
                            <span><i class="fa-regular fa-clock mr-1"></i> ${durationMin} мин</span>
                            <span><i class="fa-solid fa-layer-group mr-1"></i> ${totalSets} подходов</span>
                            <span>${timeStr}</span>
                        </div>
                    </div>
                `;
            }).join('') : '<p class="text-center text-tgHint mt-10">История пуста</p>';

            document.getElementById('app-content').innerHTML = listHTML;
        }

        function renderHistoryDetail(entryId) {
            document.getElementById('header-title').innerText = 'Детали';
            const entry = DataAPI.getHistoryEntryById(entryId);
            if (!entry) {
                document.getElementById('app-content').innerHTML = '<p class="text-center text-tgHint">Запись не найдена</p>';
                return;
            }
            
            const date = new Date(entry.date).toLocaleString('ru-RU');
            
            let exHTML = entry.exercises.map(ex => {
                let setsHTML = ex.sets.map((s, i) => `
                    <div class="flex justify-between py-1 border-b border-tgBg last:border-0">
                        <span class="text-tgHint">${i + 1}.</span>
                        <span>${s.weight} кг × ${s.reps} повт</span>
                    </div>
                `).join('');
                return `
                    <div class="mb-4">
                        <h3 class="font-bold mb-2">${esc(ex.name)}</h3>
                        <div class="bg-tgSecondaryBg p-3 rounded-xl text-sm">
                            ${setsHTML}
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('app-content').innerHTML = `
                <div class="text-center mb-6">
                    <h2 class="text-xl font-bold">${esc(entry.programName)}</h2>
                    <p class="text-tgHint">${date}</p>
                </div>
                ${exHTML}
            `;
        }

        function addExercise() {
            if (!state.editingProgram) state.editingProgram = { name: '', exercises: [] };
            state.editingProgram.exercises.push({ id: createId(), name: '', muscleGroup: '', targetSets: 3, targetReps: 10 });
            renderProgramEdit();
        }

        function removeExercise(idx) {
            state.editingProgram.exercises.splice(idx, 1);
            renderProgramEdit();
        }

        function updateExercise(idx, field, value) {
            if (!state.editingProgram) state.editingProgram = { name: '', exercises: [] };
            state.editingProgram.exercises[idx][field] = value;
        }

        // ИСПРАВЛЕНИЕ #2: Отклик при сохранении + гарантированный переход
        function saveProgram() {
            const name = document.getElementById('prog-name').value.trim();
            if (!name) { 
                tg.showPopup({message: 'Введите название программы'}); 
                return; 
            }
            if (state.editingProgram.exercises.length === 0) { 
                tg.showPopup({message: 'Добавьте хотя бы одно упражнение'}); 
                return; 
            }

            state.editingProgram.name = name;
            let programs = DataAPI.getPrograms();
            
            const existIdx = programs.findIndex(p => p.id === state.editingProgram.id);
            if (existIdx > -1) {
                programs[existIdx] = state.editingProgram;
            } else {
                state.editingProgram.id = createId();
                programs.push(state.editingProgram);
            }

            DataAPI.savePrograms(programs);
            haptic('success');
            
            // Показываем уведомление об успехе
            tg.showPopup({ 
                title: 'Сохранено ✓', 
                message: `Программа "${name}" успешно сохранена` 
            });
            
            state.editingProgram = null;
            
            // Небольшая задержка чтобы пользователь увидел уведомление
            setTimeout(() => {
                navigate('programs');
            }, 300);
        }

        async function deleteProgram(id) {
            const ok = await appConfirm('Удалить программу?');
            if (!ok) return;
            let programs = DataAPI.getPrograms().filter(p => p.id !== id);
            DataAPI.savePrograms(programs);
            renderPrograms();
        }

        function startWorkout(programId) {
            const program = DataAPI.getProgramById(programId);
            if (!program) {
                tg.showPopup({message: 'Программа не найдена'});
                return;
            }
            if (program.exercises.length === 0) {
                tg.showPopup({message: 'В программе нет упражнений'});
                return;
            }

            state.activeWorkout = {
                programId: program.id,
                programName: program.name,
                startTime: Date.now(),
                exercises: program.exercises.map(ex => ({
                    name: ex.name,
                    muscleGroup: ex.muscleGroup,
                    targetSets: ex.targetSets,
                    targetReps: ex.targetReps,
                    sets: []
                }))
            };
            saveActiveWorkout();
            navigate('workout');
        }

        function addSet(exIdx) {
            const exercise = state.activeWorkout.exercises[exIdx];
            const sets = exercise.sets;
            
            let defaultWeight = 0;
            let defaultReps = exercise.targetReps ?? 10;
            
            if (sets.length > 0) {
                const lastSet = sets[sets.length - 1];
                defaultWeight = lastSet.weight;
                defaultReps = lastSet.reps;
            }
            
            sets.push({ weight: defaultWeight, reps: defaultReps });
            saveActiveWorkout();
            renderWorkout();
        }

        function removeSet(exIdx, sIdx) {
            state.activeWorkout.exercises[exIdx].sets.splice(sIdx, 1);
            saveActiveWorkout();
            renderWorkout();
        }

        function updateSet(exIdx, sIdx, field, value) {
            state.activeWorkout.exercises[exIdx].sets[sIdx][field] = value;
            saveActiveWorkout();
        }

        function startTimer() {
            if (state.workoutTimer) clearInterval(state.workoutTimer);
            
            const update = () => {
                if (!state.activeWorkout) return;
                const elapsed = Date.now() - state.activeWorkout.startTime;
                const h = Math.floor(elapsed / 3600000).toString().padStart(2, '0');
                const m = Math.floor((elapsed % 3600000) / 60000).toString().padStart(2, '0');
                const s = Math.floor((elapsed % 60000) / 1000).toString().padStart(2, '0');
                const el = document.getElementById('workout-timer');
                if(el) el.innerText = `${h}:${m}:${s}`;
            };
            
            update();
            state.workoutTimer = setInterval(update, 1000);
        }

        async function finishWorkout() {
            const ok = await appConfirm('Завершить и сохранить тренировку?');
            if (!ok) return;

            if (state.workoutTimer) {
                clearInterval(state.workoutTimer);
                state.workoutTimer = null;
            }
            
            const w = state.activeWorkout;
            const entry = {
                id: createId(),
                date: new Date(w.startTime).toISOString(),
                duration: Math.round((Date.now() - w.startTime) / 1000),
                programName: w.programName,
                exercises: w.exercises
            };

            let history = DataAPI.getHistory();
            history.push(entry);
            DataAPI.saveHistory(history);
            
            state.activeWorkout = null;
            saveActiveWorkout();
            haptic('success');
            navigate('stats');
        }

        document.addEventListener('visibilitychange', () => {
            if (state.currentScreen === 'workout' && state.activeWorkout) {
                startTimer();
            }
        });

        if (restoreActiveWorkout()) {
            navigate('workout');
        } else {
            switchTab('stats');
        }
    </script>
</body>
</html>
