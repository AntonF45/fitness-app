<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fitnary</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tgBg: 'var(--tg-theme-bg-color, #1c1c1e)',
                        tgText: 'var(--tg-theme-text-color, #ffffff)',
                        tgHint: 'var(--tg-theme-hint-color, #8e8e93)',
                        tgLink: 'var(--tg-theme-link-color, #3b82f6)',
                        tgButton: 'var(--tg-theme-button-color, #3b82f6)',
                        tgSecondaryBg: 'var(--tg-theme-secondary-bg-color, #2c2c2e)'
                    }
                }
            }
        };
    </script>

    <style>
        :root {
            --bottom-nav-height: 72px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --card-bg: rgba(59, 130, 246, 0.04);
            --card-border: rgba(59, 130, 246, 0.12);
        }

        body {
            background-color: var(--tg-theme-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: calc(var(--bottom-nav-height) + var(--safe-bottom) + 16px);
        }

        input, select {
            background-color: var(--tg-theme-secondary-bg-color, #2c2c2e);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid rgba(142, 142, 147, 0.3);
            border-radius: 12px;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        .scroll-container {
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-padding-left: 16px;
            scroll-padding-right: 16px;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        .snap-x {
            scroll-snap-type: x mandatory;
        }

        .snap-center {
            scroll-snap-align: center;
        }

        /* НОВЫЙ СТИЛЬ ЧИПОВ — как у графика */
        .stat-chip {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            transition: all 0.2s ease;
        }

        .stat-chip:active {
            transform: scale(0.96);
        }

        .stat-chip.active {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.4);
            color: #ffffff;
        }

        .stat-chip.inactive {
            color: var(--tg-theme-hint-color, #8e8e93);
        }

        .card-enter {
            animation: cardIn 0.2s ease-out both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* СТИЛЬ КАРТОЧКИ ГРАФИКА */
        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
        }

        .chart-wrapper {
            position: relative;
            height: 220px;
            width: 100%;
        }

        .chart-wrapper canvas {
            touch-action: pan-x;
        }

        /* ПЕРИОД-ФИЛЬТР */
        .period-filter {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
            border-radius: 12px;
        }

        .period-btn {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--tg-theme-hint-color, #8e8e93);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .period-btn.active {
            background: rgba(59, 130, 246, 0.25);
            color: #ffffff;
        }

        .period-btn:active {
            transform: scale(0.95);
        }

        /* ТЕПЛОВАЯ КАРТА */
        .heatmap-cell {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            background: rgba(59, 130, 246, 0.08);
        }

        .heatmap-cell.level-1 { background: rgba(59, 130, 246, 0.2); }
        .heatmap-cell.level-2 { background: rgba(59, 130, 246, 0.4); }
        .heatmap-cell.level-3 { background: rgba(59, 130, 246, 0.6); }
        .heatmap-cell.level-4 { background: rgba(59, 130, 246, 0.85); }

        /* СТАТИСТИЧЕСКИЕ БЛОКИ */
        .stat-block {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
        }

        .set-drop {
            border-left: 3px solid #f97316;
            background: linear-gradient(90deg, rgba(249, 115, 22, 0.08), transparent);
        }

        .bodyweight-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
        }

        .drop-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(249, 115, 22, 0.2);
            color: #fb923c;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4ade80;
        }

        .keyboard-hidden {
            display: none !important;
        }

        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 50;
            margin-top: 4px;
            background: var(--tg-theme-secondary-bg-color, #2c2c2e);
            border: 1px solid rgba(142, 142, 147, 0.3);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-height: 200px;
            overflow-y: auto;
        }
        .autocomplete-item {
            padding: 12px 16px;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.15s;
        }
        .autocomplete-item:last-child {
            border-bottom: none;
        }
        .autocomplete-item:hover, .autocomplete-item:active {
            background: rgba(255,255,255,0.08);
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.65);
            padding: 16px;
        }

        .modal-sheet {
            width: 100%;
            max-width: 480px;
            background: var(--tg-theme-secondary-bg-color, #2c2c2e);
            color: var(--tg-theme-text-color, #ffffff);
            border-radius: 24px;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            animation: modalIn 0.2s ease-out;
        }

        /* Фиксированный блок графика — не прыгает */
.chart-container-fixed {
    height: 260px;
    position: relative;
    overflow: hidden;
}

.chart-wrapper-fixed {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
}

/* Верхняя панель графика с месяцами/фильтром */
.chart-top-bar {
    position: relative;
    height: 40px;
    overflow: hidden;
    margin-bottom: 8px;
}

.chart-top-slider {
    display: flex;
    width: 200%;
    height: 100%;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.chart-top-slider.show-filter {
    transform: translateX(-50%);
}

.chart-top-slider > div {
    width: 50%;
    height: 100%;
    flex-shrink: 0;
}

/* Кнопка-фильтр */
.filter-toggle-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: rgba(59, 130, 246, 0.12);
    border: 1px solid rgba(59, 130, 246, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--tg-theme-link-color, #3b82f6);
    transition: all 0.2s ease;
    flex-shrink: 0;
}

.filter-toggle-btn:active {
    transform: scale(0.92);
    background: rgba(59, 130, 246, 0.2);
}

.filter-toggle-btn.active {
    background: rgba(59, 130, 246, 0.25);
}

/* Пустое состояние графика */
.chart-empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--tg-theme-hint-color, #8e8e93);
    gap: 8px;
}

/* Ачивки */
.achievement-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 14px;
    transition: all 0.2s ease;
}

.achievement-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
}

.achievement-icon.gold { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
.achievement-icon.blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
.achievement-icon.green { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
.achievement-icon.purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; }

/* Плавное обновление чипов */
.chip-update {
    animation: chipFade 0.25s ease-out;
}

@keyframes chipFade {
    from { opacity: 0.5; transform: translateY(2px); }
    to { opacity: 1; transform: translateY(0); }
}

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>

<body class="min-h-screen">
    <main id="app-content" class="px-4 pt-4"></main>

    <nav id="bottom-nav"
        class="fixed bottom-0 left-0 right-0 bg-tgBg border-t border-tgSecondaryBg flex justify-around z-20 transition-all duration-200"
        style="padding-bottom: max(12px, var(--safe-bottom));">

        <button onclick="switchTab('stats')" id="tab-stats" role="tab" aria-selected="false"
            class="flex flex-col items-center justify-center min-h-[56px] min-w-[64px] text-tgHint">
            <i class="fa-solid fa-chart-line text-xl mb-1"></i>
            <span class="text-xs font-medium">Статистика</span>
        </button>

        <button onclick="switchTab('programs')" id="tab-programs" role="tab" aria-selected="true"
            class="flex flex-col items-center justify-center min-h-[56px] min-w-[64px] text-tgLink">
            <i class="fa-solid fa-list-check text-xl mb-1"></i>
            <span class="text-xs font-medium">Программы</span>
        </button>

        <button onclick="switchTab('history')" id="tab-history" role="tab" aria-selected="false"
            class="flex flex-col items-center justify-center min-h-[56px] min-w-[64px] text-tgHint">
            <i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i>
            <span class="text-xs font-medium">История</span>
        </button>
    </nav>

    <script>
        function esc(str = '') {
            return String(str)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function createId() {
            return typeof crypto !== 'undefined' && crypto.randomUUID
                ? crypto.randomUUID()
                : Date.now().toString(36) + Math.random().toString(36).slice(2);
        }

        const MONTHS_RU = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];
        const MONTHS_FULL = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        const WEEKDAYS_RU = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
        const WEEKDAYS_SHORT = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

        const DEFAULT_MUSCLE_GROUPS = ['Грудь', 'Спина', 'Ноги', 'Плечи', 'Руки'];
        
        function getMuscleGroups() {
            try {
                const saved = localStorage.getItem(`twa_fitness_muscle_groups_${USER_ID}`);
                return saved ? JSON.parse(saved) : [...DEFAULT_MUSCLE_GROUPS];
            } catch (e) {
                return [...DEFAULT_MUSCLE_GROUPS];
            }
        }

        function saveMuscleGroups(groups) {
            localStorage.setItem(`twa_fitness_muscle_groups_${USER_ID}`, JSON.stringify(groups));
        }

        const tg = window.Telegram.WebApp;

        try { tg.ready(); tg.expand(); } catch (error) { console.warn('Telegram init error:', error); }

        const USER_ID = tg.initDataUnsafe?.user?.id || 'local_test_user_' + Math.random().toString(36).substr(2, 9);

        function haptic(type = 'light') {
            try {
                if (type === 'success' || type === 'error' || type === 'warning') {
                    tg.HapticFeedback?.notificationOccurred(type);
                } else {
                    tg.HapticFeedback?.impactOccurred(type);
                }
            } catch (error) { console.warn('Haptic error:', error); }
        }

        function showAlert(message) {
            try { tg.showAlert(message); } catch (error) { alert(message); }
        }

        function showConfirm(message, callback) {
            try { tg.showConfirm(message, callback); } catch (error) { callback(confirm(message)); }
        }

        try { tg.BackButton.onClick(() => navigateBack()); } catch (error) { console.warn('BackButton error:', error); }

        function updateBackButton(isSubScreen) {
            try {
                if (isSubScreen) tg.BackButton.show();
                else tg.BackButton.hide();
            } catch (error) { console.warn('BackButton update error:', error); }
        }

        function clearMainButton() {
            try { tg.MainButton.hide(); } catch (e) {}
        }

        const DataAPI = {
            _key(type) { return `twa_fitness_${type}_${USER_ID}`; },
            getPrograms() {
                try {
                    const data = JSON.parse(localStorage.getItem(this._key('programs')) || '[]');
                    return data.map(p => ({
                        ...p,
                        exercises: (p.exercises || []).map(ex => ({ ...ex, exerciseType: ex.exerciseType || 'weighted', supersetId: ex.supersetId || null }))
                    }));
                } catch (error) { return []; }
            },
            savePrograms(data) { localStorage.setItem(this._key('programs'), JSON.stringify(data)); },
            getHistory() {
                try { return JSON.parse(localStorage.getItem(this._key('history')) || '[]'); } catch (error) { return []; }
            },
            saveHistory(data) { localStorage.setItem(this._key('history'), JSON.stringify(data)); },
            getProgramById(id) { return this.getPrograms().find(program => program.id === id); },
            getHistoryEntryById(id) { return this.getHistory().find(entry => entry.id === id); },

            getUserExercises() {
                const exerciseMap = new Map();
                const addExercise = exercise => {
                    if (!exercise || !exercise.name) return;
                    if (!exerciseMap.has(exercise.name)) {
                        exerciseMap.set(exercise.name, {
                            name: exercise.name,
                            muscleGroup: exercise.muscleGroup || 'Другое',
                            exerciseType: exercise.exerciseType || 'weighted'
                        });
                    }
                };
                this.getPrograms().forEach(program => (program.exercises || []).forEach(addExercise));
                this.getHistory().forEach(entry => (entry.exercises || []).forEach(addExercise));
                return Array.from(exerciseMap.values());
            },

            getExerciseHistory(exerciseName) {
                const results = [];
                this.getHistory().forEach(entry => {
                    (entry.exercises || []).forEach(exercise => {
                        if (exercise.name === exerciseName) {
                            (exercise.sets || []).forEach(set => {
                                results.push({ date: entry.date, weight: set.weight, reps: set.reps });
                            });
                        }
                    });
                });
                return results.sort((a, b) => new Date(a.date) - new Date(b.date));
            }
        };

        const ACTIVE_KEY = `twa_fitness_active_workout_${USER_ID}`;

        function saveActiveWorkout() {
            if (state.activeWorkout) localStorage.setItem(ACTIVE_KEY, JSON.stringify(state.activeWorkout));
            else localStorage.removeItem(ACTIVE_KEY);
        }

        function restoreActiveWorkout() {
            const saved = localStorage.getItem(ACTIVE_KEY);
            if (!saved) return false;
            try {
                state.activeWorkout = JSON.parse(saved);
                return true;
            } catch (error) {
                localStorage.removeItem(ACTIVE_KEY);
                return false;
            }
        }

        let state = {
            currentScreen: 'programs',
            currentTab: 'programs',
            activeWorkout: null,
            editingProgram: null,
            workoutTimer: null,
            selectedMuscleGroup: 'Грудь',
            selectedExercise: null,
            supersetActiveId: null,
            selectedPeriod: 'month',
            selectedMonthIndex: null,
        };

        function updateTabUI(activeTab) {
            ['stats', 'programs', 'history'].forEach(tab => {
                const button = document.getElementById(`tab-${tab}`);
                if (!button) return;
                if (tab === activeTab) {
                    button.classList.remove('text-tgHint');
                    button.classList.add('text-tgLink');
                    button.setAttribute('aria-selected', 'true');
                } else {
                    button.classList.remove('text-tgLink');
                    button.classList.add('text-tgHint');
                    button.setAttribute('aria-selected', 'false');
                }
            });
        }

        function openProgramsScreen() {
            state.currentTab = 'programs';
            state.currentScreen = 'programs';
            updateTabUI('programs');
            updateBackButton(false);
            clearMainButton();
            renderPrograms();
        }

        function navigateToTab(tab) {
            state.currentTab = tab;
            updateTabUI(tab);
            navigate(tab);
        }

        function switchTab(tab) {
            if (state.currentScreen === 'workout' && state.activeWorkout && tab !== 'workout') {
                promptWorkoutExit(tab);
                return;
            }
            haptic('light');
            navigateToTab(tab);
        }

        function navigateBack() {
            if (state.currentScreen === 'workout' && state.activeWorkout) {
                promptWorkoutExit('programs');
                return;
            }
            haptic('light');
            const tabMap = { program_edit: 'programs', history_detail: 'history', workout: 'programs' };
            const target = tabMap[state.currentScreen] || state.currentTab || 'programs';
            navigateToTab(target);
        }

        function navigate(screen, data = {}) {
            haptic('light');
            stopWorkoutTimer();
            state.currentScreen = screen;
            state.supersetActiveId = null;
            if (data.programId !== undefined) {
                state.editingProgram = data.programId ? DataAPI.getProgramById(data.programId) : { name: '', exercises: [] };
            }
            const isSubScreen = ['program_edit', 'history_detail', 'workout'].includes(screen);
            updateBackButton(isSubScreen);
            clearMainButton();

            switch (screen) {
                case 'stats': renderStats(); break;
                case 'programs': renderPrograms(); break;
                case 'program_edit': renderProgramEdit(); break;
                case 'workout': renderWorkout(); break;
                case 'history': renderHistory(); break;
                case 'history_detail': renderHistoryDetail(data.entryId); break;
            }
        }

                // ==========================================
        // НОВАЯ ВКЛАДКА СТАТИСТИКА
        // ==========================================
        
        function getFilteredHistory(history, period) {
            if (period === 'all') return history;
            
            if (state.selectedMonthIndex !== null) {
                const year = new Date().getFullYear();
                const month = state.selectedMonthIndex;
                return history.filter(item => {
                    const d = new Date(item.date);
                    return d.getFullYear() === year && d.getMonth() === month;
                });
            }
            
            const now = new Date();
            let cutoff;
            if (period === 'week') cutoff = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            else if (period === 'month') cutoff = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
            else if (period === 'quarter') cutoff = new Date(now.getTime() - 90 * 24 * 60 * 60 * 1000);
            return history.filter(item => new Date(item.date) >= cutoff);
        }

        function getAvailableMonthsForExercise(exerciseName) {
            if (!exerciseName) {
                const now = new Date();
                const months = [];
                for (let i = 5; i >= 0; i--) {
                    const m = new Date(now.getFullYear(), now.getMonth() - i, 1).getMonth();
                    months.push({ index: m, label: MONTHS_FULL[m] });
                }
                return months;
            }
            
            const history = DataAPI.getExerciseHistory(exerciseName);
            const monthSet = new Set();
            history.forEach(h => {
                const d = new Date(h.date);
                if (d.getFullYear() === new Date().getFullYear()) {
                    monthSet.add(d.getMonth());
                }
            });
            
            if (monthSet.size === 0) {
                const now = new Date();
                for (let i = 5; i >= 0; i--) {
                    monthSet.add(new Date(now.getFullYear(), now.getMonth() - i, 1).getMonth());
                }
            }
            
            return Array.from(monthSet).sort((a, b) => a - b).map(idx => ({ index: idx, label: MONTHS_FULL[idx] }));
        }

        function renderStats() {
            const exercises = DataAPI.getUserExercises();
            const muscleGroups = getMuscleGroups();

            const muscleGroupsHTML = muscleGroups.map(group => `
                <button onclick="selectMuscleGroup('${group}')" role="tab" aria-selected="${state.selectedMuscleGroup === group}"
                    class="stat-chip snap-center min-w-[80px] px-3 py-2 rounded-xl text-xs font-medium whitespace-nowrap ${
                        state.selectedMuscleGroup === group ? 'active' : 'inactive'
                    }">${group}</button>
            `).join('');

            const filteredExercises = exercises.filter(ex => ex.muscleGroup === state.selectedMuscleGroup);
            const exercisesHTML = filteredExercises.length
                ? filteredExercises.map(ex => `
                    <button onclick="selectExercise('${esc(ex.name)}')" role="tab" aria-selected="${state.selectedExercise === ex.name}"
                        class="stat-chip snap-center min-w-[110px] px-3 py-2 rounded-xl text-xs font-medium text-center ${
                            state.selectedExercise === ex.name ? 'active' : 'inactive'
                        }">${esc(ex.name)}</button>
                `).join('')
                : '<p class="text-tgHint text-xs px-4 py-2">Нет упражнений в этой группе</p>';

            const availableMonths = getAvailableMonthsForExercise(state.selectedExercise);
            const monthsHTML = availableMonths.map(m => `

        function toggleFilterPanel() {
            const slider = document.getElementById('chart-top-slider');
            const btn = document.getElementById('filter-toggle-btn');
            if (!slider) return;
            slider.classList.toggle('show-filter');
            if (btn) btn.classList.toggle('active');
            haptic('light');
        }

        function selectMonthFilter(monthIndex) {
            state.selectedMonthIndex = monthIndex;
            state.selectedPeriod = 'month';
            haptic('light');
            updatePeriodButtons();
            updateChartAndAchievements();
        }

        function selectPeriod(period) {
            state.selectedPeriod = period;
            state.selectedMonthIndex = null;
            haptic('light');
            updatePeriodButtons();
            updateChartAndAchievements();
        }

        function updatePeriodButtons() {
            document.querySelectorAll('.period-btn').forEach(btn => {
                const text = btn.textContent.trim();
                const periodMap = { 'Неделя': 'week', 'Месяц': 'month', '3 мес': 'quarter', 'Всё': 'all' };
                
                // Проверка для кнопок периода
                let isActive = periodMap[text] === state.selectedPeriod;
                
                // Проверка для кнопок месяцев (если они есть в этом блоке)
                if (state.selectedMonthIndex !== null && !periodMap[text]) {
                    const monthName = btn.textContent.trim();
                    isActive = MONTHS_FULL[state.selectedMonthIndex] === monthName;
                }
                
                btn.classList.toggle('active', isActive);
            });

        function updateChartAndAchievements() {
            if (state.selectedExercise) {
                renderChart();

                const empty = document.getElementById('chart-empty-state');
                if (empty) empty.style.display = 'flex';
                const canvas = document.getElementById('progressChart');
                if (canvas) {
                    const existing = Chart.getChart(canvas);
                    if (existing) existing.destroy();
                }
            }

                achContainer.innerHTML = state.selectedExercise ? renderAchievements() : '';

                setTimeout(() => achContainer.classList.remove('chip-update'), 250);
            }
        }

        function selectMuscleGroup(group) {
            state.selectedMuscleGroup = group;
            state.selectedExercise = null;
            state.selectedMonthIndex = null;
            haptic('light');
            
            const exercises = DataAPI.getUserExercises();
            const filtered = exercises.filter(ex => ex.muscleGroup === group);
            const container = document.getElementById('exercises-container');
            
            if (container) {
                container.innerHTML = filtered.length
                    ? filtered.map(ex => `
                        <button onclick="selectExercise('${esc(ex.name)}')" role="tab" aria-selected="false"
                            class="stat-chip snap-center min-w-[110px] px-3 py-2 rounded-xl text-xs font-medium text-center inactive chip-update">${esc(ex.name)}</button>
                    `).join('')
                    : '<p class="text-tgHint text-xs px-4 py-2">Нет упражнений в этой группе</p>';
                
                const empty = document.getElementById('chart-empty-state');

                    if (existing) existing.destroy();

                const achContainer = document.getElementById('achievements-container');
                if (achContainer) achContainer.innerHTML = '';
            } else {
                renderStats();
            }
        }

        function selectExercise(name) {
            const wasSelected = state.selectedExercise === name;
            state.selectedExercise = wasSelected ? null : name;
            state.selectedMonthIndex = null;
            haptic('light');
            
            const container = document.getElementById('exercises-container');
            if (container) {
                container.querySelectorAll('.stat-chip').forEach(btn => {
                    const isActive = btn.textContent.trim() === state.selectedExercise;
                    btn.classList.toggle('active', isActive);
                    btn.classList.toggle('inactive', !isActive);
                    btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
                });
            }
            
            // Обновляем список месяцев для нового упражнения
            const availableMonths = getAvailableMonthsForExercise(state.selectedExercise);
            const monthsHTML = availableMonths.map(m => `
                <button onclick="selectMonthFilter(${m.index})" class="period-btn ${state.selectedMonthIndex === m.index ? 'active' : ''}">${m.label}</button>
            `).join('');
            const monthsContainer = document.getElementById('months-scroll');
            if (monthsContainer) monthsContainer.innerHTML = monthsHTML;

            updateChartAndAchievements();
        }

        function renderAchievements() {
            const history = DataAPI.getExerciseHistory(state.selectedExercise);
            const filtered = getFilteredHistory(history, state.selectedPeriod);
            
            if (filtered.length === 0) {
                return `
                    <div class="chart-card rounded-2xl p-6 text-center card-enter" style="animation-delay: 0.2s">
                        <i class="fa-solid fa-trophy text-2xl text-tgHint mb-2"></i>
                        <div class="text-tgHint text-sm">Нет данных за выбранный период</div>
                    </div>
                `;
            }

            const maxWeight = Math.max(...filtered.map(h => h.weight));
            const maxWeightDate = filtered.find(h => h.weight === maxWeight)?.date;
            const avgWeight = (filtered.reduce((s, h) => s + h.weight, 0) / filtered.length).toFixed(1);
            const totalSets = filtered.length;
            const totalVolume = filtered.reduce((s, h) => s + h.weight * h.reps, 0);
            const avgReps = (filtered.reduce((s, h) => s + h.reps, 0) / filtered.length).toFixed(0);
            
            let bestStreak = 0;
            let currentStreak = 0;
            let prevWeight = 0;
            const sortedByDate = [...filtered].sort((a, b) => new Date(a.date) - new Date(b.date));
            sortedByDate.forEach(h => {
                if (h.weight > prevWeight) {
                    currentStreak++;
                    bestStreak = Math.max(bestStreak, currentStreak);
                } else {
                    currentStreak = 0;
                }
                prevWeight = h.weight;
            });

            const achievements = [
                {
                    icon: 'fa-crown',
                    color: 'gold',
                    label: 'Личный рекорд',
                    value: `${maxWeight} кг`,
                    sub: maxWeightDate ? new Date(maxWeightDate).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) : ''
                },
                {
                    icon: 'fa-chart-line',
                    color: 'blue',
                    label: 'Средний вес',
                    value: `${avgWeight} кг`,
                    sub: `${avgReps} повт. в среднем`
                },
                {
                    icon: 'fa-fire',
                    color: 'green',
                    label: 'Серия роста',
                    value: `${bestStreak} тр.`,
                    sub: 'подряд с прогрессом'
                },
                {
                    icon: 'fa-dumbbell',
                    color: 'purple',
                    label: 'Всего подходов',
                    value: totalSets,
                    sub: `${(totalVolume / 1000).toFixed(1)}т тоннаж`
                }
            ];

            return `
                <div class="mb-4 card-enter" style="animation-delay: 0.2s">
                    <div class="text-xs font-semibold text-tgHint uppercase tracking-wide mb-2 px-1">Достижения</div>
                    <div class="grid grid-cols-2 gap-2">
                        ${achievements.map(a => `
                            <div class="achievement-card">
                                <div class="flex items-start gap-3">
                                    <div class="achievement-icon ${a.color}">
                                        <i class="fa-solid ${a.icon}"></i>
                                    </div>
                                    <div class="min-w-0 flex-1">
                                        <div class="text-[10px] text-tgHint uppercase tracking-wide leading-tight">${a.label}</div>
                                        <div class="text-base font-bold mt-0.5 leading-tight">${a.value}</div>
                                        ${a.sub ? `<div class="text-[10px] text-tgHint mt-0.5 leading-tight">${a.sub}</div>` : ''}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        const crosshairPlugin = {
            id: 'crosshair',
            afterDraw(chart) {
                if (chart._active && chart._active.length) {
                    const activePoint = chart._active[0];
                    const ctx = chart.ctx;
                    const x = activePoint.element.x;
                    const topY = chart.scales.y.top;
                    const bottomY = chart.scales.y.bottom;

                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(x, topY);
                    ctx.lineTo(x, bottomY);
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                    ctx.setLineDash([4, 4]);
                    ctx.stroke();
                    ctx.restore();

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(x, activePoint.element.y, 6, 0, 2 * Math.PI);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x, activePoint.element.y, 4, 0, 2 * Math.PI);
                    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-link-color') || '#3b82f6';
                    ctx.fill();
                    ctx.restore();
                }
            }
        };

        function renderChart() {
            const ctx = document.getElementById('progressChart');
            if (!ctx) return;
            
            const existingChart = Chart.getChart(ctx);
            if (existingChart) existingChart.destroy();
            if (!state.selectedExercise) return;

            const history = DataAPI.getExerciseHistory(state.selectedExercise);
            const filtered = getFilteredHistory(history, state.selectedPeriod);

            const emptyEl = document.getElementById('chart-empty-state');
            if (filtered.length === 0) {
                if (emptyEl) emptyEl.style.display = 'flex';
                return;
            }
            if (emptyEl) emptyEl.style.display = 'none';

            const dataByDay = {};
            filtered.forEach(item => {
                const key = new Date(item.date).toISOString().slice(0, 10);
                if (!dataByDay[key] || item.weight > dataByDay[key].weight) {
                    dataByDay[key] = {
                        weight: item.weight,
                        date: new Date(item.date),
                        label: new Date(item.date).getDate().toString()
                    };
                }
            });

            const sorted = Object.keys(dataByDay).sort();
            const labels = sorted.map(k => dataByDay[k].label);
            const data = sorted.map(k => dataByDay[k].weight);
            const dates = sorted.map(k => dataByDay[k].date);

            const gradient = ctx.getContext('2d').createLinearGradient(0, 0, 0, 220);
            const linkColor = getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-link-color') || '#3b82f6';
            gradient.addColorStop(0, linkColor + '30');
            gradient.addColorStop(1, linkColor + '00');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        data,
                        borderColor: linkColor,
                        backgroundColor: gradient,
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 0,
                        pointHoverRadius: 6,
                        pointHoverBackgroundColor: '#ffffff',
                        pointHoverBorderColor: linkColor,
                        pointHoverBorderWidth: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(30, 30, 32, 0.95)',
                            titleColor: '#8e8e93',
                            bodyColor: '#ffffff',
                            bodyFont: { size: 14, weight: 'bold' },
                            padding: 10,
                            cornerRadius: 10,
                            displayColors: false,
                            callbacks: {
                                title: (items) => {
                                    const d = dates[items[0].dataIndex];
                                    return `${d.getDate()} ${MONTHS_RU[d.getMonth()]}, ${WEEKDAYS_RU[d.getDay()]}`;
                                },
                                label: (item) => `${item.raw} кг`
                            }
                        }
                    },
                    scales: {
                        y: { display: false, beginAtZero: false, grace: '10%' },
                        x: {
                            grid: { display: false },
                            ticks: {
                                color: '#8e8e93',
                                font: { size: 10 },
                                padding: 6,
                                callback: (value, index) => {
                                    const d = dates[index];
                                    if (!d) return '';
                                    return `${d.getDate()} ${WEEKDAYS_RU[d.getDay()]}`;
                                },
                                maxRotation: 0,
                                autoSkip: true,
                                maxTicksLimit: 7
                            },
                            border: { display: false }
                        }
                    },
                    animation: { duration: 400, easing: 'easeOutQuart' }
                },
                plugins: [crosshairPlugin]
            });
        }
        // ==========================================
        // ВКЛАДКА ПРОГРАММЫ
        // ==========================================
        function renderPrograms() {
            const programs = DataAPI.getPrograms();
            let listHTML = programs.length
                ? programs.map((program, index) => {
                    const exercises = program.exercises || [];
                    const allSsIds = exercises.map(e => e.supersetId);
                    const exerciseBlocks = [];
                    const processed = new Set();
                    let globalExCounter = 1;

                    exercises.forEach((exercise, idx) => {
                        if (processed.has(idx)) return;

                        if (exercise.supersetId) {
                            const group = exercises
                                .map((e, i) => ({ ...e, originalIndex: i }))
                                .filter(e => e.supersetId === exercise.supersetId);
                            group.forEach(e => processed.add(e.originalIndex));

                            const style = getSupersetStyle(exercise.supersetId, allSsIds);

                            const groupHTML = group.map((e) => `
                                <div class="flex items-start gap-2 py-1.5">
                                    <span class="text-tgHint font-mono text-xs shrink-0 mt-0.5">${globalExCounter++}.</span>
                                    <div class="flex-1 min-w-0">
                                        <div class="text-sm font-medium leading-snug break-words">${esc(e.name)}</div>
                                    </div>
                                    <span class="font-mono text-xs text-tgHint shrink-0 bg-tgBg/60 px-2 py-0.5 rounded-md whitespace-nowrap">${e.targetSets ?? 3} × ${e.targetReps ?? 10}</span>
                                </div>
                            `).join('');

                            exerciseBlocks.push(`
                                <div class="p-2.5 rounded-xl mb-2 bg-tgBg/30" style="${style.styleAttr}">
                                    <div class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[10px] font-bold mb-2 uppercase tracking-wide" style="${style.badgeStyle}">
                                        <i class="fa-solid fa-bolt"></i> Суперсет
                                    </div>
                                    <div class="divide-y divide-tgSecondaryBg/40">
                                        ${groupHTML}
                                    </div>
                                </div>
                            `);
                        } else {
                            processed.add(idx);
                            exerciseBlocks.push(`
                                <div class="flex items-start gap-2 py-1.5 border-b border-tgSecondaryBg/40 last:border-0">
                                    <span class="text-tgHint font-mono text-xs shrink-0 mt-0.5">${globalExCounter++}.</span>
                                    <div class="flex-1 min-w-0">
                                        <div class="text-sm font-medium leading-snug break-words">${esc(exercise.name)}</div>
                                    </div>
                                    <span class="font-mono text-xs text-tgHint shrink-0 bg-tgBg/60 px-2 py-0.5 rounded-md whitespace-nowrap">${exercise.targetSets ?? 3} × ${exercise.targetReps ?? 10}</span>
                                </div>
                            `);
                        }
                    });

                    return `
                        <div class="bg-tgSecondaryBg p-4 rounded-2xl mb-3 card-enter" style="animation-delay: ${index * 0.05}s">
                            <div class="flex items-start justify-between gap-3 mb-3">
                                <div class="font-semibold text-base break-words flex-1 min-w-0 pt-1">${esc(program.name)}</div>
                                <div class="flex items-center gap-1.5 shrink-0">
                                    <button onclick="navigate('program_edit', {programId: '${program.id}'})" aria-label="Редактировать" class="w-9 h-9 flex items-center justify-center rounded-xl bg-tgBg text-tgLink active:opacity-70 transition-opacity">
                                        <i class="fa-solid fa-pen text-sm"></i>
                                    </button>
                                    <button onclick="deleteProgram('${program.id}')" aria-label="Удалить" class="w-9 h-9 flex items-center justify-center rounded-xl bg-tgBg text-red-500 active:opacity-70 transition-opacity">
                                        <i class="fa-solid fa-trash text-sm"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="space-y-0.5 mb-4">
                                ${exerciseBlocks.join('') || '<div class="text-tgHint text-xs italic py-1">Нет упражнений</div>'}
                            </div>
                            <button onclick="startWorkout('${program.id}')" class="w-full flex items-center justify-center gap-2 bg-tgButton text-white font-semibold py-3 rounded-xl active:opacity-80 transition-opacity">
                                <i class="fa-solid fa-play text-sm"></i> Начать тренировку
                            </button>
                        </div>
                    `;
                }).join('')
                : '<div class="text-center text-tgHint mt-10 card-enter">Нет созданных программ</div>';

            document.getElementById('app-content').innerHTML = `
                ${listHTML}
                <button onclick="navigate('program_edit', {programId: null})" class="w-full mt-6 bg-tgButton text-white font-semibold py-4 rounded-2xl active:opacity-80 transition-opacity card-enter" style="animation-delay: 0.1s">
                    <i class="fa-solid fa-plus mr-2"></i> Создать программу
                </button>
            `;
        }

        // ==========================================
        // РЕДАКТОР ПРОГРАММ
        // ==========================================

            const modal = document.createElement('div');
            modal.id = 'muscle-groups-modal';
            modal.className = 'modal-backdrop';
            
            const updateModalContent = () => {
                const groups = getMuscleGroups();
                const contentDiv = modal.querySelector('.modal-sheet');
                contentDiv.innerHTML = `
                    <div class="w-10 h-1 bg-tgHint/40 rounded-full mx-auto mb-5"></div>
                    <h2 class="text-xl font-bold mb-4">Управление группами мышц</h2>

                    <div class="space-y-2 max-h-56 overflow-y-auto mb-4 pr-1">
                        ${groups.map((g) => `
                            <div class="flex items-center justify-between bg-tgBg p-3 rounded-xl">
                                <span class="text-sm font-medium">${esc(g)}</span>${DEFAULT_MUSCLE_GROUPS.includes(g) ? '<span class="text-xs text-tgHint">Стандартная</span>' : `
                                    <button onclick="deleteCustomMuscleGroup('${esc(g)}')" class="text-red-500 px-2 active:scale-95"><i class="fa-solid fa-trash"></i></button>
                                `}
                            </div>
                        `).join('')}
                    </div>

                    <div class="flex gap-2 mb-4">
                        <input type="text" id="new-muscle-input" placeholder="Новая группа мышц" class="flex-1 p-3 rounded-xl text-sm">
