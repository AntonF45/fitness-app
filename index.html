<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fitnary</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tgBg: 'var(--tg-theme-bg-color, #1c1c1e)',
                        tgText: 'var(--tg-theme-text-color, #ffffff)',
                        tgHint: 'var(--tg-theme-hint-color, #8e8e93)',
                        tgLink: 'var(--tg-theme-link-color, #3b82f6)',
                        tgButton: 'var(--tg-theme-button-color, #3b82f6)',
                        tgSecondaryBg: 'var(--tg-theme-secondary-bg-color, #2c2c2e)'
                    }
                }
            }
        };
    </script>

    <style>
        :root {
            --bottom-nav-height: 72px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body {
            background-color: var(--tg-theme-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: calc(var(--bottom-nav-height) + var(--safe-bottom) + 16px);
        }

        input, select {
            background-color: var(--tg-theme-secondary-bg-color, #2c2c2e);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid var(--tg-theme-hint-color, #8e8e93);
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        .scroll-container {
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-padding-left: 16px;
            scroll-padding-right: 16px;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        .snap-x {
            scroll-snap-type: x mandatory;
        }

        .snap-center {
            scroll-snap-align: center;
        }

        .chip {
            transition: background-color 0.18s ease, color 0.18s ease, transform 0.12s ease;
        }

        .chip:active {
            transform: scale(0.96);
        }

        .card-enter {
            animation: cardIn 0.2s ease-out both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chart-wrapper {
            position: relative;
            height: 220px;
            touch-action: pan-y pinch-zoom;
        }

        .chart-wrapper canvas {
            touch-action: none;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            padding: 16px;
        }

        .modal-sheet {
            width: 100%;
            max-width: 480px;
            background: var(--tg-theme-secondary-bg-color, #2c2c2e);
            color: var(--tg-theme-text-color, #ffffff);
            border-radius: 24px;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            animation: modalIn 0.2s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="min-h-screen">
    <main id="app-content" class="px-4 pt-4"></main>

    <nav id="bottom-nav"
        class="fixed bottom-0 left-0 right-0 bg-tgBg border-t border-tgSecondaryBg flex justify-around z-20"
        style="padding-bottom: max(12px, var(--safe-bottom));">

        <button onclick="switchTab('stats')" id="tab-stats" role="tab" aria-selected="true"
            class="flex flex-col items-center justify-center min-h-[56px] min-w-[64px] text-tgLink">
            <i class="fa-solid fa-chart-line text-xl mb-1"></i>
            <span class="text-xs font-medium">Статистика</span>
        </button>

        <button onclick="switchTab('programs')" id="tab-programs" role="tab" aria-selected="false"
            class="flex flex-col items-center justify-center min-h-[56px] min-w-[64px] text-tgHint">
            <i class="fa-solid fa-list-check text-xl mb-1"></i>
            <span class="text-xs font-medium">Программы</span>
        </button>

        <button onclick="switchTab('history')" id="tab-history" role="tab" aria-selected="false"
            class="flex flex-col items-center justify-center min-h-[56px] min-w-[64px] text-tgHint">
            <i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i>
            <span class="text-xs font-medium">История</span>
        </button>
    </nav>

    <script>
        function esc(str = '') {
            return String(str)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function createId() {
            return typeof crypto !== 'undefined' && crypto.randomUUID
                ? crypto.randomUUID()
                : Date.now().toString(36) + Math.random().toString(36).slice(2);
        }

        const MUSCLE_GROUPS = ['Грудь', 'Спина', 'Ноги', 'Плечи', 'Руки'];
        const tg = window.Telegram.WebApp;

        try {
            tg.ready();
            tg.expand();
        } catch (error) {
            console.warn('Telegram init error:', error);
        }

        const USER_ID = tg.initDataUnsafe?.user?.id || 'local_test_user_' + Math.random().toString(36).substr(2, 9);

        function haptic(type = 'light') {
            try {
                if (type === 'success' || type === 'error' || type === 'warning') {
                    tg.HapticFeedback?.notificationOccurred(type);
                } else {
                    tg.HapticFeedback?.impactOccurred(type);
                }
            } catch (error) {
                console.warn('Haptic error:', error);
            }
        }

        function showAlert(message) {
            try { tg.showAlert(message); } catch (error) { alert(message); }
        }

        function showConfirm(message, callback) {
            try { tg.showConfirm(message, callback); } catch (error) { callback(confirm(message)); }
        }

        try { tg.BackButton.onClick(() => navigateBack()); } catch (error) { console.warn('BackButton error:', error); }

        function updateBackButton(isSubScreen) {
            try {
                if (isSubScreen) tg.BackButton.show();
                else tg.BackButton.hide();
            } catch (error) { console.warn('BackButton update error:', error); }
        }

        let currentMainButtonHandler = null;

        function setMainButton(text, handler) {
            try {
                if (currentMainButtonHandler) {
                    tg.MainButton.offClick(currentMainButtonHandler);
                    currentMainButtonHandler = null;
                }
                if (!text || !handler) {
                    tg.MainButton.hide();
                    return;
                }
                tg.MainButton.setText(text);
                tg.MainButton.show();
                tg.MainButton.onClick(handler);
                currentMainButtonHandler = handler;
            } catch (error) { console.warn('MainButton error:', error); }
        }

        function clearMainButton() {
            setMainButton(null, null);
        }

        const DataAPI = {
            _key(type) { return `twa_fitness_${type}_${USER_ID}`; },
            getPrograms() {
                try { return JSON.parse(localStorage.getItem(this._key('programs')) || '[]'); } catch (error) { return []; }
            },
            savePrograms(data) { localStorage.setItem(this._key('programs'), JSON.stringify(data)); },
            getHistory() {
                try { return JSON.parse(localStorage.getItem(this._key('history')) || '[]'); } catch (error) { return []; }
            },
            saveHistory(data) { localStorage.setItem(this._key('history'), JSON.stringify(data)); },
            getProgramById(id) { return this.getPrograms().find(program => program.id === id); },
            getHistoryEntryById(id) { return this.getHistory().find(entry => entry.id === id); },

            getUserExercises() {
                const exerciseMap = new Map();
                const addExercise = exercise => {
                    if (!exercise || !exercise.name) return;
                    if (!exerciseMap.has(exercise.name)) {
                        exerciseMap.set(exercise.name, { name: exercise.name, muscleGroup: exercise.muscleGroup || 'Другое' });
                    }
                };
                this.getPrograms().forEach(program => (program.exercises || []).forEach(addExercise));
                this.getHistory().forEach(entry => (entry.exercises || []).forEach(addExercise));
                return Array.from(exerciseMap.values());
            },

            getExerciseHistory(exerciseName) {
                const results = [];
                this.getHistory().forEach(entry => {
                    (entry.exercises || []).forEach(exercise => {
                        if (exercise.name === exerciseName) {
                            (exercise.sets || []).forEach(set => {
                                results.push({ date: entry.date, weight: set.weight, reps: set.reps });
                            });
                        }
                    });
                });
                return results.sort((a, b) => new Date(a.date) - new Date(b.date));
            }
        };

        const ACTIVE_KEY = `twa_fitness_active_workout_${USER_ID}`;

        function saveActiveWorkout() {
            if (state.activeWorkout) localStorage.setItem(ACTIVE_KEY, JSON.stringify(state.activeWorkout));
            else localStorage.removeItem(ACTIVE_KEY);
        }

        function restoreActiveWorkout() {
            const saved = localStorage.getItem(ACTIVE_KEY);
            if (!saved) return false;
            try {
                state.activeWorkout = JSON.parse(saved);
                return true;
            } catch (error) {
                localStorage.removeItem(ACTIVE_KEY);
                return false;
            }
        }

        let state = {
            currentScreen: 'stats',
            currentTab: 'stats',
            activeWorkout: null,
            editingProgram: null,
            workoutTimer: null,
            selectedMuscleGroup: 'Грудь',
            selectedExercise: null
        };

        function updateTabUI(activeTab) {
            ['stats', 'programs', 'history'].forEach(tab => {
                const button = document.getElementById(`tab-${tab}`);
                if (!button) return;
                if (tab === activeTab) {
                    button.classList.remove('text-tgHint');
                    button.classList.add('text-tgLink');
                    button.setAttribute('aria-selected', 'true');
                } else {
                    button.classList.remove('text-tgLink');
                    button.classList.add('text-tgHint');
                    button.setAttribute('aria-selected', 'false');
                }
            });
        }

        function openProgramsScreen() {
            state.currentTab = 'programs';
            state.currentScreen = 'programs';
            updateTabUI('programs');
            updateBackButton(false);
            clearMainButton();
            renderPrograms();
        }

        function navigateToTab(tab) {
            state.currentTab = tab;
            updateTabUI(tab);
            navigate(tab);
        }

        function switchTab(tab) {
            if (state.currentScreen === 'workout' && state.activeWorkout && tab !== 'workout') {
                promptWorkoutExit(tab);
                return;
            }
            haptic('light');
            navigateToTab(tab);
        }

        function navigateBack() {
            if (state.currentScreen === 'workout' && state.activeWorkout) {
                promptWorkoutExit('programs');
                return;
            }
            haptic('light');
            const tabMap = { program_edit: 'programs', history_detail: 'history', workout: 'programs' };
            const target = tabMap[state.currentScreen] || state.currentTab || 'stats';
            navigateToTab(target);
        }

        function navigate(screen, data = {}) {
            haptic('light');
            stopWorkoutTimer();
            state.currentScreen = screen;
            if (data.programId !== undefined) {
                state.editingProgram = data.programId ? DataAPI.getProgramById(data.programId) : { name: '', exercises: [] };
            }
            const isSubScreen = ['program_edit', 'history_detail', 'workout'].includes(screen);
            updateBackButton(isSubScreen);
            clearMainButton();

            switch (screen) {
                case 'stats': renderStats(); break;
                case 'programs': renderPrograms(); break;
                case 'program_edit': renderProgramEdit(); break;
                case 'workout': renderWorkout(); break;
                case 'history': renderHistory(); break;
                case 'history_detail': renderHistoryDetail(data.entryId); break;
            }
        }

        function renderStats() {
            const exercises = DataAPI.getUserExercises();
            const muscleGroupsHTML = MUSCLE_GROUPS.map(group => `
                <button onclick="selectMuscleGroup('${group}')" role="tab" aria-selected="${state.selectedMuscleGroup === group}"
                    class="chip snap-center min-w-[100px] px-4 py-3 rounded-xl text-sm font-medium whitespace-nowrap ${
                        state.selectedMuscleGroup === group ? 'bg-tgLink text-white ring-2 ring-tgLink ring-offset-2 ring-offset-tgBg' : 'bg-tgSecondaryBg text-tgText'
                    }">${group}</button>
            `).join('');

            const filteredExercises = exercises.filter(exercise => exercise.muscleGroup === state.selectedMuscleGroup);
            const exercisesHTML = filteredExercises.length
                ? filteredExercises.map(exercise => `
                    <button onclick="selectExercise('${esc(exercise.name)}')" role="tab" aria-selected="${state.selectedExercise === exercise.name}"
                        class="chip snap-center min-w-[130px] px-4 py-3 rounded-xl text-sm font-medium text-center ${
                            state.selectedExercise === exercise.name ? 'bg-tgLink text-white ring-2 ring-tgLink ring-offset-2 ring-offset-tgBg' : 'bg-tgSecondaryBg text-tgText'
                        }">${esc(exercise.name)}</button>
                `).join('')
                : '<p class="text-tgHint text-sm px-4 py-3">Нет упражнений в этой группе</p>';

            document.getElementById('app-content').innerHTML = `
                <div class="bg-tgSecondaryBg p-4 rounded-2xl mb-6 card-enter" style="animation-delay: 0.05s">
                    <div class="chart-wrapper"><canvas id="progressChart"></canvas></div>
                </div>
                <div class="mb-4 card-enter" style="animation-delay: 0.1s">
                    <h3 class="text-sm font-semibold mb-2 text-tgHint px-1">Группа мышц</h3>
                    <div class="flex overflow-x-auto gap-3 pb-2 pt-2 snap-x scroll-container px-4">${muscleGroupsHTML}</div>
                </div>
                <div class="mb-4 card-enter" style="animation-delay: 0.15s">
                    <h3 class="text-sm font-semibold mb-2 text-tgHint px-1">Упражнения</h3>
                    <div class="flex overflow-x-auto gap-3 pb-2 pt-2 snap-x scroll-container px-4">${exercisesHTML}</div>
                </div>
                <div class="mt-8 pt-6 border-t border-tgSecondaryBg card-enter" style="animation-delay: 0.2s">
                    <button onclick="resetAllData()" class="w-full py-3 rounded-xl border border-red-500/30 text-red-500 font-medium text-sm active:bg-red-500/10 transition-colors flex items-center justify-center gap-2">
                        <i class="fa-solid fa-trash-can"></i> Сбросить все данные приложения
                    </button>
                </div>
            `;

            setTimeout(() => {
                document.querySelectorAll('.scroll-container').forEach(container => {
                    const activeChip = container.querySelector('[aria-selected="true"]');
                    if (activeChip) activeChip.scrollIntoView({ behavior: 'auto', inline: 'center', block: 'nearest' });
                });
            }, 50);
            renderChart();
        }

        function resetAllData() {
            showConfirm('Вы уверены? Это БЕЗВОЗВРАТНО удалит все программы, историю тренировок и текущий процесс. Продолжить?', ok => {
                if (!ok) return;
                localStorage.removeItem(DataAPI._key('programs'));
                localStorage.removeItem(DataAPI._key('history'));
                localStorage.removeItem(ACTIVE_KEY);
                state.activeWorkout = null;
                state.selectedExercise = null;
                state.selectedMuscleGroup = 'Грудь';
                haptic('warning');
                navigateToTab('stats');
            });
        }

        function renderChart() {
            const ctx = document.getElementById('progressChart');
            if (!ctx) return;
            const existingChart = Chart.getChart(ctx);
            if (existingChart) existingChart.destroy();
            if (!state.selectedExercise) return;

            const history = DataAPI.getExerciseHistory(state.selectedExercise);
            if (history.length === 0) return;

            const dataByDate = {};
            history.forEach(item => {
                const key = new Date(item.date).toISOString().slice(0, 10);
                const label = new Date(item.date).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
                if (!dataByDate[key] || item.weight > dataByDate[key].weight) {
                    dataByDate[key] = { weight: item.weight, label: label };
                }
            });

            const sortedKeys = Object.keys(dataByDate).sort();
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sortedKeys.map(key => dataByDate[key].label),
                    datasets: [{
                        label: 'Вес (кг)',
                        data: sortedKeys.map(key => dataByDate[key].weight),
                        borderColor: getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-link-color') || '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.3,
                        fill: true,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        zoom: {
                            pan: { enabled: true, mode: 'x' },
                            zoom: { pinch: { enabled: true }, mode: 'x', limits: { x: { min: 'original', max: 'original' } } }
                        }
                    },
                    scales: {
                        y: { beginAtZero: false, ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-hint-color') || '#8e8e93' } },
                        x: { ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-hint-color') || '#8e8e93' } }
                    }
                }
            });
        }

        function selectMuscleGroup(group) {
            state.selectedMuscleGroup = group;
            state.selectedExercise = null;
            renderStats();
        }

        function selectExercise(name) {
            state.selectedExercise = state.selectedExercise === name ? null : name;
            renderStats();
        }

        function renderPrograms() {
            const programs = DataAPI.getPrograms();
            let listHTML = programs.length
                ? programs.map((program, index) => {
                    const exercises = program.exercises || [];
                    const exercisesList = exercises.map(exercise => `<div class="text-tgHint text-xs">${esc(exercise.name)} — ${exercise.targetSets ?? 3}×${exercise.targetReps ?? 10}</div>`).join('');
                    return `
                        <div class="bg-tgSecondaryBg p-4 rounded-2xl mb-3 card-enter" style="animation-delay: ${index * 0.05}s">
                            <div class="flex justify-between items-start">
                                <div onclick="startWorkout('${program.id}')" class="flex-1 active:opacity-70 pr-2 cursor-pointer">
                                    <div class="font-semibold text-base mb-2">${esc(program.name)}</div>
                                    ${exercisesList || '<div class="text-tgHint text-xs italic">Нет упражнений</div>'}
                                </div>
                                <div class="flex flex-col gap-2">
                                    <button onclick="navigate('program_edit', {programId: '${program.id}'})" aria-label="Редактировать программу" class="w-11 h-11 flex items-center justify-center rounded-full bg-tgBg text-tgLink active:opacity-70 transition-opacity">
                                        <i class="fa-solid fa-pen text-lg"></i>
                                    </button>
                                    <button onclick="deleteProgram('${program.id}')" aria-label="Удалить программу" class="w-11 h-11 flex items-center justify-center rounded-full bg-tgBg text-red-500 active:opacity-70 transition-opacity">
                                        <i class="fa-solid fa-trash text-lg"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('')
                : '<div class="text-center text-tgHint mt-10 card-enter">Нет созданных программ</div>';

            document.getElementById('app-content').innerHTML = `
                ${listHTML}
                <button onclick="navigate('program_edit', {programId: null})" class="w-full mt-6 bg-tgButton text-white font-semibold py-4 rounded-2xl active:opacity-80 transition-opacity card-enter" style="animation-delay: 0.1s">
                    <i class="fa-solid fa-plus mr-2"></i> Создать программу
                </button>
            `;
        }

        function renderProgramEdit() {
            const program = state.editingProgram || { name: '', exercises: [] };
            const exercises = program.exercises || [];

            let exercisesHTML = exercises.map((exercise, index) => `
                <div class="bg-tgSecondaryBg p-4 rounded-2xl mb-3 card-enter" style="animation-delay: ${index * 0.05}s">
                    <div class="flex justify-between items-center mb-3">
                        <span class="font-medium text-sm text-tgHint">Упражнение ${index + 1}</span>
                        <button onclick="removeExercise(${index})" aria-label="Удалить упражнение" class="w-8 h-8 flex items-center justify-center rounded-full text-red-500 active:opacity-70">
                            <i class="fa-solid fa-times"></i>
                        </button>
                    </div>
                    <input type="text" placeholder="Название (напр. Жим лежа)" value="${esc(exercise.name)}" oninput="updateExercise(${index}, 'name', this.value)" class="w-full p-3 rounded-xl mb-3 text-sm font-medium">
                    <select onchange="updateExercise(${index}, 'muscleGroup', this.value)" class="w-full p-3 rounded-xl mb-3 text-sm">
                        <option value="">Выберите группу мышц</option>
                        ${MUSCLE_GROUPS.map(group => `<option value="${group}" ${exercise.muscleGroup === group ? 'selected' : ''}>${group}</option>`).join('')}
                    </select>
                    <div class="flex gap-3">
                        <div class="flex-1">
                            <label class="text-xs text-tgHint mb-1 block">Подходы</label>
                            <input type="number" inputmode="numeric" value="${exercise.targetSets ?? 3}" onchange="updateExercise(${index}, 'targetSets', parseInt(this.value) || 3)" class="w-full p-3 rounded-xl text-sm text-center">
                        </div>
                        <div class="flex-1">
                            <label class="text-xs text-tgHint mb-1 block">Повторения</label>
                            <input type="number" inputmode="numeric" value="${exercise.targetReps ?? 10}" onchange="updateExercise(${index}, 'targetReps', parseInt(this.value) || 10)" class="w-full p-3 rounded-xl text-sm text-center">
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('app-content').innerHTML = `
                <input type="text" id="prog-name" placeholder="Название программы" value="${esc(program.name)}" oninput="updateProgramName(this.value)" class="w-full p-4 rounded-2xl mb-4 text-lg font-semibold card-enter">
                <div id="exercises-list">${exercisesHTML}</div>
                <button onclick="addExercise()" class="w-full py-4 border-2 border-dashed border-tgHint rounded-2xl text-tgHint mt-2 active:bg-tgSecondaryBg transition-colors card-enter" style="animation-delay: 0.1s">
                    <i class="fa-solid fa-plus mr-2"></i> Добавить упражнение
                </button>
            `;
            setMainButton('Сохранить программу', saveProgram);
        }

        function updateProgramName(value) {
            if (!state.editingProgram) state.editingProgram = { name: '', exercises: [] };
            state.editingProgram.name = value;
        }

        // ==========================================
        // ОПТИМИЗИРОВАННЫЕ ФУНКЦИИ ТРЕНИРОВКИ
        // ==========================================

        function generateSetHTML(exerciseIndex, setIndex, set) {
            return `
                <div id="set-row-${exerciseIndex}-${setIndex}" class="bg-tgBg rounded-xl p-3 mb-2 card-enter" style="animation-delay: 0.03s">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-tgHint text-sm font-medium">Подход ${setIndex + 1}</span>
                        <button onclick="removeSet(${exerciseIndex}, ${setIndex})" aria-label="Удалить подход" class="w-8 h-8 flex items-center justify-center rounded-full text-red-500 active:opacity-70">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                    <div class="flex items-center gap-2 mb-2">
                        <button onclick="adjustSet(${exerciseIndex}, ${setIndex}, 'weight', -2.5)" class="w-10 h-10 rounded-lg bg-tgSecondaryBg text-lg flex items-center justify-center active:opacity-70 font-bold shrink-0">−</button>
                        <input type="number" id="set-${exerciseIndex}-${setIndex}-weight" inputmode="decimal" value="${set.weight}" onchange="updateSet(${exerciseIndex}, ${setIndex}, 'weight', parseFloat(this.value) || 0)" class="w-20 h-10 text-center bg-transparent text-xl font-semibold shrink-0">
                        <button onclick="adjustSet(${exerciseIndex}, ${setIndex}, 'weight', 2.5)" class="w-10 h-10 rounded-lg bg-tgSecondaryBg text-lg flex items-center justify-center active:opacity-70 font-bold shrink-0">+</button>
                        <span class="text-tgHint text-sm w-8 text-center shrink-0">кг</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="adjustSet(${exerciseIndex}, ${setIndex}, 'reps', -1)" class="w-10 h-10 rounded-lg bg-tgSecondaryBg text-lg flex items-center justify-center active:opacity-70 font-bold shrink-0">−</button>
                        <input type="number" id="set-${exerciseIndex}-${setIndex}-reps" inputmode="numeric" value="${set.reps}" onchange="updateSet(${exerciseIndex}, ${setIndex}, 'reps', parseInt(this.value) || 0)" class="w-14 h-10 text-center bg-transparent text-xl font-semibold shrink-0">
                        <button onclick="adjustSet(${exerciseIndex}, ${setIndex}, 'reps', 1)" class="w-10 h-10 rounded-lg bg-tgSecondaryBg text-lg flex items-center justify-center active:opacity-70 font-bold shrink-0">+</button>
                        <span class="text-tgHint text-sm w-12 text-center shrink-0">повт</span>
                    </div>
                </div>
            `;
        }

        function renderExerciseCard(exerciseIndex) {
            const exercise = state.activeWorkout.exercises[exerciseIndex];
            const sets = exercise.sets || [];
            const completedSets = sets.filter(s => s.weight > 0 && s.reps > 0).length;
            const targetSets = exercise.targetSets ?? 3;
            const isComplete = completedSets >= targetSets;

            const setsHTML = sets.map((set, setIndex) => generateSetHTML(exerciseIndex, setIndex, set)).join('');

            const cardHTML = `
                <div id="exercise-card-${exerciseIndex}" class="bg-tgSecondaryBg p-4 rounded-2xl mb-4 card-enter" style="animation-delay: ${exerciseIndex * 0.1}s">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-base">${esc(exercise.name)}</h3>
                        <span id="badge-${exerciseIndex}" class="text-xs font-medium px-2 py-1 rounded-md ${isComplete ? 'bg-green-500/20 text-green-500' : 'bg-tgBg text-tgHint'}">
                            ${isComplete ? '✓ Готово' : `${completedSets}/${targetSets}`}
                        </span>
                    </div>
                    <div id="sets-container-${exerciseIndex}">${setsHTML}</div>
                    <button id="add-set-btn-${exerciseIndex}" onclick="addSet(${exerciseIndex})" class="w-full py-3 mt-1 bg-tgBg rounded-xl text-tgLink text-sm font-semibold active:opacity-70 transition-opacity">
                        + Добавить подход
                    </button>
                </div>
            `;

            const existingCard = document.getElementById(`exercise-card-${exerciseIndex}`);
            if (existingCard) {
                existingCard.outerHTML = cardHTML;
            }
        }

        function renderWorkout() {
            const workout = state.activeWorkout;
            if (!workout) {
                openProgramsScreen();
                return;
            }

            const exercises = workout.exercises || [];
            let exercisesHTML = exercises.map((exercise, exerciseIndex) => {
                const sets = exercise.sets || [];
                const completedSets = sets.filter(s => s.weight > 0 && s.reps > 0).length;
                const targetSets = exercise.targetSets ?? 3;
                const isComplete = completedSets >= targetSets;
                const setsHTML = sets.map((set, setIndex) => generateSetHTML(exerciseIndex, setIndex, set)).join('');

                return `
                    <div id="exercise-card-${exerciseIndex}" class="bg-tgSecondaryBg p-4 rounded-2xl mb-4 card-enter" style="animation-delay: ${exerciseIndex * 0.1}s">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-base">${esc(exercise.name)}</h3>
                            <span id="badge-${exerciseIndex}" class="text-xs font-medium px-2 py-1 rounded-md ${isComplete ? 'bg-green-500/20 text-green-500' : 'bg-tgBg text-tgHint'}">
                                ${isComplete ? '✓ Готово' : `${completedSets}/${targetSets}`}
                            </span>
                        </div>
                        <div id="sets-container-${exerciseIndex}">${setsHTML}</div>
                        <button id="add-set-btn-${exerciseIndex}" onclick="addSet(${exerciseIndex})" class="w-full py-3 mt-1 bg-tgBg rounded-xl text-tgLink text-sm font-semibold active:opacity-70 transition-opacity">
                            + Добавить подход
                        </button>
                    </div>
                `;
            }).join('');

            document.getElementById('app-content').innerHTML = `
                <div class="sticky top-0 z-10 bg-tgBg/95 backdrop-blur-md py-4 mb-4 border-b border-tgSecondaryBg card-enter">
                    <div class="text-4xl font-mono font-bold text-tgLink tracking-wider text-center" id="workout-timer">00:00:00</div>
                    <div class="text-tgHint text-xs mt-1 uppercase tracking-wide text-center">Время тренировки</div>
                </div>
                ${exercisesHTML}
            `;

            startTimer();
            setMainButton('Завершить тренировку', () => promptWorkoutExit('programs'));
        }

        function adjustSet(exerciseIndex, setIndex, field, delta) {
            const exercise = state.activeWorkout.exercises[exerciseIndex];
            const current = exercise.sets[setIndex][field] || 0;
            const newValue = field === 'weight' ? Math.max(0, parseFloat((current + delta).toFixed(1))) : Math.max(0, current + delta);

            updateSet(exerciseIndex, setIndex, field, newValue);
            haptic('light');

            const inputElement = document.getElementById(`set-${exerciseIndex}-${setIndex}-${field}`);
            if (inputElement) inputElement.value = newValue;

            const completedSets = exercise.sets.filter(s => s.weight > 0 && s.reps > 0).length;
            const targetSets = exercise.targetSets ?? 3;
            const isComplete = completedSets >= targetSets;
            
            const badge = document.getElementById(`badge-${exerciseIndex}`);
            if (badge) {
                badge.className = `text-xs font-medium px-2 py-1 rounded-md ${isComplete ? 'bg-green-500/20 text-green-500' : 'bg-tgBg text-tgHint'}`;
                badge.innerText = isComplete ? '✓ Готово' : `${completedSets}/${targetSets}`;
            }
        }

        function addSet(exerciseIndex) {
            const exercise = state.activeWorkout.exercises[exerciseIndex];
            const sets = exercise.sets;
            let defaultWeight = 0;
            let defaultReps = exercise.targetReps ?? 10;

            if (sets.length > 0) {
                const lastSet = sets[sets.length - 1];
                defaultWeight = lastSet.weight;
                defaultReps = lastSet.reps;
            }

            sets.push({ weight: defaultWeight, reps: defaultReps });
            saveActiveWorkout();
            haptic('light');
            renderExerciseCard(exerciseIndex);
        }

        function removeSet(exerciseIndex, setIndex) {
            const sets = state.activeWorkout.exercises[exerciseIndex].sets;
            if (sets.length <= 1) {
                sets[0] = { weight: 0, reps: 10 };
            } else {
                sets.splice(setIndex, 1);
            }
            saveActiveWorkout();
            haptic('light');
            renderExerciseCard(exerciseIndex);
        }

        function updateSet(exerciseIndex, setIndex, field, value) {
            state.activeWorkout.exercises[exerciseIndex].sets[setIndex][field] = value;
            saveActiveWorkout();
        }

        // ==========================================
        // ОСТАЛЬНЫЕ ФУНКЦИИ
        // ==========================================

        function renderHistory() {
            const history = DataAPI.getHistory().sort((a, b) => new Date(b.date) - new Date(a.date));
            let listHTML = history.length
                ? history.map((entry, index) => {
                    const date = new Date(entry.date);
                    const dateStr = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
                    const timeStr = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                    const durationMin = Math.round(entry.duration / 60);
                    const totalSets = (entry.exercises || []).reduce((sum, exercise) => sum + (exercise.sets || []).length, 0);

                    return `
                        <div onclick='navigate("history_detail", {entryId: "${entry.id}"})' class="bg-tgSecondaryBg p-4 rounded-2xl mb-3 active:scale-[0.98] transition-transform cursor-pointer card-enter" style="animation-delay: ${index * 0.05}s">
                            <div class="flex justify-between items-start mb-2">
                                <div class="font-semibold text-base">${esc(entry.programName)}</div>
                                <div class="text-tgHint text-sm">${dateStr}</div>
                            </div>
                            <div class="flex gap-4 text-sm text-tgHint">
                                <span><i class="fa-regular fa-clock mr-1"></i> ${durationMin} мин</span>
                                <span><i class="fa-solid fa-layer-group mr-1"></i> ${totalSets} подх.</span>
                                <span>${timeStr}</span>
                            </div>
                        </div>
                    `;
                }).join('')
                : '<div class="text-center text-tgHint mt-10 card-enter">История пуста</div>';

            document.getElementById('app-content').innerHTML = listHTML;
        }

        function renderHistoryDetail(entryId) {
            const entry = DataAPI.getHistoryEntryById(entryId);
            if (!entry) {
                document.getElementById('app-content').innerHTML = '<p class="text-center text-tgHint mt-10">Запись не найдена</p>';
                return;
            }
            const date = new Date(entry.date).toLocaleString('ru-RU');
            let exercisesHTML = (entry.exercises || []).map((exercise, index) => {
                let setsHTML = (exercise.sets || []).map((set, setIndex) => `
                    <div class="flex justify-between py-2 border-b border-tgBg last:border-0">
                        <span class="text-tgHint text-sm">${setIndex + 1}.</span>
                        <span class="font-medium">${set.weight} кг × ${set.reps} повт</span>
                    </div>
                `).join('');
                return `
                    <div class="mb-4 card-enter" style="animation-delay: ${index * 0.05}s">
                        <h3 class="font-bold mb-2 text-base">${esc(exercise.name)}</h3>
                        <div class="bg-tgSecondaryBg p-4 rounded-2xl text-sm">${setsHTML}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('app-content').innerHTML = `
                <div class="text-center mb-6 card-enter">
                    <h2 class="text-xl font-bold">${esc(entry.programName)}</h2>
                    <p class="text-tgHint text-sm mt-1">${date}</p>
                </div>
                ${exercisesHTML}
            `;
        }

        function addExercise() {
            if (!state.editingProgram) state.editingProgram = { name: '', exercises: [] };
            if (!state.editingProgram.exercises) state.editingProgram.exercises = [];
            state.editingProgram.exercises.push({ id: createId(), name: '', muscleGroup: '', targetSets: 3, targetReps: 10 });
            renderProgramEdit();
        }

        function removeExercise(index) {
            state.editingProgram.exercises.splice(index, 1);
            renderProgramEdit();
        }

        function updateExercise(index, field, value) {
            if (!state.editingProgram) state.editingProgram = { name: '', exercises: [] };
            state.editingProgram.exercises[index][field] = value;
        }

        function saveProgram() {
            const nameInput = document.getElementById('prog-name');
            const name = nameInput ? nameInput.value.trim() : '';
            if (!name) { showAlert('Введите название программы'); return; }
            if (!state.editingProgram || (state.editingProgram.exercises || []).length === 0) { showAlert('Добавьте хотя бы одно упражнение'); return; }
            for (const exercise of state.editingProgram.exercises) {
                if (!exercise.name || !exercise.name.trim()) { showAlert('Заполните названия всех упражнений'); return; }
            }

            state.editingProgram.name = name;
            const programs = DataAPI.getPrograms();
            const existingIndex = programs.findIndex(program => program.id === state.editingProgram.id);

            if (existingIndex > -1) programs[existingIndex] = state.editingProgram;
            else { state.editingProgram.id = createId(); programs.push(state.editingProgram); }

            DataAPI.savePrograms(programs);
            haptic('success');
            state.editingProgram = null;
            openProgramsScreen();
        }

        function deleteProgram(id) {
            showConfirm('Удалить программу?', ok => {
                if (!ok) return;
                DataAPI.savePrograms(DataAPI.getPrograms().filter(program => program.id !== id));
                renderPrograms();
            });
        }

        function startWorkout(programId) {
            const program = DataAPI.getProgramById(programId);
            if (!program || !(program.exercises || []).length) {
                showAlert('В программе нет упражнений');
                return;
            }
            state.activeWorkout = {
                programId: program.id,
                programName: program.name,
                startTime: Date.now(),
                exercises: program.exercises.map(exercise => ({
                    name: exercise.name,
                    muscleGroup: exercise.muscleGroup,
                    targetSets: exercise.targetSets,
                    targetReps: exercise.targetReps,
                    sets: [{ weight: 0, reps: exercise.targetReps || 10 }]
                }))
            };
            saveActiveWorkout();
            navigate('workout');
        }

        function startTimer() {
            stopWorkoutTimer();
            const update = () => {
                if (!state.activeWorkout) return;
                const elapsed = Date.now() - state.activeWorkout.startTime;
                const hours = Math.floor(elapsed / 3600000).toString().padStart(2, '0');
                const minutes = Math.floor((elapsed % 3600000) / 60000).toString().padStart(2, '0');
                const seconds = Math.floor((elapsed % 60000) / 1000).toString().padStart(2, '0');
                const timerElement = document.getElementById('workout-timer');
                if (timerElement) timerElement.innerText = `${hours}:${minutes}:${seconds}`;
            };
            update();
            state.workoutTimer = setInterval(update, 1000);
        }

        function stopWorkoutTimer() {
            if (state.workoutTimer) {
                clearInterval(state.workoutTimer);
                state.workoutTimer = null;
            }
        }

        function clearWorkoutState() {
            stopWorkoutTimer();
            state.activeWorkout = null;
            saveActiveWorkout();
            clearMainButton();
        }

        let workoutDialogOpen = false;

        function promptWorkoutExit(targetTab = 'programs') {
            if (workoutDialogOpen) return;
            workoutDialogOpen = true;
            const existingModal = document.getElementById('workout-exit-modal');
            if (existingModal) existingModal.remove();

            const modal = document.createElement('div');
            modal.id = 'workout-exit-modal';
            modal.className = 'modal-backdrop';
            modal.innerHTML = `
                <div class="modal-sheet" role="dialog" aria-modal="true">
                    <div class="w-10 h-1 bg-tgHint/40 rounded-full mx-auto mb-5"></div>
                    <h2 class="text-xl font-bold text-center mb-2">Завершить тренировку?</h2>
                    <p class="text-tgHint text-sm text-center mb-5">Что сделать с текущей тренировкой?</p>
                    <div class="space-y-3">
                        <button id="workout-save-btn" class="w-full py-4 rounded-2xl bg-tgButton text-white font-semibold active:opacity-80 transition-opacity">
                            <i class="fa-solid fa-check mr-2"></i> Завершить и сохранить
                        </button>
                        <button id="workout-discard-btn" class="w-full py-4 rounded-2xl bg-red-500/15 text-red-500 font-semibold active:opacity-80 transition-opacity">
                            <i class="fa-solid fa-trash mr-2"></i> Не сохранять
                        </button>
                        <button id="workout-cancel-btn" class="w-full py-4 rounded-2xl bg-tgBg text-tgText font-semibold active:opacity-80 transition-opacity">
                            Отмена
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const closeDialog = () => {
                workoutDialogOpen = false;
                modal.remove();
            };

            document.getElementById('workout-cancel-btn').onclick = () => { closeDialog(); haptic('light'); };
            document.getElementById('workout-save-btn').onclick = () => { closeDialog(); saveWorkoutAndOpenPrograms(); };
            document.getElementById('workout-discard-btn').onclick = () => { closeDialog(); discardWorkoutAndOpenPrograms(); };
            modal.addEventListener('click', event => { if (event.target === modal) closeDialog(); });
        }

        function saveWorkoutAndOpenPrograms() {
            try {
                const workout = state.activeWorkout;
                if (workout) {
                    const history = DataAPI.getHistory();
                    history.push({
                        id: createId(),
                        date: new Date(workout.startTime).toISOString(),
                        duration: Math.max(0, Math.round((Date.now() - workout.startTime) / 1000)),
                        programName: workout.programName,
                        exercises: workout.exercises.map(exercise => ({
                            name: exercise.name,
                            muscleGroup: exercise.muscleGroup || '',
                            targetSets: exercise.targetSets ?? 3,
                            targetReps: exercise.targetReps ?? 10,
                            sets: (exercise.sets || []).map(set => ({ weight: Number(set.weight) || 0, reps: Number(set.reps) || 0 }))
                        }))
                    });
                    DataAPI.saveHistory(history);
                }
                clearWorkoutState();
                haptic('success');
            } catch (error) {
                console.error('Save workout error:', error);
                clearWorkoutState();
            }
            openProgramsScreen();
        }

        function discardWorkoutAndOpenPrograms() {
            clearWorkoutState();
            haptic('light');
            openProgramsScreen();
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && state.currentScreen === 'workout' && state.activeWorkout) {
                startTimer();
            }
        });

        if (restoreActiveWorkout()) {
            navigate('workout');
        } else {
            navigateToTab('stats');
        }
    </script>
</body>
</html>
