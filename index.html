<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fitnary</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tgBg: 'var(--tg-theme-bg-color, #1c1c1e)',
                        tgText: 'var(--tg-theme-text-color, #ffffff)',
                        tgHint: 'var(--tg-theme-hint-color, #8e8e93)',
                        tgLink: 'var(--tg-theme-link-color, #3b82f6)',
                        tgButton: 'var(--tg-theme-button-color, #3b82f6)',
                        tgSecondaryBg: 'var(--tg-theme-secondary-bg-color, #2c2c2e)'
                    }
                }
            }
        };
    </script>

    <style>
        :root {
            --bottom-nav-height: 72px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body {
            background-color: var(--tg-theme-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: calc(var(--bottom-nav-height) + var(--safe-bottom) + 16px);
        }

        input, select {
            background-color: var(--tg-theme-secondary-bg-color, #2c2c2e);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid var(--tg-theme-hint-color, #8e8e93);
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        .scroll-container {
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-padding-left: 16px;
            scroll-padding-right: 16px;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        .snap-x {
            scroll-snap-type: x mandatory;
        }

        .snap-center {
            scroll-snap-align: center;
        }

        .chip {
            transition: background-color 0.18s ease, color 0.18s ease, transform 0.12s ease;
        }

        .chip:active {
            transform: scale(0.96);
        }

        .card-enter {
            animation: cardIn 0.2s ease-out both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chart-wrapper {
            position: relative;
            height: 220px;
            touch-action: pan-y pinch-zoom;
        }

        .chart-wrapper canvas {
            touch-action: none;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.65);
            padding: 16px;
        }

        .modal-sheet {
            width: 100%;
            max-width: 480px;
            background: var(--tg-theme-secondary-bg-color, #2c2c2e);
            color: var(--tg-theme-text-color, #ffffff);
            border-radius: 24px;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            animation: modalIn 0.2s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .set-drop {
            border-left: 3px solid #f97316;
            background: linear-gradient(90deg, rgba(249, 115, 22, 0.08), transparent);
        }

        .bodyweight-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
        }

        .drop-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(249, 115, 22, 0.2);
            color: #fb923c;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4ade80;
        }

        .keyboard-hidden {
            display: none !important;
        }
    </style>
</head>

<body class="min-h-screen">
    <main id="app-content" class="px-4 pt-4"></main>

    <nav id="bottom-nav"
        class="fixed bottom-0 left-0 right-0 bg-tgBg border-t border-tgSecondaryBg flex justify-around z-20 transition-all duration-200"
        style="padding-bottom: max(12px, var(--safe-bottom));">

        <button onclick="switchTab('stats')" id="tab-stats" role="tab" aria-selected="true"
            class="flex flex-col items-center justify-center min-h-[56px] min-w-[64px] text-tgLink">
            <i class="fa-solid fa-chart-line text-xl mb-1"></i>
            <span class="text-xs font-medium">Статистика</span>
        </button>

        <button onclick="switchTab('programs')" id="tab-programs" role="tab" aria-selected="false"
            class="flex flex-col items-center justify-center min-h-[56px] min-w-[64px] text-tgHint">
            <i class="fa-solid fa-list-check text-xl mb-1"></i>
            <span class="text-xs font-medium">Программы</span>
        </button>

        <button onclick="switchTab('history')" id="tab-history" role="tab" aria-selected="false"
            class="flex flex-col items-center justify-center min-h-[56px] min-w-[64px] text-tgHint">
            <i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i>
            <span class="text-xs font-medium">История</span>
        </button>
    </nav>

    <script>
        function esc(str = '') {
            return String(str)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function createId() {
            return typeof crypto !== 'undefined' && crypto.randomUUID
                ? crypto.randomUUID()
                : Date.now().toString(36) + Math.random().toString(36).slice(2);
        }

        const DEFAULT_MUSCLE_GROUPS = ['Грудь', 'Спина', 'Ноги', 'Плечи', 'Руки'];
        
        function getMuscleGroups() {
            try {
                const saved = localStorage.getItem(`twa_fitness_muscle_groups_${USER_ID}`);
                return saved ? JSON.parse(saved) : [...DEFAULT_MUSCLE_GROUPS];
            } catch (e) {
                return [...DEFAULT_MUSCLE_GROUPS];
            }
        }

        function saveMuscleGroups(groups) {
            localStorage.setItem(`twa_fitness_muscle_groups_${USER_ID}`, JSON.stringify(groups));
        }

        const tg = window.Telegram.WebApp;

        try { tg.ready(); tg.expand(); } catch (error) { console.warn('Telegram init error:', error); }

        const USER_ID = tg.initDataUnsafe?.user?.id || 'local_test_user_' + Math.random().toString(36).substr(2, 9);

        function haptic(type = 'light') {
            try {
                if (type === 'success' || type === 'error' || type === 'warning') {
                    tg.HapticFeedback?.notificationOccurred(type);
                } else {
                    tg.HapticFeedback?.impactOccurred(type);
                }
            } catch (error) { console.warn('Haptic error:', error); }
        }

        function showAlert(message) {
            try { tg.showAlert(message); } catch (error) { alert(message); }
        }

        function showConfirm(message, callback) {
            try { tg.showConfirm(message, callback); } catch (error) { callback(confirm(message)); }
        }

        try { tg.BackButton.onClick(() => navigateBack()); } catch (error) { console.warn('BackButton error:', error); }

        function updateBackButton(isSubScreen) {
            try {
                if (isSubScreen) tg.BackButton.show();
                else tg.BackButton.hide();
            } catch (error) { console.warn('BackButton update error:', error); }
        }

        function clearMainButton() {
            try { tg.MainButton.hide(); } catch (e) {}
        }

        const DataAPI = {
            _key(type) { return `twa_fitness_${type}_${USER_ID}`; },
            getPrograms() {
                try {
                    const data = JSON.parse(localStorage.getItem(this._key('programs')) || '[]');
                    return data.map(p => ({
                        ...p,
                        exercises: (p.exercises || []).map(ex => ({ ...ex, exerciseType: ex.exerciseType || 'weighted', supersetId: ex.supersetId || null }))
                    }));
                } catch (error) { return []; }
            },
            savePrograms(data) { localStorage.setItem(this._key('programs'), JSON.stringify(data)); },
            getHistory() {
                try { return JSON.parse(localStorage.getItem(this._key('history')) || '[]'); } catch (error) { return []; }
            },
            saveHistory(data) { localStorage.setItem(this._key('history'), JSON.stringify(data)); },
            getProgramById(id) { return this.getPrograms().find(program => program.id === id); },
            getHistoryEntryById(id) { return this.getHistory().find(entry => entry.id === id); },

            getUserExercises() {
                const exerciseMap = new Map();
                const addExercise = exercise => {
                    if (!exercise || !exercise.name) return;
                    if (!exerciseMap.has(exercise.name)) {
                        exerciseMap.set(exercise.name, {
                            name: exercise.name,
                            muscleGroup: exercise.muscleGroup || 'Другое',
                            exerciseType: exercise.exerciseType || 'weighted'
                        });
                    }
                };
                this.getPrograms().forEach(program => (program.exercises || []).forEach(addExercise));
                this.getHistory().forEach(entry => (entry.exercises || []).forEach(addExercise));
                return Array.from(exerciseMap.values());
            },

            getExerciseHistory(exerciseName) {
                const results = [];
                this.getHistory().forEach(entry => {
                    (entry.exercises || []).forEach(exercise => {
                        if (exercise.name === exerciseName) {
                            (exercise.sets || []).forEach(set => {
                                results.push({ date: entry.date, weight: set.weight, reps: set.reps });
                            });
                        }
                    });
                });
                return results.sort((a, b) => new Date(a.date) - new Date(b.date));
            }
        };

        const ACTIVE_KEY = `twa_fitness_active_workout_${USER_ID}`;

        function saveActiveWorkout() {
            if (state.activeWorkout) localStorage.setItem(ACTIVE_KEY, JSON.stringify(state.activeWorkout));
            else localStorage.removeItem(ACTIVE_KEY);
        }

        function restoreActiveWorkout() {
            const saved = localStorage.getItem(ACTIVE_KEY);
            if (!saved) return false;
            try {
                state.activeWorkout = JSON.parse(saved);
                return true;
            } catch (error) {
                localStorage.removeItem(ACTIVE_KEY);
                return false;
            }
        }

        let state = {
            currentScreen: 'stats',
            currentTab: 'stats',
            activeWorkout: null,
            editingProgram: null,
            workoutTimer: null,
            selectedMuscleGroup: 'Грудь',
            selectedExercise: null,
            supersetActiveId: null
        };

        function updateTabUI(activeTab) {
            ['stats', 'programs', 'history'].forEach(tab => {
                const button = document.getElementById(`tab-${tab}`);
                if (!button) return;
                if (tab === activeTab) {
                    button.classList.remove('text-tgHint');
                    button.classList.add('text-tgLink');
                    button.setAttribute('aria-selected', 'true');
                } else {
                    button.classList.remove('text-tgLink');
                    button.classList.add('text-tgHint');
                    button.setAttribute('aria-selected', 'false');
                }
            });
        }

        function openProgramsScreen() {
            state.currentTab = 'programs';
            state.currentScreen = 'programs';
            updateTabUI('programs');
            updateBackButton(false);
            clearMainButton();
            renderPrograms();
        }

        function navigateToTab(tab) {
            state.currentTab = tab;
            updateTabUI(tab);
            navigate(tab);
        }

        function switchTab(tab) {
            if (state.currentScreen === 'workout' && state.activeWorkout && tab !== 'workout') {
                promptWorkoutExit(tab);
                return;
            }
            haptic('light');
            navigateToTab(tab);
        }

        function navigateBack() {
            if (state.currentScreen === 'workout' && state.activeWorkout) {
                promptWorkoutExit('programs');
                return;
            }
            haptic('light');
            const tabMap = { program_edit: 'programs', history_detail: 'history', workout: 'programs' };
            const target = tabMap[state.currentScreen] || state.currentTab || 'stats';
            navigateToTab(target);
        }

        function navigate(screen, data = {}) {
            haptic('light');
            stopWorkoutTimer();
            state.currentScreen = screen;
            state.supersetActiveId = null;
            if (data.programId !== undefined) {
                state.editingProgram = data.programId ? DataAPI.getProgramById(data.programId) : { name: '', exercises: [] };
            }
            const isSubScreen = ['program_edit', 'history_detail', 'workout'].includes(screen);
            updateBackButton(isSubScreen);
            clearMainButton();

            switch (screen) {
                case 'stats': renderStats(); break;
                case 'programs': renderPrograms(); break;
                case 'program_edit': renderProgramEdit(); break;
                case 'workout': renderWorkout(); break;
                case 'history': renderHistory(); break;
                case 'history_detail': renderHistoryDetail(data.entryId); break;
            }
        }

        function renderStats() {
            const exercises = DataAPI.getUserExercises();
            const muscleGroups = getMuscleGroups();
            const muscleGroupsHTML = muscleGroups.map(group => `
                <button onclick="selectMuscleGroup('${group}')" role="tab" aria-selected="${state.selectedMuscleGroup === group}"
                    class="chip snap-center min-w-[100px] px-4 py-3 rounded-xl text-sm font-medium whitespace-nowrap ${
                        state.selectedMuscleGroup === group ? 'bg-tgLink text-white ring-2 ring-tgLink ring-offset-2 ring-offset-tgBg' : 'bg-tgSecondaryBg text-tgText'
                    }">${group}</button>
            `).join('');

            const filteredExercises = exercises.filter(exercise => exercise.muscleGroup === state.selectedMuscleGroup);
            const exercisesHTML = filteredExercises.length
                ? filteredExercises.map(exercise => `
                    <button onclick="selectExercise('${esc(exercise.name)}')" role="tab" aria-selected="${state.selectedExercise === exercise.name}"
                        class="chip snap-center min-w-[130px] px-4 py-3 rounded-xl text-sm font-medium text-center ${
                            state.selectedExercise === exercise.name ? 'bg-tgLink text-white ring-2 ring-tgLink ring-offset-2 ring-offset-tgBg' : 'bg-tgSecondaryBg text-tgText'
                        }">${esc(exercise.name)}</button>
                `).join('')
                : '<p class="text-tgHint text-sm px-4 py-3">Нет упражнений в этой группе</p>';

            document.getElementById('app-content').innerHTML = `
                <div class="bg-tgSecondaryBg p-4 rounded-2xl mb-6 card-enter" style="animation-delay: 0.05s">
                    <div class="chart-wrapper"><canvas id="progressChart"></canvas></div>
                </div>
                <div class="mb-4 card-enter" style="animation-delay: 0.1s">
                    <h3 class="text-sm font-semibold mb-2 text-tgHint px-1">Группа мышц</h3>
                    <div class="flex overflow-x-auto gap-3 pb-2 pt-2 snap-x scroll-container px-4">${muscleGroupsHTML}</div>
                </div>
                <div class="mb-4 card-enter" style="animation-delay: 0.15s">
                    <h3 class="text-sm font-semibold mb-2 text-tgHint px-1">Упражнения</h3>
                    <div class="flex overflow-x-auto gap-3 pb-2 pt-2 snap-x scroll-container px-4">${exercisesHTML}</div>
                </div>
                <div class="mt-8 pt-6 border-t border-tgSecondaryBg card-enter" style="animation-delay: 0.2s">
                    <button onclick="resetAllData()" class="w-full py-3 rounded-xl border border-red-500/30 text-red-500 font-medium text-sm active:bg-red-500/10 transition-colors flex items-center justify-center gap-2">
                        <i class="fa-solid fa-trash-can"></i> Сбросить все данные приложения
                    </button>
                </div>
            `;

            setTimeout(() => {
                document.querySelectorAll('.scroll-container').forEach(container => {
                    const activeChip = container.querySelector('[aria-selected="true"]');
                    if (activeChip) activeChip.scrollIntoView({ behavior: 'auto', inline: 'center', block: 'nearest' });
                });
            }, 50);
            renderChart();
        }

        function resetAllData() {
            showConfirm('Вы уверены? Это БЕЗВОЗВРАТНО удалит все программы, историю тренировок и текущий процесс. Продолжить?', ok => {
                if (!ok) return;
                localStorage.removeItem(DataAPI._key('programs'));
                localStorage.removeItem(DataAPI._key('history'));
                localStorage.removeItem(ACTIVE_KEY);
                localStorage.removeItem(`twa_fitness_muscle_groups_${USER_ID}`);
                state.activeWorkout = null;
                state.selectedExercise = null;
                state.selectedMuscleGroup = 'Грудь';
                haptic('warning');
                navigateToTab('stats');
            });
        }

        function renderChart() {
            const ctx = document.getElementById('progressChart');
            if (!ctx) return;
            const existingChart = Chart.getChart(ctx);
            if (existingChart) existingChart.destroy();
            if (!state.selectedExercise) return;

            const history = DataAPI.getExerciseHistory(state.selectedExercise);
            if (history.length === 0) return;

            const dataByDate = {};
            history.forEach(item => {
                const key = new Date(item.date).toISOString().slice(0, 10);
                const label = new Date(item.date).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
                if (!dataByDate[key] || item.weight > dataByDate[key].weight) {
                    dataByDate[key] = { weight: item.weight, label: label };
                }
            });

            const sortedKeys = Object.keys(dataByDate).sort();
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sortedKeys.map(key => dataByDate[key].label),
                    datasets: [{
                        label: 'Вес (кг)',
                        data: sortedKeys.map(key => dataByDate[key].weight),
                        borderColor: getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-link-color') || '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.3,
                        fill: true,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        zoom: {
                            pan: { enabled: true, mode: 'x' },
                            zoom: { pinch: { enabled: true }, mode: 'x', limits: { x: { min: 'original', max: 'original' } } }
                        }
                    },
                    scales: {
                        y: { beginAtZero: false, ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-hint-color') || '#8e8e93' } },
                        x: { ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-hint-color') || '#8e8e93' } }
                    }
                }
            });
        }

        function selectMuscleGroup(group) {
            state.selectedMuscleGroup = group;
            state.selectedExercise = null;
            renderStats();
        }

        function selectExercise(name) {
            state.selectedExercise = state.selectedExercise === name ? null : name;
            renderStats();
        }

        const SUPERSET_COLORS = [
            { border: '#a855f7', bg: 'rgba(168, 85, 247, 0.08)', badgeBg: 'rgba(168, 85, 247, 0.25)', text: '#c084fc' },
            { border: '#3b82f6', bg: 'rgba(59, 130, 246, 0.08)', badgeBg: 'rgba(59, 130, 246, 0.25)', text: '#60a5fa' },
            { border: '#10b981', bg: 'rgba(16, 185, 129, 0.08)', badgeBg: 'rgba(16, 185, 129, 0.25)', text: '#34d399' },
            { border: '#f59e0b', bg: 'rgba(245, 158, 11, 0.08)', badgeBg: 'rgba(245, 158, 11, 0.25)', text: '#fbbf24' },
            { border: '#ec4899', bg: 'rgba(236, 72, 153, 0.08)', badgeBg: 'rgba(236, 72, 153, 0.25)', text: '#f472b6' }
        ];

        function getSupersetStyle(supersetId, allSupersetIds) {
            if (!supersetId) return { borderClass: '', styleAttr: '', badgeStyle: '', text: '#c084fc', border: '#a855f7' };
            const uniqueIds = Array.from(new Set(allSupersetIds.filter(Boolean)));
            const colorIndex = uniqueIds.indexOf(supersetId) % SUPERSET_COLORS.length;
            const c = SUPERSET_COLORS[colorIndex >= 0 ? colorIndex : 0];
            return {
                borderClass: '',
                styleAttr: `border-left: 4px solid ${c.border}; background: linear-gradient(90deg, ${c.bg}, transparent);`,
                badgeStyle: `background: ${c.badgeBg}; color: ${c.text};`,
                text: c.text,
                border: c.border
            };
        }

        function renderPrograms() {
            const programs = DataAPI.getPrograms();
            let listHTML = programs.length
                ? programs.map((program, index) => {
                    const exercises = program.exercises || [];
                    const allSsIds = exercises.map(e => e.supersetId);
                    const exerciseBlocks = [];
                    const processed = new Set();
                    
                    exercises.forEach((exercise, idx) => {
                        if (processed.has(idx)) return;
                        
                        if (exercise.supersetId) {
                            const group = exercises
                                .map((e, i) => ({ ...e, originalIndex: i }))
                                .filter(e => e.supersetId === exercise.supersetId);
                            group.forEach(e => processed.add(e.originalIndex));
                            
                            const style = getSupersetStyle(exercise.supersetId, allSsIds);
                            const groupHTML = group.map(e => 
                                `<div class="text-tgHint text-xs">${esc(e.name)} — ${e.targetSets ?? 3}×${e.targetReps ?? 10}</div>`
                            ).join('');
                            
                            exerciseBlocks.push(`
                                <div class="p-3 rounded-xl mb-2" style="${style.styleAttr}">
                                    <div class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[10px] font-bold mb-2 uppercase tracking-wide" style="${style.badgeStyle}"><i class="fa-solid fa-bolt"></i> СУПЕРСЕТ</div>
                                    ${groupHTML}
                                </div>
                            `);
                        } else {
                            processed.add(idx);
                            exerciseBlocks.push(`
                                <div class="text-tgHint text-xs mb-1">${esc(exercise.name)} — ${exercise.targetSets ?? 3}×${exercise.targetReps ?? 10}</div>
                            `);
                        }
                    });

                    return `
                        <div class="bg-tgSecondaryBg p-4 rounded-2xl mb-3 card-enter" style="animation-delay: ${index * 0.05}s">
                            <div class="flex justify-between items-start">
                                <div onclick="startWorkout('${program.id}')" class="flex-1 active:opacity-70 pr-2 cursor-pointer">
                                    <div class="font-semibold text-base mb-2">${esc(program.name)}</div>
                                    ${exerciseBlocks.join('') || '<div class="text-tgHint text-xs italic">Нет упражнений</div>'}
                                </div>
                                <div class="flex flex-col gap-2">
                                    <button onclick="navigate('program_edit', {programId: '${program.id}'})" aria-label="Редактировать программу" class="w-11 h-11 flex items-center justify-center rounded-full bg-tgBg text-tgLink active:opacity-70 transition-opacity">
                                        <i class="fa-solid fa-pen text-lg"></i>
                                    </button>
                                    <button onclick="deleteProgram('${program.id}')" aria-label="Удалить программу" class="w-11 h-11 flex items-center justify-center rounded-full bg-tgBg text-red-500 active:opacity-70 transition-opacity">
                                        <i class="fa-solid fa-trash text-lg"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('')
                : '<div class="text-center text-tgHint mt-10 card-enter">Нет созданных программ</div>';

            document.getElementById('app-content').innerHTML = `
                ${listHTML}
                <button onclick="navigate('program_edit', {programId: null})" class="w-full mt-6 bg-tgButton text-white font-semibold py-4 rounded-2xl active:opacity-80 transition-opacity card-enter" style="animation-delay: 0.1s">
                    <i class="fa-solid fa-plus mr-2"></i> Создать программу
                </button>
            `;
        }

        function openMuscleGroupsManager() {
            const modal = document.createElement('div');
            modal.id = 'muscle-groups-modal';
            modal.className = 'modal-backdrop';
            
            const updateModalContent = () => {
                const groups = getMuscleGroups();
                const contentDiv = modal.querySelector('.modal-sheet');
                contentDiv.innerHTML = `
                    <div class="w-10 h-1 bg-tgHint/40 rounded-full mx-auto mb-5"></div>
                    <h2 class="text-xl font-bold mb-4">Управление группами мышц</h2>

                    <div class="space-y-2 max-h-56 overflow-y-auto mb-4 pr-1">
                        ${groups.map((g) => `
                            <div class="flex items-center justify-between bg-tgBg p-3 rounded-xl">
                                <span class="text-sm font-medium">${esc(g)}</span>${DEFAULT_MUSCLE_GROUPS.includes(g) ? '<span class="text-xs text-tgHint">Стандартная</span>' : `
                                    <button onclick="deleteCustomMuscleGroup('${esc(g)}')" class="text-red-500 px-2 active:scale-95"><i class="fa-solid fa-trash"></i></button>
                                `}
                            </div>
                        `).join('')}
                    </div>

                    <div class="flex gap-2 mb-4">
                        <input type="text" id="new-muscle-input" placeholder="Новая группа мышц" class="flex-1 p-3 rounded-xl text-sm">
                        <button onclick="addNewMuscleGroup()" class="px-4 py-3 bg-tgButton text-white font-semibold rounded-xl text-sm active:scale-95">Добавить</button>
                    </div>

                    <button onclick="document.getElementById('muscle-groups-modal').remove(); renderProgramEdit();" class="w-full py-3 bg-tgBg rounded-2xl font-semibold active:opacity-80">Готово</button>
                `;
            };

            const sheet = document.createElement('div');
            sheet.className = 'modal-sheet';
            modal.appendChild(sheet);
            document.body.appendChild(modal);
            updateModalContent();

            modal.addEventListener('click', event => {
                if (event.target === modal) {
                    modal.remove();
                    renderProgramEdit();
                }
            });
            window._updateMgModal = updateModalContent;
        }

        function addNewMuscleGroup() {
            const input = document.getElementById('new-muscle-input');
            const val = input ? input.value.trim() : '';
            if (!val) return;
            const groups = getMuscleGroups();
            if (groups.includes(val)) {
                showAlert('Такая группа уже есть');
                return;
            }
            groups.push(val);
            saveMuscleGroups(groups);
            haptic('success');
            if (window._updateMgModal) window._updateMgModal();
        }

        function deleteCustomMuscleGroup(groupName) {
            let groups = getMuscleGroups();
            groups = groups.filter(g => g !== groupName);
            saveMuscleGroups(groups);
            haptic('light');
            if (window._updateMgModal) window._updateMgModal();
        }

        function renderProgramEdit() {
            const program = state.editingProgram || { name: '', exercises: [] };
            const exercises = program.exercises || [];
            const muscleGroups = getMuscleGroups();
            const allSsIds = exercises.map(e => e.supersetId);
            const activeSsId = state.supersetActiveId;
            const allSavedExercises = DataAPI.getUserExercises();

            let exercisesHTML = exercises.map((exercise, index) => {
                const isInThisSuperset = activeSsId && exercise.supersetId === activeSsId;
                const isBodyweight = exercise.exerciseType === 'bodyweight';
                const style = getSupersetStyle(exercise.supersetId, allSsIds);

                let btnStyle = '';
                let btnClass = 'text-tgHint bg-tgBg';
                let btnTitle = 'Объединить в суперсет';

                if (activeSsId) {
                    if (isInThisSuperset) {
                        btnStyle = `background: ${style.border}; color: #ffffff; box-shadow: 0 0 12px ${style.border};`;
                        btnTitle = 'В активном суперсете (нажмите, чтобы убрать)';
                    } else {
                        btnStyle = `border: 2px dashed ${style.border}; color: ${style.text};`;
                        btnClass = 'animate-pulse';
                        btnTitle = 'Нажмите, чтобы добавить в этот суперсет';
                    }
                } else if (exercise.supersetId) {
                    btnStyle = `background: ${style.badgeStyle}; color: ${style.text}; border: 1px solid ${style.border};`;
                }

                // Фильтруем сохраненные упражнения по выбранной группе мышц
                const currentMuscle = exercise.muscleGroup;
                const filteredExercises = currentMuscle 
                    ? allSavedExercises.filter(e => e.muscleGroup === currentMuscle)
                    : allSavedExercises;
                
                const datalistId = `saved-exercises-${index}`;
                
                return `
                    <div class="bg-tgSecondaryBg p-4 rounded-2xl mb-3 card-enter" style="animation-delay: ${index * 0.05}s; ${exercise.supersetId ? style.styleAttr : ''}">
                        <div class="flex justify-between items-center mb-3">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-medium text-sm text-tgHint">Упражнение ${index + 1}</span>
                                ${exercise.supersetId ? `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase" style="${style.badgeStyle}"><i class="fa-solid fa-bolt"></i> СУПЕРСЕТ</span>` : ''}
                            </div>
                            <div class="flex gap-1">
                                <button onclick="toggleSupersetClick(${index})" title="${btnTitle}" class="w-9 h-9 flex items-center justify-center rounded-full ${btnClass} active:opacity-70 transition-all" style="${btnStyle}">
                                    <i class="fa-solid fa-link"></i>
                                </button>
                                <button onclick="removeExercise(${index})" aria-label="Удалить упражнение" class="w-9 h-9 flex items-center justify-center rounded-full text-red-500 active:opacity-70">
                                    <i class="fa-solid fa-times"></i>
                                </button>
                            </div>
                        </div>

                        <!-- ⭐ 1. Выбор группы мышц (теперь первым) -->
                        <select onchange="onExerciseMuscleChange(${index}, this.value)" class="w-full p-3 rounded-xl mb-3 text-sm">
                            <option value="">Выберите группу мышц</option>
                            ${muscleGroups.map(group => `<option value="${group}" ${exercise.muscleGroup === group ? 'selected' : ''}>${group}</option>`).join('')}
                        </select>

                        <!-- ⭐ 2. Комбинированное поле выбора из сохраненных / ввода нового упражнения -->
                        <div class="mb-3">
                            <input type="text" list="${datalistId}" placeholder="Название упражнения (выберите или введите)" value="${esc(exercise.name)}" oninput="updateExercise(${index}, 'name', this.value)" class="w-full p-3 rounded-xl text-sm font-medium">
                            <datalist id="${datalistId}">
                                ${filteredExercises.map(ex => `<option value="${esc(ex.name)}">`).join('')}
                            </datalist>
                        </div>
                        
                        <!-- ⭐ 3. Галочка собственного веса -->
                        <label class="checkbox-label mb-3 p-3 rounded-xl bg-tgBg">
                            <input type="checkbox" ${isBodyweight ? 'checked' : ''} onchange="updateExercise(${index}, 'exerciseType', this.checked ? 'bodyweight' : 'weighted')">
                            <span class="text-sm font-medium">Собственный вес</span>
                        </label>
                        
                        <!-- ⭐ 4. Подходы и повторения с кнопками быстрых шагов (+ / -) -->
                        <div class="flex gap-3">
                            <div class="flex-1">
                                <label class="text-xs text-tgHint mb-1 block">Подходы</label>
                                <div class="flex items-center gap-1">
                                    <button onclick="adjustProgramParam(${index}, 'targetSets', -1)" class="w-10 h-10 rounded-xl bg-tgBg font-bold active:opacity-70 shrink-0">−</button>
                                    <input type="number" id="sets-${index}" inputmode="numeric" value="${exercise.targetSets ?? 3}" onchange="updateExercise(${index}, 'targetSets', parseInt(this.value) || 3)" class="w-full h-10 rounded-xl text-sm text-center font-semibold">
                                    <button onclick="adjustProgramParam(${index}, 'targetSets', 1)" class="w-10 h-10 rounded-xl bg-tgBg font-bold active:opacity-70 shrink-0">+</button>
                                </div>
                            </div>
                            <div class="flex-1">
                                <label class="text-xs text-tgHint mb-1 block">Повторения</label>
                                <div class="flex items-center gap-1">
                                    <button onclick="adjustProgramParam(${index}, 'targetReps', -1)" class="w-10 h-10 rounded-xl bg-tgBg font-bold active:opacity-70 shrink-0">−</button>
                                    <input type="number" id="reps-${index}" inputmode="numeric" value="${exercise.targetReps ?? 10}" onchange="updateExercise(${index}, 'targetReps', parseInt(this.value) || 10)" class="w-full h-10 rounded-xl text-sm text-center font-semibold">
                                    <button onclick="adjustProgramParam(${index}, 'targetReps', 1)" class="w-10 h-10 rounded-xl bg-tgBg font-bold active:opacity-70 shrink-0">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            let supersetBar = '';
            if (activeSsId) {
                const groupExs = exercises.filter(e => e.supersetId === activeSsId);
                const style = getSupersetStyle(activeSsId, allSsIds);
                const exercisesListHTML = groupExs.map(e => `<div class="font-bold text-sm truncate">• ${esc(e.name || 'Без названия')}</div>`).join('');
                
                supersetBar = `
                    <div class="sticky top-0 z-30 mb-4 p-4 rounded-2xl shadow-xl card-enter flex items-center justify-between gap-3" style="${style.styleAttr} border: 2px solid ${style.border}">
                        <div class="min-w-0 flex-1">
                            <div class="text-[10px] font-bold uppercase tracking-wide mb-1" style="color: ${style.text}">Режим суперсета</div>
                            <div class="space-y-0.5">${exercisesListHTML}</div>
                        </div>
                        <button onclick="finishSupersetCreation()" class="px-4 py-3 bg-white text-black font-bold rounded-xl text-sm shrink-0 active:scale-95 shadow">
                            Готово ✓
                        </button>
                    </div>
                `;
            }

            document.getElementById('app-content').innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <input type="text" id="prog-name" placeholder="Название программы" value="${esc(program.name)}" oninput="updateProgramName(this.value)" class="flex-1 p-4 rounded-2xl text-lg font-semibold card-enter mr-2">
                    <button onclick="openMuscleGroupsManager()" title="Управление группами" class="w-14 h-14 bg-tgSecondaryBg rounded-2xl flex items-center justify-center text-tgLink active:opacity-70"><i class="fa-solid fa-tags text-lg"></i></button>
                </div>
                ${supersetBar}
                <div id="exercises-list">${exercisesHTML}</div>
                <button onclick="addExercise()" class="w-full py-4 border-2 border-dashed border-tgHint rounded-2xl text-tgHint mt-2 active:bg-tgSecondaryBg transition-colors card-enter" style="animation-delay: 0.1s">
                    <i class="fa-solid fa-plus mr-2"></i> Добавить упражнение
                </button>
                <button onclick="saveProgram()" class="w-full mt-6 mb-4 bg-tgButton text-white font-semibold py-4 rounded-2xl active:opacity-80 transition-opacity card-enter">
                    <i class="fa-solid fa-check mr-2"></i> Сохранить программу
                </button>
            `;
            clearMainButton();
        }

        function updateProgramName(value) {
            if (!state.editingProgram) state.editingProgram = { name: '', exercises: [] };
            state.editingProgram.name = value;
        }

        function onExerciseMuscleChange(index, value) {
            updateExercise(index, 'muscleGroup', value);
            // При смене группы очищаем имя, если оно не подходит, либо оставляем
        }

        function adjustProgramParam(index, field, delta) {
            const exercise = state.editingProgram.exercises[index];
            const current = exercise[field] ?? (field === 'targetSets' ? 3 : 10);
            const newVal = Math.max(1, current + delta);
            exercise[field] = newVal;
            haptic('light');
            const input = document.getElementById(`${field === 'targetSets' ? 'sets' : 'reps'}-${index}`);
            if (input) input.value = newVal;
        }

        function addExercise() {
            if (!state.editingProgram) state.editingProgram = { name: '', exercises: [] };
            if (!state.editingProgram.exercises) state.editingProgram.exercises = [];
            state.editingProgram.exercises.push({
                id: createId(),
                name: '',
                muscleGroup: '',
                exerciseType: 'weighted',
                supersetId: null,
                targetSets: 3,
                targetReps: 10
            });
            renderProgramEdit();
        }

        function removeExercise(index) {
            const exercises = state.editingProgram.exercises;
            const removed = exercises[index];
            
            if (removed.supersetId) {
                const ssId = removed.supersetId;
                exercises[index].supersetId = null;
                const remaining = exercises.filter(ex => ex.supersetId === ssId);
                if (remaining.length === 1) {
                    remaining[0].supersetId = null;
                }
            }
            
            exercises.splice(index, 1);
            renderProgramEdit();
        }

        function updateExercise(index, field, value) {
            if (!state.editingProgram) state.editingProgram = { name: '', exercises: [] };
            state.editingProgram.exercises[index][field] = value;
        }

        function toggleSupersetClick(index) {
            const exercises = state.editingProgram.exercises;
            const current = exercises[index];

            if (!state.supersetActiveId) {
                if (!current.supersetId) {
                    current.supersetId = createId();
                }
                state.supersetActiveId = current.supersetId;
                haptic('medium');
                renderProgramEdit();
            } else {
                if (current.supersetId === state.supersetActiveId) {
                    current.supersetId = null;
                    const remaining = exercises.filter(ex => ex.supersetId === state.supersetActiveId);
                    if (remaining.length < 2) {
                        remaining.forEach(ex => ex.supersetId = null);
                        state.supersetActiveId = null;
                    }
                    haptic('light');
                } else {
                    current.supersetId = state.supersetActiveId;
                    haptic('success');
                }
                renderProgramEdit();
            }
        }

        function finishSupersetCreation() {
            state.supersetActiveId = null;
            haptic('success');
            renderProgramEdit();
        }

        function saveProgram() {
            const nameInput = document.getElementById('prog-name');
            const name = nameInput ? nameInput.value.trim() : '';
            if (!name) { showAlert('Введите название программы'); return; }
            if (!state.editingProgram || (state.editingProgram.exercises || []).length === 0) { showAlert('Добавьте хотя бы одно упражнение'); return; }
            
            for (const exercise of state.editingProgram.exercises) {
                if (!exercise.name || !exercise.name.trim()) { showAlert('Заполните названия всех упражнений'); return; }
                if (!exercise.muscleGroup) { showAlert(`Выберите группу мышц для упражнения «${exercise.name}»`); return; }
            }

            state.editingProgram.name = name;
            const programs = DataAPI.getPrograms();
            const existingIndex = programs.findIndex(program => program.id === state.editingProgram.id);

            if (existingIndex > -1) programs[existingIndex] = state.editingProgram;
            else { state.editingProgram.id = createId(); programs.push(state.editingProgram); }

            DataAPI.savePrograms(programs);
            haptic('success');
            state.editingProgram = null;
            state.supersetActiveId = null;
            openProgramsScreen();
        }

        function deleteProgram(id) {
            showConfirm('Удалить программу?', ok => {
                if (!ok) return;
                DataAPI.savePrograms(DataAPI.getPrograms().filter(program => program.id !== id));
                renderPrograms();
            });
        }

        function generateSetHTML(exerciseIndex, setIndex, set, exerciseType) {
            const isBodyweight = exerciseType === 'bodyweight';
            const weightLabel = isBodyweight ? 'Доп. вес' : 'Вес';
            const isDropSet = set.setType === 'drop';
            
            return `
                <div id="set-row-${exerciseIndex}-${setIndex}" class="bg-tgBg rounded-xl p-3 mb-2 card-enter ${isDropSet ? 'set-drop' : ''}" style="animation-delay: 0.03s">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="text-tgHint text-sm font-medium">Подход ${setIndex + 1}</span>
                            ${isDropSet ? '<span class="drop-badge"><i class="fa-solid fa-fire"></i> ДРОП-СЕТ</span>' : ''}
                            ${isBodyweight ? '<span class="bodyweight-badge">Собственный вес</span>' : ''}
                        </div>
                        <button onclick="removeSet(${exerciseIndex}, ${setIndex})" aria-label="Удалить подход" class="w-8 h-8 flex items-center justify-center rounded-full text-red-500 active:opacity-70">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>

                    <div class="flex items-center gap-2 mb-2">
                        <button onclick="adjustSet(${exerciseIndex}, ${setIndex}, 'weight', -2.5)" class="w-10 h-10 rounded-lg bg-tgSecondaryBg text-lg flex items-center justify-center active:opacity-70 font-bold shrink-0">−</button>
                        <input type="number" id="set-${exerciseIndex}-${setIndex}-weight" inputmode="decimal" value="${set.weight}" onchange="updateSet(${exerciseIndex}, ${setIndex}, 'weight', parseFloat(this.value) || 0)" class="w-20 h-10 text-center bg-transparent text-xl font-semibold shrink-0">
                        <button onclick="adjustSet(${exerciseIndex}, ${setIndex}, 'weight', 2.5)" class="w-10 h-10 rounded-lg bg-tgSecondaryBg text-lg flex items-center justify-center active:opacity-70 font-bold shrink-0">+</button>
                        <span class="text-tgHint text-sm w-16 text-center shrink-0">${weightLabel}</span>
                    </div>

                    <div class="flex items-center gap-2">
                        <button onclick="adjustSet(${exerciseIndex}, ${setIndex}, 'reps', -1)" class="w-10 h-10 rounded-lg bg-tgSecondaryBg text-lg flex items-center justify-center active:opacity-70 font-bold shrink-0">−</button>
                        <input type="number" id="set-${exerciseIndex}-${setIndex}-reps" inputmode="numeric" value="${set.reps}" onchange="updateSet(${exerciseIndex}, ${setIndex}, 'reps', parseInt(this.value) || 0)" class="w-14 h-10 text-center bg-transparent text-xl font-semibold shrink-0">
                        <button onclick="adjustSet(${exerciseIndex}, ${setIndex}, 'reps', 1)" class="w-10 h-10 rounded-lg bg-tgSecondaryBg text-lg flex items-center justify-center active:opacity-70 font-bold shrink-0">+</button>
                        <span class="text-tgHint text-sm w-12 text-center shrink-0">повт</span>
                    </div>
                </div>
            `;
        }

        function generateExerciseCardHTML(exerciseIndex, exercise, allSsIds) {
            const sets = exercise.sets || [];
            const completedSets = sets.filter(s => s.weight >= 0 && s.reps > 0).length;
            const targetSets = exercise.targetSets ?? 3;
            const isComplete = completedSets >= targetSets;
            const exerciseType = exercise.exerciseType || 'weighted';
            const style = getSupersetStyle(exercise.supersetId, allSsIds);

            const setsHTML = sets.map((set, setIndex) => generateSetHTML(exerciseIndex, setIndex, set, exerciseType)).join('');

            return `
                <div id="exercise-card-${exerciseIndex}" class="bg-tgSecondaryBg p-4 rounded-2xl mb-4 card-enter" style="animation-delay: ${exerciseIndex * 0.1}s; ${exercise.supersetId ? style.styleAttr : ''}">
                    <div class="flex justify-between items-center mb-3 gap-2">
                        <div class="flex items-center gap-2 flex-1 min-w-0 flex-wrap">
                            <h3 class="font-bold text-base truncate">${esc(exercise.name)}</h3>
                            ${exercise.supersetId ? `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase shrink-0" style="${style.badgeStyle}"><i class="fa-solid fa-bolt"></i> СУПЕРСЕТ</span>` : ''}
                            ${exerciseType === 'bodyweight' ? '<span class="bodyweight-badge shrink-0">Собственный вес</span>' : ''}
                        </div>
                        <span id="badge-${exerciseIndex}" class="text-xs font-medium px-2 py-1 rounded-md shrink-0 ${isComplete ? 'bg-green-500/20 text-green-500' : 'bg-tgBg text-tgHint'}">
                            ${isComplete ? '✓ Готово' : `${completedSets}/${targetSets}`}
                        </span>
                    </div>
                    <div id="sets-container-${exerciseIndex}">${setsHTML}</div>
                    <div class="flex gap-2 mt-1">
                        <button id="add-set-btn-${exerciseIndex}" onclick="addSet(${exerciseIndex})" class="flex-1 py-3 bg-tgBg rounded-xl text-tgLink text-sm font-semibold active:opacity-70 transition-opacity">
                            + Подход
                        </button>
                        <button onclick="addDropSet(${exerciseIndex})" class="flex-1 py-3 bg-orange-500/15 rounded-xl text-orange-400 text-sm font-semibold active:opacity-70 transition-opacity">
                            <i class="fa-solid fa-fire mr-1"></i> Дроп-сет
                        </button>
                    </div>
                </div>
            `;
        }

        function updateExerciseCardInDOM(exerciseIndex, exercise) {
            const allSsIds = state.activeWorkout.exercises.map(e => e.supersetId);
            const cardHTML = generateExerciseCardHTML(exerciseIndex, exercise, allSsIds);
            const existingCard = document.getElementById(`exercise-card-${exerciseIndex}`);
            if (existingCard) {
                existingCard.outerHTML = cardHTML;
            }
        }

        function renderWorkout() {
            const workout = state.activeWorkout;
            if (!workout) {
                openProgramsScreen();
                return;
            }

            const exercises = workout.exercises || [];
            const allSsIds = exercises.map(e => e.supersetId);
            const groups = [];
            const processed = new Set();
            
            exercises.forEach((exercise, idx) => {
                if (processed.has(idx)) return;
                
                if (exercise.supersetId) {
                    const group = exercises
                        .map((e, i) => ({ ...e, originalIndex: i }))
                        .filter(e => e.supersetId === exercise.supersetId);
                    group.forEach(e => processed.add(e.originalIndex));
                    groups.push({ type: 'superset', exercises: group });
                } else {
                    processed.add(idx);
                    groups.push({ type: 'single', exercise: exercise, originalIndex: idx });
                }
            });

            let groupsHTML = groups.map((group, groupIndex) => {
                if (group.type === 'superset') {
                    const style = getSupersetStyle(group.exercises[0].supersetId, allSsIds);
                    const cardsHTML = group.exercises.map(ex => 
                        generateExerciseCardHTML(ex.originalIndex, ex, allSsIds)
                    ).join('');
                    
                    return `
                        <div class="rounded-2xl p-2 mb-4 card-enter" style="animation-delay: ${groupIndex * 0.1}s; ${style.styleAttr}">
                            <div class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-[11px] font-bold mb-3 uppercase tracking-wide" style="${style.badgeStyle}"><i class="fa-solid fa-bolt"></i> СУПЕРСЕТ — выполнять без отдыха</div>
                            ${cardsHTML}
                        </div>
                    `;
                } else {
                    return generateExerciseCardHTML(group.originalIndex, group.exercise, allSsIds);
                }
            }).join('');

            document.getElementById('app-content').innerHTML = `
                <div class="sticky top-0 z-10 bg-tgBg/95 backdrop-blur-md py-4 mb-4 border-b border-tgSecondaryBg card-enter">
                    <div class="text-4xl font-mono font-bold text-tgLink tracking-wider text-center" id="workout-timer">00:00:00</div>
                    <div class="text-tgHint text-xs mt-1 uppercase tracking-wide text-center">Время тренировки</div>
                </div>
                ${groupsHTML}
                <button onclick="promptWorkoutExit('programs')" class="w-full mt-6 mb-4 bg-red-600 text-white font-semibold py-4 rounded-2xl active:opacity-80 transition-opacity card-enter">
                    <i class="fa-solid fa-stop mr-2"></i> Завершить тренировку
                </button>
            `;

            startTimer();
            clearMainButton();
        }

        function adjustSet(exerciseIndex, setIndex, field, delta) {
            const exercise = state.activeWorkout.exercises[exerciseIndex];
            const current = exercise.sets[setIndex][field] || 0;
            const newValue = field === 'weight' ? Math.max(0, parseFloat((current + delta).toFixed(1))) : Math.max(0, current + delta);

            updateSet(exerciseIndex, setIndex, field, newValue);
            haptic('light');

            const inputElement = document.getElementById(`set-${exerciseIndex}-${setIndex}-${field}`);
            if (inputElement) inputElement.value = newValue;

            const completedSets = exercise.sets.filter(s => s.weight >= 0 && s.reps > 0).length;
            const targetSets = exercise.targetSets ?? 3;
            const isComplete = completedSets >= targetSets;
            
            const badge = document.getElementById(`badge-${exerciseIndex}`);
            if (badge) {
                badge.className = `text-xs font-medium px-2 py-1 rounded-md shrink-0 ${isComplete ? 'bg-green-500/20 text-green-500' : 'bg-tgBg text-tgHint'}`;
                badge.innerText = isComplete ? '✓ Готово' : `${completedSets}/${targetSets}`;
            }
        }

        function addSet(exerciseIndex) {
            const exercise = state.activeWorkout.exercises[exerciseIndex];
            const sets = exercise.sets;
            let defaultWeight = 0;
            let defaultReps = exercise.targetReps ?? 10;

            if (sets.length > 0) {
                const lastSet = sets[sets.length - 1];
                defaultWeight = lastSet.weight;
                defaultReps = lastSet.reps;
            }

            sets.push({ weight: defaultWeight, reps: defaultReps, setType: 'regular' });
            saveActiveWorkout();
            haptic('light');
            updateExerciseCardInDOM(exerciseIndex, exercise);
        }

        function addDropSet(exerciseIndex) {
            const exercise = state.activeWorkout.exercises[exerciseIndex];
            const sets = exercise.sets;
            
            if (sets.length === 0) {
                showAlert('Сначала добавьте обычный подход');
                return;
            }
            
            const lastSet = sets[sets.length - 1];
            const dropWeight = Math.max(0, Math.round((lastSet.weight * 0.75) / 2.5) * 2.5);
            
            sets.push({
                weight: dropWeight,
                reps: lastSet.reps,
                setType: 'drop'
            });
            
            saveActiveWorkout();
            haptic('medium');
            updateExerciseCardInDOM(exerciseIndex, exercise);
        }

        function removeSet(exerciseIndex, setIndex) {
            const sets = state.activeWorkout.exercises[exerciseIndex].sets;
            if (sets.length <= 1) {
                sets[0] = { weight: 0, reps: 10, setType: 'regular' };
            } else {
                sets.splice(setIndex, 1);
            }
            saveActiveWorkout();
            haptic('light');
            updateExerciseCardInDOM(exerciseIndex, state.activeWorkout.exercises[exerciseIndex]);
        }

        function updateSet(exerciseIndex, setIndex, field, value) {
            state.activeWorkout.exercises[exerciseIndex].sets[setIndex][field] = value;
            saveActiveWorkout();
        }

        function startWorkout(programId) {
            const program = DataAPI.getProgramById(programId);
            if (!program || !(program.exercises || []).length) {
                showAlert('В программе нет упражнений');
                return;
            }
            state.activeWorkout = {
                programId: program.id,
                programName: program.name,
                startTime: Date.now(),
                exercises: program.exercises.map(exercise => ({
                    name: exercise.name,
                    muscleGroup: exercise.muscleGroup,
                    exerciseType: exercise.exerciseType || 'weighted',
                    supersetId: exercise.supersetId || null,
                    targetSets: exercise.targetSets,
                    targetReps: exercise.targetReps,
                    sets: [{ weight: 0, reps: exercise.targetReps || 10, setType: 'regular' }]
                }))
            };
            saveActiveWorkout();
            navigate('workout');
        }

        function startTimer() {
            stopWorkoutTimer();
            const update = () => {
                if (!state.activeWorkout) return;
                const elapsed = Date.now() - state.activeWorkout.startTime;
                const hours = Math.floor(elapsed / 3600000).toString().padStart(2, '0');
                const minutes = Math.floor((elapsed % 3600000) / 60000).toString().padStart(2, '0');
                const seconds = Math.floor((elapsed % 60000) / 1000).toString().padStart(2, '0');
                const timerElement = document.getElementById('workout-timer');
                if (timerElement) timerElement.innerText = `${hours}:${minutes}:${seconds}`;
            };
            update();
            state.workoutTimer = setInterval(update, 1000);
        }

        function stopWorkoutTimer() {
            if (state.workoutTimer) {
                clearInterval(state.workoutTimer);
                state.workoutTimer = null;
            }
        }

        function clearWorkoutState() {
            stopWorkoutTimer();
            state.activeWorkout = null;
            saveActiveWorkout();
            clearMainButton();
        }

        function renderHistory() {
            const history = DataAPI.getHistory().sort((a, b) => new Date(b.date) - new Date(a.date));
            let listHTML = history.length
                ? history.map((entry, index) => {
                    const date = new Date(entry.date);
                    const dateStr = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
                    const timeStr = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                    const durationMin = Math.round(entry.duration / 60);
                    const totalSets = (entry.exercises || []).reduce((sum, exercise) => sum + (exercise.sets || []).length, 0);

                    return `
                        <div onclick='navigate("history_detail", {entryId: "${entry.id}"})' class="bg-tgSecondaryBg p-4 rounded-2xl mb-3 active:scale-[0.98] transition-transform cursor-pointer card-enter" style="animation-delay: ${index * 0.05}s">
                            <div class="flex justify-between items-start mb-2">
                                <div class="font-semibold text-base">${esc(entry.programName)}</div>
                                <div class="text-tgHint text-sm">${dateStr}</div>
                            </div>
                            <div class="flex gap-4 text-sm text-tgHint">
                                <span><i class="fa-regular fa-clock mr-1"></i> ${durationMin} мин</span>
                                <span><i class="fa-solid fa-layer-group mr-1"></i> ${totalSets} подх.</span>
                                <span>${timeStr}</span>
                            </div>
                        </div>
                    `;
                }).join('')
                : '<div class="text-center text-tgHint mt-10 card-enter">История пуста</div>';

            document.getElementById('app-content').innerHTML = listHTML;
        }

        function renderHistoryDetail(entryId) {
            const entry = DataAPI.getHistoryEntryById(entryId);
            if (!entry) {
                document.getElementById('app-content').innerHTML = '<p class="text-center text-tgHint mt-10">Запись не найдена</p>';
                return;
            }
            const date = new Date(entry.date).toLocaleString('ru-RU');
            let exercisesHTML = (entry.exercises || []).map((exercise, index) => {
                const isBodyweight = exercise.exerciseType === 'bodyweight';
                
                let setsHTML = (exercise.sets || []).map((set, setIndex) => {
                    const isDrop = set.setType === 'drop';
                    return `
                        <div class="flex justify-between py-2 border-b border-tgBg last:border-0 ${isDrop ? 'text-orange-400' : ''}">
                            <span class="text-tgHint text-sm flex items-center gap-2">
                                ${setIndex + 1}.
                                ${isDrop ? '<span class="drop-badge"><i class="fa-solid fa-fire"></i> ДРОП-СЕТ</span>' : ''}
                            </span>
                            <span class="font-medium">${set.weight} кг × ${set.reps} повт</span>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="mb-4 card-enter" style="animation-delay: ${index * 0.05}s">
                        <div class="flex items-center gap-2 mb-2 flex-wrap">
                            <h3 class="font-bold text-base">${esc(exercise.name)}</h3>
                            ${isBodyweight ? '<span class="bodyweight-badge">Собственный вес</span>' : ''}
                        </div>
                        <div class="bg-tgSecondaryBg p-4 rounded-2xl text-sm">${setsHTML}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('app-content').innerHTML = `
                <div class="text-center mb-6 card-enter">
                    <h2 class="text-xl font-bold">${esc(entry.programName)}</h2>
                    <p class="text-tgHint text-sm mt-1">${date}</p>
                </div>
                ${exercisesHTML}
            `;
        }

        let workoutDialogOpen = false;

        function promptWorkoutExit(targetTab = 'programs') {
            if (workoutDialogOpen) return;
            workoutDialogOpen = true;
            clearMainButton();

            const existingModal = document.getElementById('workout-exit-modal');
            if (existingModal) existingModal.remove();

            const modal = document.createElement('div');
            modal.id = 'workout-exit-modal';
            modal.className = 'modal-backdrop';
            modal.innerHTML = `
                <div class="modal-sheet" role="dialog" aria-modal="true">
                    <div class="w-10 h-1 bg-tgHint/40 rounded-full mx-auto mb-5"></div>
                    <h2 class="text-xl font-bold text-center mb-2">Завершить тренировку?</h2>
                    <p class="text-tgHint text-sm text-center mb-5">Что сделать с текущей тренировкой?</p>
                    <div class="space-y-3">
                        <button id="workout-save-btn" class="w-full py-4 rounded-2xl bg-tgButton text-white font-semibold active:opacity-80 transition-opacity">
                            <i class="fa-solid fa-check mr-2"></i> Завершить и сохранить
                        </button>
                        <button id="workout-discard-btn" class="w-full py-4 rounded-2xl bg-red-500/15 text-red-500 font-semibold active:opacity-80 transition-opacity">
                            <i class="fa-solid fa-trash mr-2"></i> Не сохранять
                        </button>
                        <button id="workout-cancel-btn" class="w-full py-4 rounded-2xl bg-tgBg text-tgText font-semibold active:opacity-80 transition-opacity">
                            Отмена
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const closeDialog = () => {
                workoutDialogOpen = false;
                modal.remove();
            };

            document.getElementById('workout-cancel-btn').onclick = () => { closeDialog(); haptic('light'); };
            document.getElementById('workout-save-btn').onclick = () => { closeDialog(); saveWorkoutAndOpenPrograms(); };
            document.getElementById('workout-discard-btn').onclick = () => { closeDialog(); discardWorkoutAndOpenPrograms(); };
            modal.addEventListener('click', event => { if (event.target === modal) closeDialog(); });
        }

        function saveWorkoutAndOpenPrograms() {
            try {
                const workout = state.activeWorkout;
                if (workout) {
                    const history = DataAPI.getHistory();
                    history.push({
                        id: createId(),
                        date: new Date(workout.startTime).toISOString(),
                        duration: Math.max(0, Math.round((Date.now() - workout.startTime) / 1000)),
                        programName: workout.programName,
                        exercises: workout.exercises.map(exercise => ({
                            name: exercise.name,
                            muscleGroup: exercise.muscleGroup || '',
                            exerciseType: exercise.exerciseType || 'weighted',
                            supersetId: exercise.supersetId || null,
                            targetSets: exercise.targetSets ?? 3,
                            targetReps: exercise.targetReps ?? 10,
                            sets: (exercise.sets || []).map(set => ({
                                weight: Number(set.weight) || 0,
                                reps: Number(set.reps) || 0,
                                setType: set.setType || 'regular'
                            }))
                        }))
                    });
                    DataAPI.saveHistory(history);
                }
                clearWorkoutState();
                haptic('success');
            } catch (error) {
                console.error('Save workout error:', error);
                clearWorkoutState();
            }
            openProgramsScreen();
        }

        function discardWorkoutAndOpenPrograms() {
            clearWorkoutState();
            haptic('light');
            openProgramsScreen();
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const bottomNav = document.getElementById('bottom-nav');
                if (!bottomNav) return;
                const isKeyboardOpen = window.visualViewport.height < window.innerHeight - 150;
                if (isKeyboardOpen) {
                    bottomNav.classList.add('keyboard-hidden');
                } else {
                    bottomNav.classList.remove('keyboard-hidden');
                }
            });
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && state.currentScreen === 'workout' && state.activeWorkout) {
                startTimer();
            }
        });

        if (restoreActiveWorkout()) {
            navigate('workout');
        } else {
            navigateToTab('stats');
        }
    </script>
</body>
</html>
