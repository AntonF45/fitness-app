                    </div>

                    <button onclick="document.getElementById('muscle-groups-modal').remove(); renderProgramEdit();" class="w-full py-3 bg-tgBg rounded-2xl font-semibold active:opacity-80">Готово</button>
                `;
            };

            const sheet = document.createElement('div');
            sheet.className = 'modal-sheet';
            modal.appendChild(sheet);
            document.body.appendChild(modal);
            updateModalContent();

            modal.addEventListener('click', event => {
                if (event.target === modal) {
                    modal.remove();
                    renderProgramEdit();
                }
            });
            window._updateMgModal = updateModalContent;
        }

        function addNewMuscleGroup() {
            const input = document.getElementById('new-muscle-input');
            const val = input ? input.value.trim() : '';
            if (!val) return;
            const groups = getMuscleGroups();
            if (groups.includes(val)) {
                showAlert('Такая группа уже есть');
                return;
            }
            groups.push(val);
            saveMuscleGroups(groups);
            haptic('success');
            if (window._updateMgModal) window._updateMgModal();
        }

        function deleteCustomMuscleGroup(groupName) {
            let groups = getMuscleGroups();
            groups = groups.filter(g => g !== groupName);
            saveMuscleGroups(groups);
            haptic('light');
            if (window._updateMgModal) window._updateMgModal();
        }

        function renderProgramEdit() {
            const program = state.editingProgram || { name: '', exercises: [] };
            const exercises = program.exercises || [];
            const muscleGroups = getMuscleGroups();
            const allSsIds = exercises.map(e => e.supersetId);
            const activeSsId = state.supersetActiveId;
            const allSavedExercises = DataAPI.getUserExercises();

            let exercisesHTML = exercises.map((exercise, index) => {
                const isInThisSuperset = activeSsId && exercise.supersetId === activeSsId;
                const isBodyweight = exercise.exerciseType === 'bodyweight';
                const style = getSupersetStyle(exercise.supersetId, allSsIds);

                let btnStyle = '';
                let btnClass = 'text-tgHint bg-tgBg';
                let btnTitle = 'Объединить в суперсет';

                if (activeSsId) {
                    if (isInThisSuperset) {
                        btnStyle = `background: ${style.border}; color: #ffffff; box-shadow: 0 0 12px ${style.border};`;
                        btnTitle = 'В активном суперсете (нажмите, чтобы убрать)';
                    } else {
                        btnStyle = `border: 2px dashed ${style.border}; color: ${style.text};`;
                        btnClass = 'animate-pulse';
                        btnTitle = 'Нажмите, чтобы добавить в этот суперсет';
                    }
                } else if (exercise.supersetId) {
                    btnStyle = `background: ${style.badgeStyle}; color: ${style.text}; border: 1px solid ${style.border};`;
                }

                const currentMuscle = exercise.muscleGroup;
                
                const exerciseDropdownId = `autocomplete-exercise-${index}`;
                const muscleDropdownId = `autocomplete-muscle-${index}`;
                
                return `
                    <div class="bg-tgSecondaryBg p-4 rounded-2xl mb-3 card-enter" style="animation-delay: ${index * 0.05}s; ${exercise.supersetId ? style.styleAttr : ''}">
                        <div class="flex justify-between items-center mb-3">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-medium text-sm text-tgHint">Упражнение ${index + 1}</span>
                            </div>
                            <div class="flex gap-1">
                                <button onclick="toggleSupersetClick(${index})" title="${btnTitle}" class="w-9 h-9 flex items-center justify-center rounded-full ${btnClass} active:opacity-70 transition-all" style="${btnStyle}">
                                    <i class="fa-solid fa-link"></i>
                                </button>
                                <button onclick="removeExercise(${index})" aria-label="Удалить упражнение" class="w-9 h-9 flex items-center justify-center rounded-full text-red-500 active:opacity-70">
                                    <i class="fa-solid fa-times"></i>
                                </button>
                            </div>
                        </div>

                        <div class="relative mb-3">
                            <input type="text" id="muscle-input-${index}" placeholder="Группа мышц" value="${esc(exercise.muscleGroup)}" onfocus="showMuscleAutocomplete(${index})" oninput="onMuscleInput(${index}, this.value)" class="w-full p-3 rounded-xl text-sm font-medium">
                            <div id="${muscleDropdownId}" class="autocomplete-dropdown hidden"></div>
                        </div>

                        <div class="relative mb-3">
                            <input type="text" id="exercise-input-${index}" placeholder="Название упражнения" value="${esc(exercise.name)}" onfocus="showExerciseAutocomplete(${index})" oninput="onExerciseNameInput(${index}, this.value)" class="w-full p-3 rounded-xl text-sm font-medium">
                            <div id="${exerciseDropdownId}" class="autocomplete-dropdown hidden"></div>
                        </div>
                        
                        <label class="checkbox-label mb-3 p-3 rounded-xl bg-tgBg">
                            <input type="checkbox" ${isBodyweight ? 'checked' : ''} onchange="updateExercise(${index}, 'exerciseType', this.checked ? 'bodyweight' : 'weighted')">
                            <span class="text-sm font-medium">Собственный вес</span>
                        </label>
                        
                        <div class="flex gap-3">
                            <div class="flex-1">
                                <label class="text-xs text-tgHint mb-1 block">Подходы</label>
                                <div class="flex items-center gap-1">
                                    <button onclick="adjustProgramParam(${index}, 'targetSets', -1)" class="w-10 h-10 rounded-xl bg-tgBg font-bold active:opacity-70 shrink-0">−</button>
                                    <input type="number" id="sets-${index}" inputmode="numeric" value="${exercise.targetSets ?? 3}" onchange="updateExercise(${index}, 'targetSets', parseInt(this.value) || 3)" class="w-full h-10 rounded-xl text-sm text-center font-semibold">
                                    <button onclick="adjustProgramParam(${index}, 'targetSets', 1)" class="w-10 h-10 rounded-xl bg-tgBg font-bold active:opacity-70 shrink-0">+</button>
                                </div>
                            </div>
                            <div class="flex-1">
                                <label class="text-xs text-tgHint mb-1 block">Повторения</label>
                                <div class="flex items-center gap-1">
                                    <button onclick="adjustProgramParam(${index}, 'targetReps', -1)" class="w-10 h-10 rounded-xl bg-tgBg font-bold active:opacity-70 shrink-0">−</button>
                                    <input type="number" id="reps-${index}" inputmode="numeric" value="${exercise.targetReps ?? 10}" onchange="updateExercise(${index}, 'targetReps', parseInt(this.value) || 10)" class="w-full h-10 rounded-xl text-sm text-center font-semibold">
                                    <button onclick="adjustProgramParam(${index}, 'targetReps', 1)" class="w-10 h-10 rounded-xl bg-tgBg font-bold active:opacity-70 shrink-0">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            let supersetBar = '';
            if (activeSsId) {
                const groupExs = exercises.filter(e => e.supersetId === activeSsId);
                const style = getSupersetStyle(activeSsId, allSsIds);
                const exercisesListHTML = groupExs.map(e => `<div class="font-bold text-sm truncate">• ${esc(e.name || 'Без названия')}</div>`).join('');
                
                supersetBar = `
                    <div class="sticky top-0 z-30 mb-4 p-4 rounded-2xl shadow-xl card-enter flex items-center justify-between gap-3" style="${style.styleAttr} border: 2px solid ${style.border}">
                        <div class="min-w-0 flex-1">
                            <div class="text-[10px] font-bold uppercase tracking-wide mb-1" style="color: ${style.text}">Режим суперсета</div>
                            <div class="space-y-0.5">${exercisesListHTML}</div>
                        </div>
                        <button onclick="finishSupersetCreation()" class="px-4 py-3 bg-white text-black font-bold rounded-xl text-sm shrink-0 active:scale-95 shadow">
                            Готово ✓
                        </button>
                    </div>
                `;
            }

            document.getElementById('app-content').innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <input type="text" id="prog-name" placeholder="Название программы" value="${esc(program.name)}" oninput="updateProgramName(this.value)" class="flex-1 p-4 rounded-2xl text-lg font-semibold card-enter mr-2">
                    <button onclick="openMuscleGroupsManager()" title="Управление группами" class="w-14 h-14 bg-tgSecondaryBg rounded-2xl flex items-center justify-center text-tgLink active:opacity-70"><i class="fa-solid fa-tags text-lg"></i></button>
                </div>
                ${supersetBar}
                <div id="exercises-list">${exercisesHTML}</div>
                <button onclick="addExercise()" class="w-full py-4 border-2 border-dashed border-tgHint rounded-2xl text-tgHint mt-2 active:bg-tgSecondaryBg transition-colors card-enter" style="animation-delay: 0.1s">
                    <i class="fa-solid fa-plus mr-2"></i> Добавить упражнение
                </button>
                <button onclick="saveProgram()" class="w-full mt-6 mb-4 bg-tgButton text-white font-semibold py-4 rounded-2xl active:opacity-80 transition-opacity card-enter">
                    <i class="fa-solid fa-check mr-2"></i> Сохранить программу
                </button>
            `;
            clearMainButton();
        }

        function showMuscleAutocomplete(index) {
            const dropdown = document.getElementById(`autocomplete-muscle-${index}`);
            if (!dropdown) return;
            const groups = getMuscleGroups();
            dropdown.innerHTML = groups.map(g => `<div class="autocomplete-item" onclick="selectMuscleItem(${index}, '${esc(g)}')">${esc(g)}</div>`).join('');
            dropdown.classList.remove('hidden');
        }

        function onMuscleInput(index, value) {
            updateExercise(index, 'muscleGroup', value);
            const dropdown = document.getElementById(`autocomplete-muscle-${index}`);
            if (!dropdown) return;
            const groups = getMuscleGroups().filter(g => g.toLowerCase().includes(value.toLowerCase()));
            if (groups.length === 0) { dropdown.classList.add('hidden'); return; }
            dropdown.innerHTML = groups.map(g => `<div class="autocomplete-item" onclick="selectMuscleItem(${index}, '${esc(g)}')">${esc(g)}</div>`).join('');
            dropdown.classList.remove('hidden');
        }

        function selectMuscleItem(index, groupName) {
            updateExercise(index, 'muscleGroup', groupName);
            const inputEl = document.getElementById(`muscle-input-${index}`);
            if (inputEl) inputEl.value = groupName;
            const dropdown = document.getElementById(`autocomplete-muscle-${index}`);
            if (dropdown) dropdown.classList.add('hidden');
        }

        function showExerciseAutocomplete(index) {
            const exercise = state.editingProgram.exercises[index];
            const dropdown = document.getElementById(`autocomplete-exercise-${index}`);
            if (!dropdown) return;
            const allSaved = DataAPI.getUserExercises();
            const currentMuscle = exercise.muscleGroup;
            const filtered = currentMuscle ? allSaved.filter(e => e.muscleGroup === currentMuscle) : allSaved;
            if (filtered.length === 0) { dropdown.classList.add('hidden'); return; }
            dropdown.innerHTML = filtered.map(item => `<div class="autocomplete-item" onclick="selectExerciseItem(${index}, '${esc(item.name)}')">${esc(item.name)} <span class="text-xs text-tgHint float-right">(${esc(item.muscleGroup)})</span></div>`).join('');
            dropdown.classList.remove('hidden');
        }

        function onExerciseNameInput(index, value) {
            updateExercise(index, 'name', value);
            const dropdown = document.getElementById(`autocomplete-exercise-${index}`);
            if (!dropdown) return;
            const allSaved = DataAPI.getUserExercises();
            const currentMuscle = state.editingProgram.exercises[index].muscleGroup;
            const filtered = allSaved.filter(e => (!currentMuscle || e.muscleGroup === currentMuscle) && e.name.toLowerCase().includes(value.toLowerCase()));
            if (filtered.length === 0) { dropdown.classList.add('hidden'); return; }
            dropdown.innerHTML = filtered.map(item => `<div class="autocomplete-item" onclick="selectExerciseItem(${index}, '${esc(item.name)}')">${esc(item.name)} <span class="text-xs text-tgHint float-right">(${esc(item.muscleGroup)})</span></div>`).join('');
            dropdown.classList.remove('hidden');
        }

        function selectExerciseItem(index, name) {
            updateExercise(index, 'name', name);
            const inputEl = document.getElementById(`exercise-input-${index}`);
            if (inputEl) inputEl.value = name;
            const dropdown = document.getElementById(`autocomplete-exercise-${index}`);
            if (dropdown) dropdown.classList.add('hidden');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.relative')) {
                document.querySelectorAll('.autocomplete-dropdown').forEach(el => el.classList.add('hidden'));
            }
        });

        function updateProgramName(value) {
            if (!state.editingProgram) state.editingProgram = { name: '', exercises: [] };
            state.editingProgram.name = value;
        }

        function adjustProgramParam(index, field, delta) {
            const exercise = state.editingProgram.exercises[index];
            const current = exercise[field] ?? (field === 'targetSets' ? 3 : 10);
            const newVal = Math.max(1, current + delta);
            exercise[field] = newVal;
            haptic('light');
            const input = document.getElementById(`${field === 'targetSets' ? 'sets' : 'reps'}-${index}`);
            if (input) input.value = newVal;
        }

        function addExercise() {
            if (!state.editingProgram) state.editingProgram = { name: '', exercises: [] };
            if (!state.editingProgram.exercises) state.editingProgram.exercises = [];
            state.editingProgram.exercises.push({
                id: createId(), name: '', muscleGroup: '', exerciseType: 'weighted', supersetId: null, targetSets: 3, targetReps: 10
            });
            renderProgramEdit();
        }

        function removeExercise(index) {
            const exercises = state.editingProgram.exercises;
            const removed = exercises[index];
            if (removed.supersetId) {
                const ssId = removed.supersetId;
                exercises[index].supersetId = null;
                const remaining = exercises.filter(ex => ex.supersetId === ssId);
                if (remaining.length === 1) remaining[0].supersetId = null;
            }
            exercises.splice(index, 1);
            renderProgramEdit();
        }

        function updateExercise(index, field, value) {
            if (!state.editingProgram) state.editingProgram = { name: '', exercises: [] };
            state.editingProgram.exercises[index][field] = value;
        }

        function toggleSupersetClick(index) {
            const exercises = state.editingProgram.exercises;
            const current = exercises[index];
            if (!state.supersetActiveId) {
                if (!current.supersetId) current.supersetId = createId();
                state.supersetActiveId = current.supersetId;
                haptic('medium');
            } else {
                if (current.supersetId === state.supersetActiveId) {
                    current.supersetId = null;
                    const remaining = exercises.filter(ex => ex.supersetId === state.supersetActiveId);
                    if (remaining.length < 2) { remaining.forEach(ex => ex.supersetId = null); state.supersetActiveId = null; }
                    haptic('light');
                } else {
                    current.supersetId = state.supersetActiveId;
                    haptic('success');
                }
            }
            renderProgramEdit();
        }

        function finishSupersetCreation() {
            state.supersetActiveId = null;
            haptic('success');
            renderProgramEdit();
        }

        function saveProgram() {
            const nameInput = document.getElementById('prog-name');
            const name = nameInput ? nameInput.value.trim() : '';
            if (!name) { showAlert('Введите название программы'); return; }
            if (!state.editingProgram || (state.editingProgram.exercises || []).length === 0) { showAlert('Добавьте хотя бы одно упражнение'); return; }
            for (const exercise of state.editingProgram.exercises) {
                if (!exercise.name || !exercise.name.trim()) { showAlert('Заполните названия всех упражнений'); return; }
                if (!exercise.muscleGroup) { showAlert(`Выберите группу мышц для упражнения «${exercise.name}»`); return; }
            }
            state.editingProgram.name = name;
            const programs = DataAPI.getPrograms();
            const existingIndex = programs.findIndex(program => program.id === state.editingProgram.id);
            if (existingIndex > -1) programs[existingIndex] = state.editingProgram;
            else { state.editingProgram.id = createId(); programs.push(state.editingProgram); }
            DataAPI.savePrograms(programs);
            haptic('success');
            state.editingProgram = null;
            state.supersetActiveId = null;
            openProgramsScreen();
        }

        function deleteProgram(id) {
            showConfirm('Удалить программу?', ok => {
                if (!ok) return;
                DataAPI.savePrograms(DataAPI.getPrograms().filter(program => program.id !== id));
                renderPrograms();
            });
        }

        // ==========================================
        // ВКЛАДКА ТРЕНИРОВКА
        // ==========================================
        function generateSetHTML(exerciseIndex, setIndex, set, exerciseType) {
            const isBodyweight = exerciseType === 'bodyweight';
            const weightHeader = isBodyweight ? 'Доп. вес (кг)' : 'Вес (кг)';
            const isDropSet = set.setType === 'drop';
            
            return `
                <div id="set-row-${exerciseIndex}-${setIndex}" class="bg-tgBg rounded-xl p-3 mb-2 card-enter ${isDropSet ? 'set-drop' : ''}" style="animation-delay: 0.03s">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="text-tgHint text-sm font-medium">Подход ${setIndex + 1}</span>
                            ${isDropSet ? '<span class="drop-badge"><i class="fa-solid fa-fire"></i> ДРОП-СЕТ</span>' : ''}
                        </div>
                        <button onclick="removeSet(${exerciseIndex}, ${setIndex})" aria-label="Удалить подход" class="w-8 h-8 flex items-center justify-center rounded-full text-red-500 active:opacity-70">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>

                    <div class="flex items-center gap-2">
                        <div class="flex-1">
                            <div class="text-[11px] text-tgHint mb-1 font-medium">${weightHeader}</div>
                            <div class="flex items-center bg-tgSecondaryBg rounded-xl p-1" style="border: none !important;">
                                <button onclick="adjustSet(${exerciseIndex}, ${setIndex}, 'weight', -2.5)" class="w-7 h-9 rounded-lg bg-tgBg text-lg flex items-center justify-center active:opacity-70 font-bold shrink-0">−</button>
                                <input type="number" id="set-${exerciseIndex}-${setIndex}-weight" inputmode="decimal" value="${set.weight}" onchange="updateSet(${exerciseIndex}, ${setIndex}, 'weight', parseFloat(this.value) || 0)" class="w-full h-9 text-center bg-transparent text-lg font-semibold min-w-0" style="border: none !important; outline: none !important; box-shadow: none !important;">
                                <button onclick="adjustSet(${exerciseIndex}, ${setIndex}, 'weight', 2.5)" class="w-7 h-9 rounded-lg bg-tgBg text-lg flex items-center justify-center active:opacity-70 font-bold shrink-0">+</button>
                            </div>
                        </div>

                        <div class="flex-1">
                            <div class="text-[11px] text-tgHint mb-1 font-medium">Повторения</div>
                            <div class="flex items-center bg-tgSecondaryBg rounded-xl p-1" style="border: none !important;">
                                <button onclick="adjustSet(${exerciseIndex}, ${setIndex}, 'reps', -1)" class="w-7 h-9 rounded-lg bg-tgBg text-lg flex items-center justify-center active:opacity-70 font-bold shrink-0">−</button>
                                <input type="number" id="set-${exerciseIndex}-${setIndex}-reps" inputmode="numeric" value="${set.reps}" onchange="updateSet(${exerciseIndex}, ${setIndex}, 'reps', parseInt(this.value) || 0)" class="w-full h-9 text-center bg-transparent text-lg font-semibold min-w-0" style="border: none !important; outline: none !important; box-shadow: none !important;">
                                <button onclick="adjustSet(${exerciseIndex}, ${setIndex}, 'reps', 1)" class="w-7 h-9 rounded-lg bg-tgBg text-lg flex items-center justify-center active:opacity-70 font-bold shrink-0">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function generateExerciseCardHTML(exerciseIndex, exercise, allSsIds) {
            const sets = exercise.sets || [];
            const completedSets = sets.filter(s => s.weight > 0 && s.reps > 0).length;
            const targetSets = exercise.targetSets ?? 3;
            const isComplete = completedSets >= targetSets;
            const exerciseType = exercise.exerciseType || 'weighted';

            const setsHTML = sets.map((set, setIndex) => generateSetHTML(exerciseIndex, setIndex, set, exerciseType)).join('');

            return `
                <div id="exercise-card-${exerciseIndex}" class="bg-tgSecondaryBg p-4 rounded-2xl mb-4 card-enter">
                    <div class="flex justify-between items-center mb-3 gap-2">
                        <div class="flex items-center gap-2 flex-1 min-w-0 flex-wrap">
                            <h3 class="font-bold text-sm leading-snug break-words flex-1">${esc(exercise.name)}</h3>
                            ${exerciseType === 'bodyweight' ? '<span class="bodyweight-badge shrink-0">Собственный вес</span>' : ''}
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <span id="badge-${exerciseIndex}" class="text-xs font-medium px-2 py-1 rounded-md ${isComplete ? 'bg-green-500/20 text-green-500' : 'bg-tgBg text-tgHint'}">
                                ${isComplete ? '✓ Готово' : `${completedSets}/${targetSets}`}
                            </span>
                            <button onclick="removeWorkoutExercise(${exerciseIndex})" title="Убрать упражнение" class="w-8 h-8 flex items-center justify-center rounded-full text-red-500 bg-tgBg active:opacity-70">
                                <i class="fa-solid fa-times text-sm"></i>
                            </button>
                        </div>
                    </div>
                    <div id="sets-container-${exerciseIndex}">${setsHTML}</div>
                    
                    <div class="flex gap-2 mt-2">
                        <button id="add-set-btn-${exerciseIndex}" onclick="tryAddSet(${exerciseIndex})" class="flex-1 py-3 bg-tgBg rounded-xl text-tgLink text-sm font-semibold active:opacity-70 transition-opacity">
                            + Подход
                        </button>
                        <button onclick="tryAddDropSet(${exerciseIndex})" class="flex-1 py-3 bg-orange-500/15 rounded-xl text-orange-400 text-sm font-semibold active:opacity-70 transition-opacity">
                            <i class="fa-solid fa-fire mr-1"></i> Дроп-сет
                        </button>
                    </div>
                </div>
            `;
        }

        function updateExerciseCardInDOM(exerciseIndex, exercise) {
            const allSsIds = state.activeWorkout.exercises.map(e => e.supersetId);
            const cardHTML = generateExerciseCardHTML(exerciseIndex, exercise, allSsIds);
            const existingCard = document.getElementById(`exercise-card-${exerciseIndex}`);
            if (existingCard) existingCard.outerHTML = cardHTML;
        }

        function removeWorkoutExercise(exerciseIndex) {
            showConfirm('Убрать это упражнение из текущей тренировки?', ok => {
                if (!ok) return;
                state.activeWorkout.exercises.splice(exerciseIndex, 1);
                saveActiveWorkout();
                haptic('light');
                renderWorkout();
            });
        }

        function addWorkoutExerciseModal() {
            const modal = document.createElement('div');
            modal.id = 'add-workout-exercise-modal';
            modal.className = 'modal-backdrop';
            
            const muscleGroups = getMuscleGroups();
            const allSavedExercises = DataAPI.getUserExercises();
            let selectedMuscle = muscleGroups[0] || 'Грудь';
            let exerciseName = '';
            let exerciseType = 'weighted';
            let targetSets = 3;
            let targetReps = 10;

            const updateSheetContent = () => {
                const sheet = modal.querySelector('.modal-sheet');
                const dropdownId = 'workout-add-autocomplete';
                const muscleDropdownId = 'workout-add-muscle-autocomplete';

                sheet.innerHTML = `
                    <div class="w-10 h-1 bg-tgHint/40 rounded-full mx-auto mb-5"></div>
                    <h2 class="text-xl font-bold mb-4">Добавить упражнение</h2>

                    <div class="relative mb-3">
                        <label class="text-xs text-tgHint mb-1 block">Группа мышц</label>
                        <input type="text" id="modal-muscle-input" placeholder="Группа мышц" value="${esc(selectedMuscle)}" onfocus="showWorkoutMuscleAutocomplete()" oninput="onWorkoutMuscleInput(this.value)" class="w-full p-3 rounded-xl text-sm font-medium">
                        <div id="${muscleDropdownId}" class="autocomplete-dropdown hidden"></div>
                    </div>

                    <div class="relative mb-3">
                        <label class="text-xs text-tgHint mb-1 block">Название упражнения</label>
                        <input type="text" id="modal-exercise-input" placeholder="Название упражнения" value="${esc(exerciseName)}" onfocus="showWorkoutExerciseAutocomplete()" oninput="onWorkoutExerciseInput(this.value)" class="w-full p-3 rounded-xl text-sm font-medium">
                        <div id="${dropdownId}" class="autocomplete-dropdown hidden"></div>
                    </div>

                    <label class="checkbox-label mb-3 p-3 rounded-xl bg-tgBg">
                        <input type="checkbox" id="modal-bodyweight-checkbox" ${exerciseType === 'bodyweight' ? 'checked' : ''}>
                        <span class="text-sm font-medium">Собственный вес</span>
                    </label>

                    <div class="flex gap-3 mb-5">
                        <div class="flex-1">
                            <label class="text-xs text-tgHint mb-1 block">Подходы</label>
                            <div class="flex items-center gap-1">
                                <button type="button" onclick="adjustModalParam('targetSets', -1)" class="w-10 h-10 rounded-xl bg-tgBg font-bold active:opacity-70 shrink-0">−</button>
                                <input type="number" id="modal-sets-input" inputmode="numeric" value="${targetSets}" class="w-full h-10 rounded-xl text-sm text-center font-semibold">
                                <button type="button" onclick="adjustModalParam('targetSets', 1)" class="w-10 h-10 rounded-xl bg-tgBg font-bold active:opacity-70 shrink-0">+</button>
                            </div>
                        </div>
                        <div class="flex-1">
                            <label class="text-xs text-tgHint mb-1 block">Повторения</label>
                            <div class="flex items-center gap-1">
                                <button type="button" onclick="adjustModalParam('targetReps', -1)" class="w-10 h-10 rounded-xl bg-tgBg font-bold active:opacity-70 shrink-0">−</button>
                                <input type="number" id="modal-reps-input" inputmode="numeric" value="${targetReps}" class="w-full h-10 rounded-xl text-sm text-center font-semibold">
                                <button type="button" onclick="adjustModalParam('targetReps', 1)" class="w-10 h-10 rounded-xl bg-tgBg font-bold active:opacity-70 shrink-0">+</button>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-2">
                        <button id="modal-cancel-btn" class="flex-1 py-3 bg-tgBg rounded-2xl font-semibold active:opacity-80">Отмена</button>
                        <button id="modal-add-btn" class="flex-1 py-3 bg-tgButton text-white rounded-2xl font-semibold active:opacity-80">Добавить</button>
                    </div>
                `;

                sheet.querySelector('#modal-bodyweight-checkbox').onchange = (e) => { exerciseType = e.target.checked ? 'bodyweight' : 'weighted'; };
                sheet.querySelector('#modal-sets-input').onchange = (e) => { targetSets = Math.max(1, parseInt(e.target.value) || 3); };
                sheet.querySelector('#modal-reps-input').onchange = (e) => { targetReps = Math.max(1, parseInt(e.target.value) || 10); };

                window.adjustModalParam = (field, delta) => {
                    if (field === 'targetSets') {
                        targetSets = Math.max(1, targetSets + delta);
                        const el = document.getElementById('modal-sets-input');
                        if (el) el.value = targetSets;
                    } else if (field === 'targetReps') {
                        targetReps = Math.max(1, targetReps + delta);
                        const el = document.getElementById('modal-reps-input');
                        if (el) el.value = targetReps;
                    }
                    haptic('light');
                };

                window.showWorkoutMuscleAutocomplete = () => {
                    const dropdown = document.getElementById(muscleDropdownId);
                    if (!dropdown) return;
                    dropdown.innerHTML = muscleGroups.map(g => `<div class="autocomplete-item" onclick="selectWorkoutMuscleItem('${esc(g)}')">${esc(g)}</div>`).join('');
                    dropdown.classList.remove('hidden');
                };

                window.onWorkoutMuscleInput = (val) => {
                    selectedMuscle = val;
                    const dropdown = document.getElementById(muscleDropdownId);
                    if (!dropdown) return;
                    const matchedGroups = muscleGroups.filter(g => g.toLowerCase().includes(val.toLowerCase()));
                    if (matchedGroups.length === 0) { dropdown.classList.add('hidden'); return; }
                    dropdown.innerHTML = matchedGroups.map(g => `<div class="autocomplete-item" onclick="selectWorkoutMuscleItem('${esc(g)}')">${esc(g)}</div>`).join('');
                    dropdown.classList.remove('hidden');
                };

                window.selectWorkoutMuscleItem = (gName) => {
                    selectedMuscle = gName;
                    const inputEl = document.getElementById('modal-muscle-input');
                    if (inputEl) inputEl.value = gName;
                    const dropdown = document.getElementById(muscleDropdownId);
                    if (dropdown) dropdown.classList.add('hidden');
                };

                window.showWorkoutExerciseAutocomplete = () => {
                    const dropdown = document.getElementById(dropdownId);
                    if (!dropdown) return;
                    const filtered = selectedMuscle ? allSavedExercises.filter(e => e.muscleGroup === selectedMuscle) : allSavedExercises;
                    if (filtered.length === 0) { dropdown.classList.add('hidden'); return; }
                    dropdown.innerHTML = filtered.map(item => `<div class="autocomplete-item" onclick="selectWorkoutExerciseItem('${esc(item.name)}')">${esc(item.name)} <span class="text-xs text-tgHint float-right">(${esc(item.muscleGroup)})</span></div>`).join('');
                    dropdown.classList.remove('hidden');
                };

                window.onWorkoutExerciseInput = (val) => {
                    exerciseName = val;
                    const dropdown = document.getElementById(dropdownId);
                    if (!dropdown) return;
                    const filtered = allSavedExercises.filter(e => (!selectedMuscle || e.muscleGroup === selectedMuscle) && e.name.toLowerCase().includes(val.toLowerCase()));
                    if (filtered.length === 0) { dropdown.classList.add('hidden'); return; }
                    dropdown.innerHTML = filtered.map(item => `<div class="autocomplete-item" onclick="selectWorkoutExerciseItem('${esc(item.name)}')">${esc(item.name)} <span class="text-xs text-tgHint float-right">(${esc(item.muscleGroup)})</span></div>`).join('');
                    dropdown.classList.remove('hidden');
                };

                window.selectWorkoutExerciseItem = (name) => {
                    exerciseName = name;
                    const inputEl = document.getElementById('modal-exercise-input');
                    if (inputEl) inputEl.value = name;
                    const dropdown = document.getElementById(dropdownId);
                    if (dropdown) dropdown.classList.add('hidden');
                    
                    const matched = allSavedExercises.find(ex => ex.name.toLowerCase() === name.toLowerCase());
                    if (matched && matched.muscleGroup) {
                        selectedMuscle = matched.muscleGroup;
                        const mInput = document.getElementById('modal-muscle-input');
                        if (mInput) mInput.value = selectedMuscle;
                    }
                };

                sheet.querySelector('#modal-cancel-btn').onclick = () => modal.remove();
                sheet.querySelector('#modal-add-btn').onclick = () => {
                    const name = exerciseName.trim();
                    if (!name) { showAlert('Введите название упражнения'); return; }

                    if (!state.activeWorkout.exercises) state.activeWorkout.exercises = [];
                    state.activeWorkout.exercises.push({
                        name: name, muscleGroup: selectedMuscle, exerciseType: exerciseType, supersetId: null, targetSets: targetSets, targetReps: targetReps,
                        sets: [{ weight: 0, reps: targetReps, setType: 'regular' }]
                    });

                    saveActiveWorkout();
                    modal.remove();
                    haptic('success');
                    renderWorkout();
                };
            };

            const sheet = document.createElement('div');
            sheet.className = 'modal-sheet';
            modal.appendChild(sheet);
            document.body.appendChild(modal);
            updateSheetContent();

            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.remove();
            });
        }

        function tryAddSet(exerciseIndex) {
            const exercise = state.activeWorkout.exercises[exerciseIndex];
            const sets = exercise.sets || [];
            if (sets.length > 0) {
                const lastSet = sets[sets.length - 1];
                if (!lastSet.weight || Number(lastSet.weight) <= 0 || !lastSet.reps || Number(lastSet.reps) <= 0) {
                    showAlert('Заполните вес и повторения в предыдущем подходе перед добавлением нового.');
                    return;
                }
            }
            addSet(exerciseIndex);
        }

        function tryAddDropSet(exerciseIndex) {
            const exercise = state.activeWorkout.exercises[exerciseIndex];
            const sets = exercise.sets || [];
            if (sets.length === 0) {
                showAlert('Сначала добавьте обычный подход');
                return;
            }
            const lastSet = sets[sets.length - 1];
            if (!lastSet.weight || Number(lastSet.weight) <= 0 || !lastSet.reps || Number(lastSet.reps) <= 0) {
                showAlert('Заполните вес и повторения в предыдущем подходе.');
                return;
            }
            addDropSet(exerciseIndex);
        }

        function renderWorkout() {
            const workout = state.activeWorkout;
            if (!workout) {
                openProgramsScreen();
                return;
            }

            const exercises = workout.exercises || [];
            const allSsIds = exercises.map(e => e.supersetId);
            const groups = [];
            const processed = new Set();
            
            exercises.forEach((exercise, idx) => {
                if (processed.has(idx)) return;
                
                if (exercise.supersetId) {
                    const group = exercises
                        .map((e, i) => ({ ...e, originalIndex: i }))
                        .filter(e => e.supersetId === exercise.supersetId);
                    group.forEach(e => processed.add(e.originalIndex));
                    groups.push({ type: 'superset', exercises: group });
                } else {
                    processed.add(idx);
                    groups.push({ type: 'single', exercise: exercise, originalIndex: idx });
                }
            });

            let groupsHTML = groups.map((group, groupIndex) => {
                if (group.type === 'superset') {
                    const style = getSupersetStyle(group.exercises[0].supersetId, allSsIds);
                    const cardsHTML = group.exercises.map(ex => 
                        generateExerciseCardHTML(ex.originalIndex, ex, allSsIds)
                    ).join('');
                    
                    return `
                        <div class="rounded-2xl p-3 mb-4 card-enter shadow-md" style="animation-delay: ${groupIndex * 0.1}s; ${style.styleAttr}">
                            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-[11px] font-bold mb-3 uppercase tracking-wide shadow-sm" style="${style.badgeStyle}"><i class="fa-solid fa-bolt"></i> СУПЕРСЕТ — выполнять без отдыха</div>
                            ${cardsHTML}
                        </div>
                    `;
                } else {
                    return generateExerciseCardHTML(group.originalIndex, group.exercise, allSsIds);
                }
            }).join('');

            document.getElementById('app-content').innerHTML = `
                <div class="sticky top-0 z-10 bg-tgBg/95 backdrop-blur-md py-4 mb-4 border-b border-tgSecondaryBg card-enter">
                    <div class="text-4xl font-mono font-bold text-tgLink tracking-wider text-center" id="workout-timer">00:00:00</div>
                    <div class="text-tgHint text-xs mt-1 uppercase tracking-wide text-center">Время тренировки</div>
                </div>
                ${groupsHTML}
                
                <button onclick="addWorkoutExerciseModal()" class="w-full py-4 border-2 border-dashed border-tgHint rounded-2xl text-tgHint mt-2 mb-4 active:bg-tgSecondaryBg transition-colors card-enter flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Добавить упражнение
                </button>

                <button onclick="promptWorkoutExit('programs')" class="w-full mt-2 mb-4 bg-red-600 text-white font-semibold py-4 rounded-2xl active:opacity-80 transition-opacity card-enter">
                    <i class="fa-solid fa-stop mr-2"></i> Завершить тренировку
                </button>
            `;

            startTimer();
            clearMainButton();
        }

        function adjustSet(exerciseIndex, setIndex, field, delta) {
            const exercise = state.activeWorkout.exercises[exerciseIndex];
            const current = exercise.sets[setIndex][field] || 0;
            const newValue = field === 'weight' ? Math.max(0, parseFloat((current + delta).toFixed(1))) : Math.max(0, current + delta);

            updateSet(exerciseIndex, setIndex, field, newValue);
            haptic('light');

            const inputElement = document.getElementById(`set-${exerciseIndex}-${setIndex}-${field}`);
            if (inputElement) inputElement.value = newValue;

            const completedSets = exercise.sets.filter(s => s.weight > 0 && s.reps > 0).length;
            const targetSets = exercise.targetSets ?? 3;
            const isComplete = completedSets >= targetSets;
            
            const badge = document.getElementById(`badge-${exerciseIndex}`);
            if (badge) {
                badge.className = `text-xs font-medium px-2 py-1 rounded-md shrink-0 ${isComplete ? 'bg-green-500/20 text-green-500' : 'bg-tgBg text-tgHint'}`;
                badge.innerText = isComplete ? '✓ Готово' : `${completedSets}/${targetSets}`;
            }
        }

        function addSet(exerciseIndex) {
            const exercise = state.activeWorkout.exercises[exerciseIndex];
            const sets = exercise.sets;
            let defaultWeight = 0;
            let defaultReps = exercise.targetReps ?? 10;

            if (sets.length > 0) {
                const lastSet = sets[sets.length - 1];
                defaultWeight = lastSet.weight;
                defaultReps = lastSet.reps;
            }

            sets.push({ weight: defaultWeight, reps: defaultReps, setType: 'regular' });
            saveActiveWorkout();
            haptic('light');
            updateExerciseCardInDOM(exerciseIndex, exercise);
        }

        function addDropSet(exerciseIndex) {
            const exercise = state.activeWorkout.exercises[exerciseIndex];
            const sets = exercise.sets;
            
            const lastSet = sets[sets.length - 1];
            const dropWeight = Math.max(0, Math.round((lastSet.weight * 0.75) / 2.5) * 2.5);
            
            sets.push({
                weight: dropWeight,
                reps: lastSet.reps,
                setType: 'drop'
            });
            
            saveActiveWorkout();
            haptic('medium');
            updateExerciseCardInDOM(exerciseIndex, exercise);
        }

        function removeSet(exerciseIndex, setIndex) {
            const sets = state.activeWorkout.exercises[exerciseIndex].sets;
            if (sets.length <= 1) {
                sets[0] = { weight: 0, reps: 10, setType: 'regular' };
            } else {
                sets.splice(setIndex, 1);
            }
            saveActiveWorkout();
            haptic('light');
            updateExerciseCardInDOM(exerciseIndex, state.activeWorkout.exercises[exerciseIndex]);
        }

        function updateSet(exerciseIndex, setIndex, field, value) {
            state.activeWorkout.exercises[exerciseIndex].sets[setIndex][field] = value;
            saveActiveWorkout();
        }

        function startWorkout(programId) {
            const program = DataAPI.getProgramById(programId);
            if (!program || !(program.exercises || []).length) {
                showAlert('В программе нет упражнений');
                return;
            }
            state.activeWorkout = {
                programId: program.id,
                programName: program.name,
                startTime: Date.now(),
                exercises: program.exercises.map(exercise => ({
                    name: exercise.name,
                    muscleGroup: exercise.muscleGroup,
                    exerciseType: exercise.exerciseType || 'weighted',
                    supersetId: exercise.supersetId || null,
                    targetSets: exercise.targetSets,
                    targetReps: exercise.targetReps,
                    sets: [{ weight: 0, reps: exercise.targetReps || 10, setType: 'regular' }]
                }))
            };
            saveActiveWorkout();
            navigate('workout');
        }

        function startTimer() {
            stopWorkoutTimer();
            const update = () => {
                if (!state.activeWorkout) return;
                const elapsed = Date.now() - state.activeWorkout.startTime;
                const hours = Math.floor(elapsed / 3600000).toString().padStart(2, '0');
                const minutes = Math.floor((elapsed % 3600000) / 60000).toString().padStart(2, '0');
                const seconds = Math.floor((elapsed % 60000) / 1000).toString().padStart(2, '0');
                const timerElement = document.getElementById('workout-timer');
                if (timerElement) timerElement.innerText = `${hours}:${minutes}:${seconds}`;
            };
            update();
            state.workoutTimer = setInterval(update, 1000);
        }

        function stopWorkoutTimer() {
            if (state.workoutTimer) {
                clearInterval(state.workoutTimer);
                state.workoutTimer = null;
            }
        }

        function clearWorkoutState() {
            stopWorkoutTimer();
            state.activeWorkout = null;
            saveActiveWorkout();
            clearMainButton();
        }

        function triggerImportFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (imported.programs && imported.history) {
                            DataAPI.savePrograms(imported.programs);
                            DataAPI.saveHistory(imported.history);
                            if (imported.muscleGroups) saveMuscleGroups(imported.muscleGroups);
                            haptic('success');
                            showAlert('Данные успешно восстановлены!');
                            renderHistory();
                        } else {
                            showAlert('Неверный формат файла бэкапа');
                        }
                    } catch (err) {
                        showAlert('Ошибка чтения файла');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        async function exportData() {
            try {
                const data = {
                    programs: DataAPI.getPrograms(),
                    history: DataAPI.getHistory(),
                    muscleGroups: getMuscleGroups(),
                    exportDate: new Date().toISOString()
                };
                const jsonString = JSON.stringify(data, null, 2);
                const blob = new Blob([jsonString], { type: 'application/json' });
                const fileName = `fitnary_backup_${new Date().toISOString().slice(0, 10)}.json`;
                const file = new File([blob], fileName, { type: 'application/json' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file] });
                    haptic('success');
                    return;
                }

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                haptic('success');

            } catch (e) {
                if (e.name !== 'AbortError') {
                    console.error('Export error:', e);
                    showAlert('Не удалось экспортировать данные.');
                }
            }
        }

                localStorage.removeItem(DataAPI._key('programs'));

                state.activeWorkout = null;
                haptic('warning');
                navigateToTab('programs');

        }

        function renderHistoryDetail(entryId) {
            const entry = DataAPI.getHistoryEntryById(entryId);
            if (!entry) {
                document.getElementById('app-content').innerHTML = '<p class="text-center text-tgHint mt-10">Запись не найдена</p>';
                return;
            }
            const date = new Date(entry.date).toLocaleString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            const durationMin = Math.round(entry.duration / 60);

            let totalTonnage = 0;
            (entry.exercises || []).forEach(ex => {
                (ex.sets || []).forEach(set => {
                    totalTonnage += (Number(set.weight) || 0) * (Number(set.reps) || 0);
                });
            });

            const exercises = entry.exercises || [];
            const allSsIds = exercises.map(e => e.supersetId);
            const groups = [];
            const processed = new Set();
            
            exercises.forEach((exercise, idx) => {
                if (processed.has(idx)) return;
                
                if (exercise.supersetId) {
                    const group = exercises
                        .map((e, i) => ({ ...e, originalIndex: i }))
                        .filter(e => e.supersetId === exercise.supersetId);
                    group.forEach(e => processed.add(e.originalIndex));
                    groups.push({ type: 'superset', exercises: group });
                } else {
                    processed.add(idx);
                    groups.push({ type: 'single', exercise: exercise, originalIndex: idx });
                }
            });

            const renderSingleExerciseDetail = (exercise) => {
                const isBodyweight = exercise.exerciseType === 'bodyweight';
                let setsHTML = (exercise.sets || []).map((set, setIndex) => {

                return `

                        <div class="flex items-center gap-2 mb-2 flex-wrap">

                    return renderSingleExerciseDetail(group.exercise);

            }).join('');

            document.getElementById('app-content').innerHTML = `
                <div class="text-center mb-6 card-enter">
                    <h2 class="text-xl font-bold">${esc(entry.programName)}</h2>
                    <p class="text-tgHint text-sm mt-1">${date}</p>
                    <div class="flex justify-center gap-6 mt-3 text-sm text-tgHint bg-tgSecondaryBg py-2.5 px-4 rounded-2xl inline-flex">
                        <span><i class="fa-regular fa-clock mr-1"></i> ${durationMin} мин</span>
                        <span><i class="fa-solid fa-dumbbell mr-1"></i> ${totalTonnage.toLocaleString('ru-RU')} кг</span>

            modal.innerHTML = `
                <div class="modal-sheet" role="dialog" aria-modal="true">
                    <div class="w-10 h-1 bg-tgHint/40 rounded-full mx-auto mb-5"></div>
                    <h2 class="text-xl font-bold text-center mb-2">Завершить тренировку?</h2>
                    <p class="text-tgHint text-sm text-center mb-5">Что сделать с текущей тренировкой?</p>
                    <div class="space-y-3">
                        <button id="workout-save-btn" class="w-full py-4 rounded-2xl bg-tgButton text-white font-semibold active:opacity-80 transition-opacity">
                            <i class="fa-solid fa-check mr-2"></i> Завершить и сохранить
                        </button>
                        <button id="workout-discard-btn" class="w-full py-4 rounded-2xl bg-red-500/15 text-red-500 font-semibold active:opacity-80 transition-opacity">
                            <i class="fa-solid fa-trash mr-2"></i> Не сохранять
                        </button>
                        <button id="workout-cancel-btn" class="w-full py-4 rounded-2xl bg-tgBg text-tgText font-semibold active:opacity-80 transition-opacity">
                            Отмена
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const closeDialog = () => {
                workoutDialogOpen = false;
                modal.remove();
            };

            document.getElementById('workout-cancel-btn').onclick = () => { closeDialog(); haptic('light'); };
            document.getElementById('workout-save-btn').onclick = () => { closeDialog(); saveWorkoutAndOpenPrograms(); };
            document.getElementById('workout-discard-btn').onclick = () => { closeDialog(); discardWorkoutAndOpenPrograms(); };
            modal.addEventListener('click', event => { if (event.target === modal) closeDialog(); });
        }

        function saveWorkoutAndOpenPrograms() {
            try {
                const workout = state.activeWorkout;
                if (workout) {
                    const history = DataAPI.getHistory();
                    history.push({
                        id: createId(),
                        date: new Date(workout.startTime).toISOString(),
                        duration: Math.max(0, Math.round((Date.now() - workout.startTime) / 1000)),
                        programName: workout.programName,
                        exercises: workout.exercises.map(exercise => ({
                            name: exercise.name,
                            muscleGroup: exercise.muscleGroup || '',
                            exerciseType: exercise.exerciseType || 'weighted',
                            supersetId: exercise.supersetId || null,
                            targetSets: exercise.targetSets ?? 3,
                            targetReps: exercise.targetReps ?? 10,
                            sets: (exercise.sets || []).map(set => ({
                                weight: Number(set.weight) || 0,
                                reps: Number(set.reps) || 0,
                                setType: set.setType || 'regular'
                            }))
                        }))
                    });
                    DataAPI.saveHistory(history);
                }
                clearWorkoutState();
                haptic('success');
            } catch (error) {
                console.error('Save workout error:', error);
                clearWorkoutState();
            }
            openProgramsScreen();
        }

        function discardWorkoutAndOpenPrograms() {
            clearWorkoutState();
            haptic('light');
            openProgramsScreen();
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const bottomNav = document.getElementById('bottom-nav');
                if (!bottomNav) return;
                const isKeyboardOpen = window.visualViewport.height < window.innerHeight - 150;
                if (isKeyboardOpen) {
                    bottomNav.classList.add('keyboard-hidden');
                } else {
                    bottomNav.classList.remove('keyboard-hidden');
                }
            });
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && state.currentScreen === 'workout' && state.activeWorkout) {
                startTimer();
            }
        });

        if (restoreActiveWorkout()) {
            navigate('workout');
        } else {
            navigateToTab('programs');
        }
    </script>
</body>
</html>
