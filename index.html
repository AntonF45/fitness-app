<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fitnary</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
tailwind.config = { darkMode: 'class', theme: { extend: { colors: { tgBg: 'var(--tg-theme-bg-color, #1c1c1e)', tgText: 'var(--tg-theme-text-color, #ffffff)', tgHint: 'var(--tg-theme-hint-color, #8e8e93)', tgLink: 'var(--tg-theme-link-color, #3b82f6)', tgButton: 'var(--tg-theme-button-color, #3b82f6)', tgSecondaryBg: 'var(--tg-theme-secondary-bg-color, #2c2c2e)' } } } };
</script>
<script>
/* Диагностика: если основной скрипт не выполнился (файл скопирован не целиком),
   покажем понятное сообщение вместо пустого экрана */
setTimeout(function () {
    var m = document.getElementById('app-content');
    if (m && !m.innerHTML.trim()) {
        m.innerHTML = '<div style="padding:16px;color:#f87171;font-size:14px;line-height:1.5">Основной скрипт не выполнился до конца.<br>Проверьте, что файл скопирован целиком (заканчивается на &lt;/html&gt;).<br>Откройте консоль браузера (F12) для деталей ошибки.</div>';
    }
}, 3000);
</script>
<style>
:root { --bottom-nav-height: 72px; --safe-bottom: env(safe-area-inset-bottom, 0px); --card-bg: rgba(59, 130, 246, 0.04); --card-border: rgba(59, 130, 246, 0.12); }
body { background-color: var(--tg-theme-bg-color, #1c1c1e); color: var(--tg-theme-text-color, #ffffff); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; padding-bottom: calc(var(--bottom-nav-height) + var(--safe-bottom) + 16px); }
input, select { background-color: var(--tg-theme-secondary-bg-color, #2c2c2e); color: var(--tg-theme-text-color, #ffffff); border: 1px solid rgba(142, 142, 147, 0.3); border-radius: 12px; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }
.scroll-container { scrollbar-width: none; -ms-overflow-style: none; scroll-padding-left: 16px; scroll-padding-right: 16px; }
.scroll-container::-webkit-scrollbar { display: none; }
.snap-x { scroll-snap-type: x mandatory; }
.snap-center { scroll-snap-align: center; }
.stat-chip { background: var(--card-bg); border: 1px solid var(--card-border); transition: all 0.2s ease; min-width: 0; max-width: 180px; white-space: normal; text-align: left; line-height: 1.25; word-break: break-word; }
.stat-chip:active { transform: scale(0.96); }
.stat-chip.active { background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.4); color: #ffffff; }
.stat-chip.inactive { color: var(--tg-theme-hint-color, #8e8e93); }
.card-enter { animation: cardIn 0.2s ease-out both; }
@keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.chart-card { background: var(--card-bg); border: 1px solid var(--card-border); }
.chart-container-fixed { height: 260px; position: relative; overflow: hidden; }
.chart-wrapper-fixed { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }

/* ШАПКА СТАТИСТИКИ: fallback ПЕРВЫМ, color-mix ВТОРЫМ (иначе прозрачность не работает) */
.stats-header {
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid rgba(142, 142, 147, 0.15);
    margin-left: -16px;
    margin-right: -16px;
    padding: 12px 16px 16px;
}
.stats-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.3px;
    line-height: 1.2;
    text-align: center;
    color: var(--tg-theme-hint-color, #8e8e93);
}
.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.summary-cell { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 10px 8px; text-align: center; min-width: 0; }
.summary-value { font-size: 18px; font-weight: 700; line-height: 1.2; }
.summary-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--tg-theme-hint-color, #8e8e93); margin-top: 2px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.chart-top-bar { position: relative; height: 0; overflow: hidden; transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
.chart-top-bar.expanded { height: 52px; margin-top: 8px; }
.chart-top-slider { display: flex; width: 200%; height: 100%; transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
.chart-top-slider.show-filter { transform: translateX(-50%); }
.chart-top-slider > div { width: 50%; height: 100%; flex-shrink: 0; }

.filter-toggle-btn { width: 36px; height: 36px; border-radius: 10px; background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.25); display: flex; align-items: center; justify-content: center; color: var(--tg-theme-link-color, #3b82f6); transition: all 0.2s ease; flex-shrink: 0; }
.filter-toggle-btn:active { transform: scale(0.92); background: rgba(59, 130, 246, 0.2); }
.filter-toggle-btn.active { background: rgba(59, 130, 246, 0.25); }
.period-filter {
    display: flex;
    gap: 6px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 4px;
    border-radius: 12px;
}
.period-btn {
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--tg-theme-hint-color, #8e8e93);
    transition: all 0.2s ease;
    white-space: nowrap;
}
.period-btn.active {
    background: rgba(59, 130, 246, 0.15);
    border: 1px solid rgba(59, 130, 246, 0.4);
    color: #ffffff;
}
.period-btn:active { transform: scale(0.95); }

.metric-switcher { display: flex; gap: 4px; background: var(--card-bg); border: 1px solid var(--card-border); padding: 4px; border-radius: 12px; margin-bottom: 12px; }
.metric-btn { flex: 1; padding: 8px 4px; border-radius: 8px; font-size: 12px; font-weight: 600; text-align: center; color: var(--tg-theme-hint-color, #8e8e93); transition: all 0.2s ease; }
.metric-btn.active { background: rgba(59, 130, 246, 0.15); color: #ffffff; border: 1px solid rgba(59, 130, 246, 0.4); }
.metric-btn:active { transform: scale(0.96); }

.empty-state-block { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 24px 16px; text-align: center; color: var(--tg-theme-hint-color, #8e8e93); }
.empty-state-block i { font-size: 24px; margin-bottom: 8px; opacity: 0.6; }
.empty-state-block .title { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--tg-theme-text-color, #fff); }
.empty-state-block .desc { font-size: 11px; line-height: 1.4; }
.metric-note { font-size: 10px; color: var(--tg-theme-hint-color, #8e8e93); margin-top: 4px; font-style: italic; }
.estimated-badge { display: inline-block; font-size: 9px; padding: 1px 6px; background: rgba(142, 142, 147, 0.15); color: var(--tg-theme-hint-color, #8e8e93); border-radius: 6px; margin-left: 4px; font-weight: 500; letter-spacing: 0.3px; vertical-align: middle; }
.achievement-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; transition: all 0.2s ease; }
.achievement-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.achievement-icon.gold { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
.achievement-icon.blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
.achievement-icon.green { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
.achievement-icon.purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
.set-drop { border-left: 3px solid #f97316; background: linear-gradient(90deg, rgba(249, 115, 22, 0.08), transparent); }
.bodyweight-badge { display: inline-flex; align-items: center; background: rgba(34, 197, 94, 0.15); color: #4ade80; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; }
.drop-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(249, 115, 22, 0.2); color: #fb923c; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
.checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.checkbox-label input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: #4ade80; }
.keyboard-hidden { display: none !important; }
.modal-backdrop { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.65); padding: 16px; }
.modal-sheet { width: 100%; max-width: 480px; background: var(--tg-theme-secondary-bg-color, #2c2c2e); color: var(--tg-theme-text-color, #ffffff); border-radius: 24px; padding: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); animation: modalIn 0.2s ease-out; }
@keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
/* Автоподбор упражнений (как в Google-поиске) */
.ac-wrapper { position: relative; }
.autocomplete-dropdown {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 50; margin-top: 4px;
    background: var(--tg-theme-secondary-bg-color, #2c2c2e);
    border: 1px solid rgba(142, 142, 147, 0.3);
    border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    max-height: 200px; overflow-y: auto;
}
.autocomplete-item { padding: 12px 16px; font-size: 14px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.15s; }
.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item:hover, .autocomplete-item:active { background: rgba(255,255,255,0.08); }
.autocomplete-item .ac-group { font-size: 10px; color: var(--tg-theme-hint-color, #8e8e93); margin-top: 2px; }
/* ЛИПКИЕ КНОПКИ ВНИЗУ ЭКРАНА (над нижней навигацией) */
.sticky-bottom-action {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(var(--bottom-nav-height) + var(--safe-bottom) + 12px);
    z-index: 15;
    background: color-mix(in srgb, var(--tg-theme-bg-color, #1c1c1e) 85%, transparent);
    background: rgba(28, 28, 30, 0.85); /* fallback */
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    padding: 10px;
    border-radius: 20px;
    border: 1px solid rgba(142, 142, 147, 0.15);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
}
</style>
</head>
<body class="min-h-screen">
<main id="app-content" class="px-4 pt-4"></main>
<nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-tgBg border-t border-tgSecondaryBg flex justify-around z-20 transition-all duration-200" style="padding-bottom: max(12px, var(--safe-bottom));">
<button data-action="switch-tab" data-payload="stats" id="tab-stats" role="tab" aria-selected="false" class="flex flex-col items-center justify-center min-h-[56px] min-w-[64px] text-tgHint"><i class="fa-solid fa-chart-line text-xl mb-1"></i><span class="text-xs font-medium">Статистика</span></button>
<button data-action="switch-tab" data-payload="programs" id="tab-programs" role="tab" aria-selected="true" class="flex flex-col items-center justify-center min-h-[56px] min-w-[64px] text-tgLink"><i class="fa-solid fa-list-check text-xl mb-1"></i><span class="text-xs font-medium">Программы</span></button>
<button data-action="switch-tab" data-payload="history" id="tab-history" role="tab" aria-selected="false" class="flex flex-col items-center justify-center min-h-[56px] min-w-[64px] text-tgHint"><i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i><span class="text-xs font-medium">История</span></button>
</nav>
<script>
// === БЕЗОПАСНОСТЬ ===
function escHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;').replaceAll('`', '&#96;');
}
function escAttr(value) { return escHtml(value); }
function esc(str) { return escHtml(str); }
function createId() { return typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2); }

const MONTHS_RU = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const WEEKDAYS_RU = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const DEFAULT_MUSCLE_GROUPS = ['Грудь','Спина','Ноги','Плечи','Руки'];

// === ВАЛИДАЦИЯ ===
const WEIGHT_MIN = 0, WEIGHT_MAX = 1000, REPS_MIN = 0, REPS_MAX = 100;
function parseWeight(value) { if (value === '' || value === null || value === undefined) return 0; const n = Number(value); if (!isFinite(n) || isNaN(n)) return null; if (n < WEIGHT_MIN || n > WEIGHT_MAX) return null; return Math.round(n * 10) / 10; }
function parseReps(value) { if (value === '' || value === null || value === undefined) return 0; const n = parseInt(value, 10); if (isNaN(n) || !isFinite(n)) return null; if (n < REPS_MIN || n > REPS_MAX) return null; return n; }
function adjustWeight(current, delta) { const base = Number(current) || 0; return Math.max(WEIGHT_MIN, Math.min(WEIGHT_MAX, Math.round((base + delta) * 10) / 10)); }
function adjustReps(current, delta) { const base = parseInt(current, 10) || 0; return Math.max(REPS_MIN, Math.min(REPS_MAX, base + delta)); }

const tg = window.Telegram.WebApp;
try { tg.ready(); tg.expand(); } catch (e) { console.warn('Telegram init error:', e); }
const USER_ID = tg.initDataUnsafe?.user?.id || 'local_test_user_' + Math.random().toString(36).substr(2, 9);

function getMuscleGroups() { try { const saved = localStorage.getItem('twa_fitness_muscle_groups_' + USER_ID); return saved ? JSON.parse(saved) : [...DEFAULT_MUSCLE_GROUPS]; } catch (e) { return [...DEFAULT_MUSCLE_GROUPS]; } }
function saveMuscleGroups(groups) { try { localStorage.setItem('twa_fitness_muscle_groups_' + USER_ID, JSON.stringify(groups)); } catch (e) {} }
function haptic(type) { try { if (type === 'success' || type === 'error' || type === 'warning') tg.HapticFeedback?.notificationOccurred(type); else tg.HapticFeedback?.impactOccurred(type || 'light'); } catch (e) {} }
function showAlert(message) { try { tg.showAlert(message); } catch (e) { alert(message); } }
function showConfirm(message, callback) { try { tg.showConfirm(message, callback); } catch (e) { callback(confirm(message)); } }
try { tg.BackButton.onClick(function () { navigateBack(); }); } catch (e) {}
function updateBackButton(isSubScreen) { try { if (isSubScreen) tg.BackButton.show(); else tg.BackButton.hide(); } catch (e) {} }
function clearMainButton() { try { tg.MainButton.hide(); } catch (e) {} }

// === БЕЗОПАСНЫЙ DataAPI ===
const DataAPI = {
    _key(type) { return 'twa_fitness_' + type + '_' + USER_ID; },
    _safeRead(type, fallback) {
        try {
            const raw = localStorage.getItem(this._key(type));
            if (!raw) return fallback || [];
            const parsed = JSON.parse(raw);
            return Array.isArray(parsed) ? parsed : (fallback || []);
        } catch (err) { console.warn('DataAPI: corrupted ' + type, err); return fallback || []; }
    },
    _safeWrite(type, data) { try { localStorage.setItem(this._key(type), JSON.stringify(data)); return true; } catch (err) { console.error('DataAPI write failed', err); return false; } },
    getPrograms() {
    return this._safeRead('programs', []).map(function (p) {
        if (!p || typeof p !== 'object') return null;
        const prog = {
            id: p.id || createId(),
            name: String(p.name || ''),
            exercises: Array.isArray(p.exercises) ? p.exercises.map(function (ex) {
                return {
                    id: (ex && ex.id) || createId(),
                    name: String((ex && ex.name) || ''),
                    muscleGroup: String((ex && ex.muscleGroup) || 'Другое'),
                    exerciseType: (ex && ex.exerciseType === 'bodyweight') ? 'bodyweight' : 'weighted',
                    supersetId: (ex && ex.supersetId) || null,
                    targetSets: Math.max(1, parseInt(ex && ex.targetSets, 10) || 3),
                    targetReps: Math.max(1, parseInt(ex && ex.targetReps, 10) || 10)
                };
            }) : []
        };
        normalizeSupersets(prog.exercises);   // правило 8: защита от старых/битых данных
        return prog;
    }).filter(function (p) { return p !== null; });
},
    savePrograms(data) { this._safeWrite('programs', data); },
    getHistory() { return this._safeRead('history', []).filter(function (e) { return e && typeof e === 'object' && e.id && e.date; }); },
    saveHistory(data) { this._safeWrite('history', data); },
    getProgramById(id) { return this.getPrograms().find(function (p) { return p.id === id; }); },
    getHistoryEntryById(id) { return this.getHistory().find(function (e) { return e.id === id; }); },
    getUserExercises() {
        const map = new Map();
        const add = function (ex) { if (!ex || !ex.name) return; const name = String(ex.name).trim(); if (!name || map.has(name)) return; map.set(name, { name: name, muscleGroup: String(ex.muscleGroup || 'Другое'), exerciseType: ex.exerciseType === 'bodyweight' ? 'bodyweight' : 'weighted' }); };
        this.getPrograms().forEach(function (p) { (p.exercises || []).forEach(add); });
        this.getHistory().forEach(function (e) { (e.exercises || []).forEach(add); });
        return Array.from(map.values());
    },
    getExerciseHistory(exerciseName) {
        if (!exerciseName) return [];
        const results = [];
        this.getHistory().forEach(function (entry) {
            if (!entry || !Array.isArray(entry.exercises)) return;
            entry.exercises.forEach(function (ex) {
                if (!ex || ex.name !== exerciseName || !Array.isArray(ex.sets)) return;
                ex.sets.forEach(function (set) {
                    if (!set || typeof set !== 'object') return;
                    const w = Number(set.weight), r = Number(set.reps);
                    if (!isFinite(w) || !isFinite(r)) return;
                    results.push({ date: entry.date, weight: Math.max(0, w), reps: Math.max(0, Math.floor(r)) });
                });
            });
        });
        return results.sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
    }
};

const ACTIVE_KEY = 'twa_fitness_active_workout_' + USER_ID;
function saveActiveWorkout() { try { if (state.activeWorkout && typeof state.activeWorkout === 'object') localStorage.setItem(ACTIVE_KEY, JSON.stringify(state.activeWorkout)); else localStorage.removeItem(ACTIVE_KEY); } catch (e) { console.error('saveActiveWorkout failed', e); } }
function restoreActiveWorkout() {
    try {
        const saved = localStorage.getItem(ACTIVE_KEY);
        if (!saved) return false;
        const parsed = JSON.parse(saved);
        if (!parsed || !parsed.startTime || !Array.isArray(parsed.exercises)) { localStorage.removeItem(ACTIVE_KEY); return false; }
        state.activeWorkout = parsed;
        return true;
    } catch (e) { console.error('restoreActiveWorkout failed', e); localStorage.removeItem(ACTIVE_KEY); return false; }
}

let state = { currentScreen: 'programs', currentTab: 'programs', activeWorkout: null, editingProgram: null, workoutTimer: null, selectedMuscleGroup: 'Грудь', selectedExercise: null, supersetActiveId: null, selectedPeriod: 'all', selectedMonthKey: null, selectedExerciseMetric: 'weight' };

// === НАВИГАЦИЯ ===
function updateTabUI(activeTab) { ['stats','programs','history'].forEach(function (tab) { const b = document.getElementById('tab-' + tab); if (!b) return; if (tab === activeTab) { b.classList.remove('text-tgHint'); b.classList.add('text-tgLink'); b.setAttribute('aria-selected', 'true'); } else { b.classList.remove('text-tgLink'); b.classList.add('text-tgHint'); b.setAttribute('aria-selected', 'false'); } }); }
function openProgramsScreen() { state.currentTab = 'programs'; state.currentScreen = 'programs'; updateTabUI('programs'); updateBackButton(false); clearMainButton(); renderPrograms(); }
function navigateToTab(tab) { state.currentTab = tab; updateTabUI(tab); navigate(tab); }
function switchTab(tab) { if (state.currentScreen === 'workout' && state.activeWorkout && tab !== 'workout') { promptWorkoutExit(tab); return; } haptic('light'); navigateToTab(tab); }
function navigateBack() { if (state.currentScreen === 'workout' && state.activeWorkout) { promptWorkoutExit('programs'); return; } haptic('light'); const tabMap = { program_edit: 'programs', history_detail: 'history', workout: 'programs' }; navigateToTab(tabMap[state.currentScreen] || state.currentTab || 'programs'); }
function navigate(screen, data) {
    data = data || {};
    haptic('light'); stopWorkoutTimer();
    state.currentScreen = screen; state.supersetActiveId = null;
    if (data.programId !== undefined) state.editingProgram = data.programId ? DataAPI.getProgramById(data.programId) : { name: '', exercises: [] };
    updateBackButton(['program_edit','history_detail','workout'].indexOf(screen) !== -1);
    clearMainButton();
    if (screen === 'stats') renderStats();
    else if (screen === 'programs') renderPrograms();
    else if (screen === 'program_edit') renderProgramEdit();
    else if (screen === 'workout') renderWorkout();
    else if (screen === 'history') renderHistory();
    else if (screen === 'history_detail') renderHistoryDetail(data.entryId);
}

// === ДАТЫ И РАСЧЁТЫ ===
function formatLocalDateKey(date) { const d = date instanceof Date ? date : new Date(date); if (isNaN(d.getTime())) return null; return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function formatLocalMonthKey(date) { const d = date instanceof Date ? date : new Date(date); if (isNaN(d.getTime())) return null; return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function getWeekStart(date) { const d = new Date(date); const day = d.getDay(); d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day)); d.setHours(0, 0, 0, 0); return d; }

function getAutocompleteSuggestions(query, limit, muscleGroup) {
    const q = (query || '').trim().toLowerCase();
    let all = DataAPI.getUserExercises();
    if (muscleGroup) all = all.filter(function (ex) { return ex.muscleGroup === muscleGroup; });
    if (!q) return all.slice(0, limit || 8);
    return all.filter(function (ex) { const n = ex.name.toLowerCase(); return n.includes(q) && n !== q; }).slice(0, limit || 8);
}
function getMuscleSuggestions(query) {
    const q = (query || '').trim().toLowerCase();
    const groups = getMuscleGroups();
    if (!q) return groups.slice(0, 12);
    return groups.filter(function (g) { return g.toLowerCase().includes(q); }).slice(0, 12);
}

    const groups = []; const processed = new Set();
    exercises.forEach(function (ex, idx) { if (processed.has(idx)) return; if (ex.supersetId) { const group = exercises.map(function (e, i) { e = Object.assign({}, e); e.originalIndex = i; return e; }).filter(function (e) { return e.supersetId === ex.supersetId; }); group.forEach(function (e) { processed.add(e.originalIndex); }); groups.push({ type: 'superset', exercises: group }); } else { processed.add(idx); groups.push({ type: 'single', exercise: ex, originalIndex: idx }); } });
    const renderDetail = function (ex) { const isBw = ex.exerciseType === 'bodyweight'; const setsHTML = (ex.sets || []).map(function (s, i) { return '<div class="flex justify-between py-2 border-b border-tgBg last:border-0 ' + (s.setType === 'drop' ? 'text-orange-400' : '') + '"><span class="text-tgHint text-sm flex items-center gap-2">' + (i + 1) + '.' + (s.setType === 'drop' ? '<span class="drop-badge"><i class="fa-solid fa-fire"></i> ДРОП</span>' : '') + '</span><span class="font-medium">' + s.weight + ' кг × ' + s.reps + ' повт</span></div>'; }).join(''); return '<div class="mb-4"><div class="flex items-center gap-2 mb-2 flex-wrap"><h3 class="font-bold text-base">' + escHtml(ex.name) + '</h3>' + (isBw ? '<span class="bodyweight-badge">Собственный вес</span>' : '') + '</div><div class="bg-tgSecondaryBg p-4 rounded-2xl text-sm">' + setsHTML + '</div></div>'; };
    const exHTML = groups.map(function (g) { if (g.type === 'superset') { const style = getSupersetStyle(g.exercises[0].supersetId, allSsIds); return '<div class="rounded-2xl p-3 mb-4 shadow-md" style="' + style.styleAttr + '"><div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-[11px] font-bold mb-3 uppercase tracking-wide shadow-sm" style="' + style.badgeStyle + '"><i class="fa-solid fa-bolt"></i> СУПЕРСЕТ</div>' + g.exercises.map(renderDetail).join('') + '</div>'; } return renderDetail(g.exercise); }).join('');
    document.getElementById('app-content').innerHTML = '<div class="text-center mb-6 card-enter"><h2 class="text-xl font-bold">' + escHtml(entry.programName) + '</h2><p class="text-tgHint text-sm mt-1">' + date + '</p><div class="flex justify-center gap-6 mt-3 text-sm text-tgHint bg-tgSecondaryBg py-2.5 px-4 rounded-2xl inline-flex"><span><i class="fa-regular fa-clock mr-1"></i> ' + Math.round(entry.duration / 60) + ' мин</span><span><i class="fa-solid fa-dumbbell mr-1"></i> ' + (tonnage / 1000).toFixed(1) + 'т</span></div></div>' + exHTML;
}
let workoutDialogOpen = false;
function promptWorkoutExit() {
    if (workoutDialogOpen) return;
    workoutDialogOpen = true; clearMainButton();
    const existing = document.getElementById('workout-exit-modal'); if (existing) existing.remove();
    const modal = document.createElement('div'); modal.id = 'workout-exit-modal'; modal.className = 'modal-backdrop';
    modal.innerHTML = '<div class="modal-sheet"><div class="w-10 h-1 bg-tgHint/40 rounded-full mx-auto mb-5"></div><h2 class="text-xl font-bold text-center mb-2">Завершить тренировку?</h2><p class="text-tgHint text-sm text-center mb-5">Что сделать с текущей тренировкой?</p><div class="space-y-3"><button data-action="workout-save" class="w-full py-4 rounded-2xl bg-tgButton text-white font-semibold active:opacity-80"><i class="fa-solid fa-check mr-2"></i> Завершить и сохранить</button><button data-action="workout-discard" class="w-full py-4 rounded-2xl bg-red-500/15 text-red-500 font-semibold active:opacity-80"><i class="fa-solid fa-trash mr-2"></i> Не сохранять</button><button data-action="workout-cancel" class="w-full py-4 rounded-2xl bg-tgBg text-tgText font-semibold active:opacity-80">Отмена</button></div></div>';
    document.body.appendChild(modal);
    modal.addEventListener('click', function (e) { if (e.target === modal) { workoutDialogOpen = false; modal.remove(); } });
}
function closeWorkoutModal() { const m = document.getElementById('workout-exit-modal'); if (m) m.remove(); workoutDialogOpen = false; }
function saveWorkoutAndOpenPrograms() { try { const w = state.activeWorkout; if (w) { const hist = DataAPI.getHistory(); hist.push({ id: createId(), date: new Date(w.startTime).toISOString(), duration: Math.max(0, Math.round((Date.now() - w.startTime) / 1000)), programName: w.programName, exercises: w.exercises.map(function (ex) { return { name: ex.name, muscleGroup: ex.muscleGroup || '', exerciseType: ex.exerciseType || 'weighted', supersetId: ex.supersetId || null, targetSets: ex.targetSets ?? 3, targetReps: ex.targetReps ?? 10, sets: (ex.sets || []).map(function (s) { return { weight: Number(s.weight) || 0, reps: Number(s.reps) || 0, setType: s.setType || 'regular' }; }) }; }) }); DataAPI.saveHistory(hist); } clearWorkoutState(); haptic('success'); } catch (e) { console.error(e); clearWorkoutState(); } openProgramsScreen(); }
function discardWorkoutAndOpenPrograms() { clearWorkoutState(); haptic('light'); openProgramsScreen(); }

// === ДЕЛЕГИРОВАНИЕ СОБЫТИЙ (click) ===
document.addEventListener('click', function (event) {
    const target = event.target.closest('[data-action]');
    if (!event.target.closest('.ac-wrapper')) hideAllAutocomplete();
    if (!target) return;
    const action = target.dataset.action;
    const payload = target.dataset.payload;
    try {
        switch (action) {
            case 'switch-tab': switchTab(payload); break;
            case 'select-muscle-group': selectMuscleGroup(payload); break;
            case 'select-exercise': selectExercise(payload); break;
            case 'select-month': selectMonthFilter(payload); break;
            case 'select-period': selectPeriod(payload); break;
            case 'select-metric': selectExerciseMetric(payload); break;
            case 'toggle-filter': toggleFilterPanel(); break;
            case 'edit-program': navigate('program_edit', { programId: payload }); break;
            case 'delete-program': deleteProgram(payload); break;
            case 'start-workout': startWorkout(payload); break;
            case 'create-program': navigate('program_edit', { programId: null }); break;
            case 'add-exercise': addExercise(); break;
            case 'remove-exercise': removeExercise(parseInt(payload, 10)); break;
            case 'toggle-superset': toggleSupersetClick(parseInt(payload, 10)); break;
            case 'save-program': saveProgram(); break;
            case 'adjust-param': { const p = payload.split(':'); adjustProgramParam(parseInt(p[0], 10), p[1], parseInt(p[2], 10)); break; }
            case 'add-set': tryAddSet(parseInt(payload, 10)); break;
            case 'add-drop-set': tryAddDropSet(parseInt(payload, 10)); break;
            case 'remove-set': { const p = payload.split(':'); removeSet(parseInt(p[0], 10), parseInt(p[1], 10)); break; }
            case 'adjust-set': { const p = payload.split(':'); adjustSet(parseInt(p[0], 10), parseInt(p[1], 10), p[2], parseFloat(p[3])); break; }
            case 'remove-workout-exercise': removeWorkoutExercise(parseInt(payload, 10)); break;
            case 'finish-workout': promptWorkoutExit(); break;
            case 'workout-save': closeWorkoutModal(); saveWorkoutAndOpenPrograms(); break;
            case 'workout-discard': closeWorkoutModal(); discardWorkoutAndOpenPrograms(); break;
            case 'workout-cancel': closeWorkoutModal(); haptic('light'); break;
            case 'open-data-menu': openDataMenuModal(); break;
            case 'export-data': { const m = document.getElementById('data-menu-modal'); if (m) m.remove(); exportData(); break; }
            case 'import-data': { const m = document.getElementById('data-menu-modal'); if (m) m.remove(); triggerImportFile(); break; }
            case 'reset-data': { const m = document.getElementById('data-menu-modal'); if (m) m.remove(); resetAllData(); break; }
            case 'close-modal': { const m = document.getElementById(target.dataset.modal); if (m) m.remove(); break; }
            case 'history-detail': navigate('history_detail', { entryId: payload }); break;
            case 'open-mg-modal': openMuscleGroupsModal(); break;
            case 'mg-add': mgAdd(); break;
            case 'mg-edit-start': mgEditState = payload; renderMgList(); break;
            case 'mg-edit-save': mgEditSave(payload); break;
            case 'mg-edit-cancel': mgEditState = null; renderMgList(); break;
            case 'mg-delete': mgDelete(payload); break;
            case 'ac-pick': pickAutocomplete(target); break;
            case 'ac-muscle-pick': pickMuscleAutocomplete(target); break;
            case 'add-workout-exercise': openAddWorkoutExerciseModal(); break;
            case 'add-workout-exercise-confirm': confirmAddWorkoutExercise(); break;
        }
    } catch (err) { console.error('Delegated action error:', action, payload, err); }
});

// === ДЕЛЕГИРОВАНИЕ ВВОДА (input) ===
document.addEventListener('input', function (e) {
    const t = e.target;
    if (t.id === 'prog-name') { updateProgramName(t.value); return; }
    if (t.classList.contains('muscle-input')) {
        if ((t.dataset.scope || 'editor') === 'editor') updateExercise(parseInt(t.dataset.exerciseIndex, 10), 'muscleGroup', t.value);
        updateMuscleAutocomplete(t);
        return;
    }
    if (t.classList.contains('exercise-name-input')) {
        if ((t.dataset.scope || 'editor') === 'editor') updateExercise(parseInt(t.dataset.exerciseIndex, 10), 'name', t.value);
        updateAutocomplete(t);
        return;
    }
    if (t.classList.contains('exercise-input')) updateExercise(parseInt(t.dataset.exerciseIndex, 10), t.dataset.field, t.value);
});

// === ВАРИАНТЫ СРАЗУ ПРИ НАЖАТИИ НА ПОЛЕ (focusin) ===
document.addEventListener('focusin', function (e) {
    const t = e.target;
    if (t.classList.contains('muscle-input')) { updateMuscleAutocomplete(t); return; }
    if (t.classList.contains('exercise-name-input')) { updateAutocomplete(t); return; }
});

// === ДЕЛЕГИРОВАНИЕ ИЗМЕНЕНИЙ (change) ===
document.addEventListener('change', function (e) {
    const t = e.target;
    if (t.classList.contains('exercise-select')) { updateExercise(parseInt(t.dataset.exerciseIndex, 10), t.dataset.field, t.value); return; }
    if (t.classList.contains('exercise-checkbox')) { updateExercise(parseInt(t.dataset.exerciseIndex, 10), t.dataset.field, t.checked ? 'bodyweight' : 'weighted'); return; }
    if (t.classList.contains('set-input')) {
        const exIdx = parseInt(t.dataset.exercise, 10), setIdx = parseInt(t.dataset.set, 10), field = t.dataset.field;
        const value = field === 'weight' ? parseWeight(t.value) : parseReps(t.value);
        const set = state.activeWorkout && state.activeWorkout.exercises && state.activeWorkout.exercises[exIdx] ? state.activeWorkout.exercises[exIdx].sets[setIdx] : null;
        if (value === null) { showAlert('Недопустимое значение'); if (set) t.value = set[field]; return; }
        if (set) { updateSet(exIdx, setIdx, field, value); updateExerciseBadge(exIdx); }
    }
});

if (window.visualViewport) { window.visualViewport.addEventListener('resize', function () { const nav = document.getElementById('bottom-nav'); if (!nav) return; nav.classList.toggle('keyboard-hidden', window.visualViewport.height < window.innerHeight - 150); }); }
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && state.currentScreen === 'workout' && state.activeWorkout) startTimer(); });

// === ЗАПУСК С ЗАЩИТОЙ ОТ ОШИБОК ===
(function init() {
    try {
        if (restoreActiveWorkout()) navigate('workout'); else navigateToTab('programs');
    } catch (err) {
        console.error('Init error:', err);
        const m = document.getElementById('app-content');
        if (m) m.innerHTML = '<div style="padding:16px;color:#f87171;font-size:14px;line-height:1.5">Ошибка запуска: ' + escHtml(err && err.message ? err.message : String(err)) + '</div>';
    }
})();
</script>
