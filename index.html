<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fitnary</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tgBg: 'var(--tg-theme-bg-color, #1c1c1e)',
                        tgText: 'var(--tg-theme-text-color, #ffffff)',
                        tgHint: 'var(--tg-theme-hint-color, #8e8e93)',
                        tgLink: 'var(--tg-theme-link-color, #3b82f6)',
                        tgButton: 'var(--tg-theme-button-color, #3b82f6)',
                        tgSecondaryBg: 'var(--tg-theme-secondary-bg-color, #2c2c2e)',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bottom-nav-height: 72px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        body {
            background-color: var(--tg-theme-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            /* Safe area padding */
            padding-bottom: calc(var(--bottom-nav-height) + var(--safe-bottom) + 16px);
        }
        input, select {
            background-color: var(--tg-theme-secondary-bg-color, #2c2c2e);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid var(--tg-theme-hint-color, #8e8e93);
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        .scroll-container {
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-padding-left: 16px;
            scroll-padding-right: 16px;
        }
        .scroll-container::-webkit-scrollbar { display: none; }
        .snap-x { scroll-snap-type: x mandatory; }
        .snap-center { scroll-snap-align: center; }

        /* Микроанимации */
        .chip {
            transition: background-color 0.18s ease, color 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease;
        }
        .chip:active { transform: scale(0.96); }
        
        .card-enter {
            animation: cardIn 0.2s ease-out both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Фиксированная область графика */
        .chart-wrapper {
            position: relative;
            height: 220px;
            touch-action: pan-y pinch-zoom;
        }
        .chart-wrapper canvas { touch-action: none; }
    </style>
</head>
<body class="min-h-screen">

    <header id="app-header" class="sticky top-0 z-10 bg-tgBg/90 backdrop-blur-md px-4 py-3 flex items-center justify-between border-b border-tgSecondaryBg">
        <!-- Кнопка назад управляется через tg.BackButton, но оставим placeholder для структуры -->
        <div class="w-10"></div>
        <h1 id="header-title" class="text-lg font-semibold flex-1 text-center">Fitnary</h1>
        <div class="w-10"></div>
    </header>

    <main id="app-content" class="px-4 pt-4"></main>

    <nav id="bottom-nav" 
         class="fixed bottom-0 left-0 right-0 bg-tgBg border-t border-tgSecondaryBg flex justify-around z-20"
         style="padding-bottom: max(12px, var(--safe-bottom));">
        <button onclick="switchTab('stats')" id="tab-stats" role="tab" aria-selected="true" class="flex flex-col items-center justify-center min-h-[56px] min-w-[64px] text-tgLink">
            <i class="fa-solid fa-chart-line text-xl mb-1"></i>
            <span class="text-xs font-medium">Статистика</span>
        </button>
        <button onclick="switchTab('programs')" id="tab-programs" role="tab" aria-selected="false" class="flex flex-col items-center justify-center min-h-[56px] min-w-[64px] text-tgHint">
            <i class="fa-solid fa-list-check text-xl mb-1"></i>
            <span class="text-xs font-medium">Программы</span>
        </button>
        <button onclick="switchTab('history')" id="tab-history" role="tab" aria-selected="false" class="flex flex-col items-center justify-center min-h-[56px] min-w-[64px] text-tgHint">
            <i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i>
            <span class="text-xs font-medium">История</span>
        </button “>
    </nav>

    <script>
        function esc(str = '') {
            return String(str).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
        }

        function createId() {
            return typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
        }

        function appConfirm(message) {
            return new Promise(resolve => { tg.showConfirm(message, ok => resolve(ok)); });
        }

        const MUSCLE_GROUPS = ['Грудь', 'Спина', 'Ноги', 'Плечи', 'Руки'];
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        const USER_ID = tg.initDataUnsafe?.user?.id || 'local_test_user_' + Math.random().toString(36).substr(2, 9);
        const haptic = (type = 'light') => tg.HapticFeedback?.impactOccurred(type);

        // Управление системной кнопкой "Назад"
        tg.BackButton.onClick(() => navigateBack());
        function updateBackButton(isSubScreen) {
            if (isSubScreen) tg.BackButton.show();
            else tg.BackButton.hide();
        }

        const DataAPI = {
            _key(type) { return `twa_fitness_${type}_${USER_ID}`; },
            getPrograms() { return JSON.parse(localStorage.getItem(this._key('programs')) || '[]'); },
            savePrograms(data) { localStorage.setItem(this._key('programs'), JSON.stringify(data)); },
            getHistory() { return JSON.parse(localStorage.getItem(this._key('history')) || '[]'); },
            saveHistory(data) { localStorage.setItem(this._key('history'), JSON.stringify(data)); },
            getProgramById(id) { return this.getPrograms().find(p => p.id === id); },
            getHistoryEntryById(id) { return this.getHistory().find(h => h.id === id); },

            getUserExercises() {
                const exerciseMap = new Map();
                const addEx = (ex) => { if (ex.name && !exerciseMap.has(ex.name)) exerciseMap.set(ex.name, { name: ex.name, muscleGroup: ex.muscleGroup || 'Другое' }); };
                this.getPrograms().forEach(p => p.exercises.forEach(addEx));
                this.getHistory().forEach(e => e.exercises.forEach(addEx));
                return Array.from(exerciseMap.values());
            },

            getExerciseHistory(exerciseName) {
                const results = [];
                this.getHistory().forEach(entry => {
                    entry.exercises.forEach(ex => {
                        if (ex.name === exerciseName) {
                            ex.sets.forEach(set => results.push({ date: entry.date, weight: set.weight, reps: set.reps }));
                        }
                    });
                });
                return results.sort((a, b) => new Date(a.date) - new Date(b.date));
            },

            getStatsSummary() {
                const history = this.getHistory();
                const totalWorkouts = history.length;
                let totalVolume = 0;
                history.forEach(entry => {
                    entry.exercises.forEach(ex => {
                        ex.sets.forEach(set => { totalVolume += (set.weight * set.reps); });
                    });
                });
                return { totalWorkouts, totalVolume: Math.round(totalVolume) };
            }
        };

        const ACTIVE_KEY = `twa_fitness_active_workout_${USER_ID}`;
        function saveActiveWorkout() {
            state.activeWorkout ? localStorage.setItem(ACTIVE_KEY, JSON.stringify(state.activeWorkout)) : localStorage.removeItem(ACTIVE_KEY);
        }
        function restoreActiveWorkout() {
            const saved = localStorage.getItem(ACTIVE_KEY);
            if (!saved) return false;
            try { state.activeWorkout = JSON.parse(saved); return true; } 
            catch (e) { localStorage.removeItem(ACTIVE_KEY); return false; }
        }

        let state = {
            currentScreen: 'stats',
            currentTab: 'stats',
            activeWorkout: null,
            editingProgram: null,
            workoutTimer: null,
            selectedMuscleGroup: 'Все',
            selectedExercise: null
        };

        function switchTab(tab) {
            state.currentTab = tab;
            haptic('light');
            ['stats', 'programs', 'history'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.classList.remove('text-tgHint');
                    btn.classList.add('text-tgLink');
                    btn.setAttribute('aria-selected', 'true');
                } else {
                    btn.classList.remove('text-tgLink');
                    btn.classList.add('text-tgHint');
                    btn.setAttribute('aria-selected', 'false');
                }
            });
            navigate(tab);
        }

        function navigateBack() {
            haptic('light');
            const tabMap = { 'program_edit': 'programs', 'history_detail': 'history', 'workout': state.currentTab || 'stats' };
            navigate(tabMap[state.currentScreen] || state.currentTab || 'stats');
        }

        function navigate(screen, data = {}) {
            haptic('light');
            if (state.workoutTimer) { clearInterval(state.workoutTimer); state.workoutTimer = null; }
            
            state.currentScreen = screen;
            if (data.programId !== undefined) {
                state.editingProgram = data.programId ? DataAPI.getProgramById(data.programId) : { name: '', exercises: [] };
            }
            
            const content = document.getElementById('app-content');
            const title = document.getElementById('header-title');
            const isSubScreen = ['program_edit', 'history_detail', 'workout'].includes(screen);
            
            updateBackButton(isSubScreen);
            title.innerText = screen === 'stats' ? 'Fitnary' : (screen === 'programs' ? 'Программы' : (screen === 'history' ? 'История' : (screen === 'workout' ? 'Тренировка' : 'Fitnary')));

            // Очищаем MainButton при смене экрана
            tg.MainButton.hide();
            tg.MainButton.offClick(finishWorkout);
            tg.MainButton.offClick(saveProgram);

            switch(screen) {
                case 'stats': renderStats(); break;
                case 'programs': renderPrograms(); break;
                case 'program_edit': renderProgramEdit(); break;
                case 'workout': renderWorkout(); break;
                case 'history': renderHistory(); break;
                case 'history_detail': renderHistoryDetail(data.entryId); break;
            }
        }

        function renderStats() {
            const exercises = DataAPI.getUserExercises();
            const summary = DataAPI.getStatsSummary();
            
            const muscleGroupsHTML = ['Все', ...MUSCLE_GROUPS].map(group => `
                <button onclick="selectMuscleGroup('${group}')" role="tab" aria-selected="${state.selectedMuscleGroup === group}"
                    class="chip snap-center min-w-[100px] px-4 py-3 rounded-xl text-sm font-medium whitespace-nowrap ${
                        state.selectedMuscleGroup === group 
                            ? 'bg-tgLink text-white ring-2 ring-tgLink ring-offset-2 ring-offset-tgBg' 
                            : 'bg-tgSecondaryBg text-tgText'
                    }">
                    ${group}
                </button>
            `).join('');
            
            const filteredExercises = state.selectedMuscleGroup === 'Все' 
                ? exercises.slice(-5) // Показываем последние 5 добавленных, если "Все"
                : exercises.filter(ex => ex.muscleGroup === state.selectedMuscleGroup);

            const exercisesHTML = filteredExercises.length ? filteredExercises.map(ex => `
                <button onclick="selectExercise('${esc(ex.name)}')" role="tab" aria-selected="${state.selectedExercise === ex.name}"
                    class="chip snap-center min-w-[130px] px-4 py-3 rounded-xl text-sm font-medium text-center ${
                        state.selectedExercise === ex.name 
                            ? 'bg-tgLink text-white ring-2 ring-tgLink ring-offset-2 ring-offset-tgBg' 
                            : 'bg-tgSecondaryBg text-tgText'
                    }">
                    ${esc(ex.name)}
                </button>
            `).join('') : '<p class="text-tgHint text-sm px-4 py-3">Нет упражнений в этой группе</p>';
            
            document.getElementById('app-content').innerHTML = `
                <!-- Hero Summary -->
                <div class="grid grid-cols-2 gap-3 mb-6 card-enter">
                    <div class="bg-tgSecondaryBg p-4 rounded-2xl">
                        <div class="text-tgHint text-xs mb-1">Всего тренировок</div>
                        <div class="text-2xl font-bold text-tgLink">${summary.totalWorkouts}</div>
                    </div>
                <div class="bg-tgSecondaryBg p-4 rounded-2xl">
                        <div class="text-tgHint text-xs mb-1">Поднятый тоннаж</div>
                        <div class="text-2xl font-bold text-tgLink">${(summary.totalVolume / 1000).toFixed(1)}т</div>
                    </div>
                </div>

                <div class="bg-tgSecondaryBg p-4 rounded-2xl mb-6 card-enter" style="animation-delay: 0.05s">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-sm font-semibold text-tgHint">Прогресс веса</h3>
                        <span class="text-[10px] text-tgHint uppercase tracking-wide">Щипок для зума</span>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="progressChart"></canvas>
                    </div>
                    ${!state.selectedExercise ? '<p class="text-center text-tgHint text-sm mt-2">Выберите упражнение ниже для отображения графика</p>' : ''}
                </div>
                
                <div class="mb-4 card-enter" style="animation-delay: 0.1s">
                    <h3 class="text-sm font-semibold mb-2 text-tgHint px-1">Группа мышц</h3>
                    <div class="flex overflow-x-auto gap-3 pb-2 snap-x scroll-container">
                        ${muscleGroupsHTML}
                    </div>
                </div>
                
                <div class="mb-4 card-enter" style="animation-delay: 0.15s">
                    <h3 class="text-sm font-semibold mb-2 text-tgHint px-1">${state.selectedMuscleGroup === 'Все' ? 'Недавние упражнения' : 'Упражнения'}</h3>
                    <div class="flex overflow-x-auto gap-3 pb-2 snap-x scroll-container">
                        ${exercisesHTML}
                    </div>
                </div>
            `;
            renderChart();
        }

        function renderChart() {
            const ctx = document.getElementById('progressChart');
            if (!ctx) return;
            const existingChart = Chart.getChart(ctx);
            if (existingChart) existingChart.destroy();
            
            if (!state.selectedExercise) {
                const c = ctx.getContext('2d');
                c.clearRect(0, 0, ctx.width, ctx.height);
                c.font = '14px sans-serif';
                c.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-hint-color') || '#8e8e93';
                c.textAlign = 'center';
                c.fillText('Выберите упражнение', ctx.width / 2, ctx.height / 2);
                return;
            }
            
            const history = DataAPI.getExerciseHistory(state.selectedExercise);
            if (history.length === 0) {
                const c = ctx.getContext('2d');
                c.clearRect(0, 0, ctx.width, ctx.height);
                c.font = '14px sans-serif';
                c.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-hint-color') || '#8e8e93';
                c.textAlign = 'center';
                c.fillText('Нет данных', ctx.width / 2, ctx.height / 2);
                return;
            }
            
            // Группировка по ISO дате, чтобы избежать дублирования "01.10" из разных годов
            const dataByDate = {};
            history.forEach(h => {
                const key = new Date(h.date).toISOString().slice(0, 10);
                const label = new Date(h.date).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
                if (!dataByDate[key] || h.weight > dataByDate[key].weight) {
                    dataByDate[key] = { weight: h.weight, label: label };
                }
            });
            
            const sortedKeys = Object.keys(dataByDate).sort();
            const labels = sortedKeys.map(k => dataByDate[k].label);
            const data = sortedKeys.map(k => dataByDate[k].weight);
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Вес (кг)',
                        data: data,
                        borderColor: getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-link-color') || '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.3,
                        fill: true,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        zoom: {
                            pan: { enabled: true, mode: 'x' },
                            zoom: { pinch: { enabled: true }, mode: 'x', limits: { x: { min: 'original', max: 'original' } } }
                        }
                    },
                    scales: {
                        y: { beginAtZero: false, ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-hint-color') || '#8e8e93' } },
                        x: { ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--tg-theme-hint-color') || '#8e8e93' } }
                    }
                }
            });
        }

        function selectMuscleGroup(group) {
            state.selectedMuscleGroup = group;
            state.selectedExercise = null;
            renderStats();
        }

        function selectExercise(name) {
            state.selectedExercise = state.selectedExercise === name ? null : name;
            renderStats();
        }

        function renderPrograms() {
            const programs = DataAPI.getPrograms();
            let listHTML = programs.length ? programs.map((p, index) => {
                const exercisesPreview = p.exercises.slice(0, 2).map(ex => `${esc(ex.name)} ${ex.targetSets ?? 3}×${ex.targetReps ?? 10}`).join(' • ');
                const moreCount = p.exercises.length > 2 ? ` +${p.exercises.length - 2}` : '';
                
                return `
                    <div class="bg-tgSecondaryBg p-4 rounded-2xl mb-3 card-enter" style="animation-delay: ${index * 0.05}s">
                        <div class="flex justify-between items-start">
                            <div onclick="navigate('program_edit', {programId: '${p.id}'})" class="flex-1 active:opacity-70 pr-2">
                                <div class="font-semibold text-base mb-1">${esc(p.name)}</div>
                                <div class="text-tgHint text-xs leading-relaxed">
                                    ${exercisesPreview || '<span class="italic">Нет упражнений</span>'}${moreCount}
                                </div>
                            </div>
                            <div class="flex flex-col gap-2">
                                <button onclick="startWorkout('${p.id}')" aria-label="Начать тренировку"
                                    class="w-11 h-11 flex items-center justify-center rounded-full bg-tgBg text-tgLink active:opacity-70 transition-opacity">
                                    <i class="fa-solid fa-play text-lg"></i>
                                </button>
                                <button onclick="deleteProgram('${p.id}')" aria-label="Удалить программу"
                                    class="w-11 h-11 flex items-center justify-center rounded-full bg-tgBg text-red-500 active:opacity-70 transition-opacity">
                                    <i class="fa-solid fa-trash text-lg"></i>
                                </button
                            </div>
                        </div>
                    </div>
                `;
            }).join('') : '<div class="text-center text-tgHint mt-10 card-enter">Нет созданных программ</div>';

            document.getElementById('app-content').innerHTML = `
                ${listHTML}
                <button onclick="navigate('program_edit', {programId: null})" 
                    class="w-full mt-6 bg-tgButton text-white font-semibold py-4 rounded-2xl active:opacity-80 transition-opacity card-enter" style="animation-delay: 0.1s">
                    <i class="fa-solid fa-plus mr-2"></i> Создать программу
                </button>
            `;
        }

        function renderProgramEdit() {
            const isEdit = !!state.editingProgram && state.editingProgram.id;
            const prog = state.editingProgram || { name: '', exercises: [] };

            let exercisesHTML = prog.exercises.map((ex, idx) => `
                <div class="bg-tgSecondaryBg p-4 rounded-2xl mb-3 card-enter" style="animation-delay: ${idx * 0.05}s">
                    <div class="flex justify-between items-center mb-3">
                        <span class="font-medium text-sm text-tgHint">Упражнение ${idx + 1}</span>
                        <button onclick="removeExercise(${idx})" aria-label="Удалить упражнение" class="w-8 h-8 flex items-center justify-center rounded-full text-red-500 active:opacity-70">
                            <i class="fa-solid fa-times"></i>
                        </button>
                    </div>
                    <input type="text" placeholder="Название (напр. Жим лежа)" value="${esc(ex.name)}" 
                        oninput="updateExercise(${idx}, 'name', this.value)"
                        class="w-full p-3 rounded-xl mb-3 text-sm font-medium">
                    <select onchange="updateExercise(${idx}, 'muscleGroup', this.value)" class="w-full p-3 rounded-xl mb-3 text-sm">
                        <option value="">Выберите группу мышц</option>
                        ${MUSCLE_GROUPS.map(g => `<option value="${g}" ${ex.muscleGroup === g ? 'selected' : ''}>${g}</option>`).join('')}
                    </select>
                    <div class="flex gap-3">
                        <div class="flex-1">
                            <label class="text-xs text-tgHint mb-1 block">Подходы</label>
                            <input type="number" inputmode="numeric" value="${ex.targetSets ?? 3}" onchange="updateExercise(${idx}, 'targetSets', parseInt(this.value)||3)" class="w-full p-3 rounded-xl text-sm text-center">
                        </div>
                        <div class="flex-1">
                            <label class="text-xs text-tgHint mb-1 block">Повторения</label>
                            <input type="number" inputmode="numeric" value="${ex.targetReps ?? 10}" onchange="updateExercise(${idx}, 'targetReps', parseInt(this.value)||10)" class="w-full p-3 rounded-xl text-sm text-center">
                        </div>
                    </div
                </div>
            `).join('');

            document.getElementById('app-content').innerHTML = `
                <input type="text" id="prog-name" placeholder="Название программы" value="${esc(prog.name)}" 
                    oninput="updateProgramName(this.value)"
                    class="w-full p-4 rounded-2xl mb-4 text-lg font-semibold card-enter">
                <div id="exercises-list">${exercisesHTML}</div>
                <button onclick="addExercise()" class="w-full py-4 border-2 border-dashed border-tgHint rounded-2xl text-tgHint mt-2 active:bg-tgSecondaryBg transition-colors card-enter" style="animation-delay: 0.1s">
                    <i class="fa-solid fa-plus mr-2"></i> Добавить упражнение
                </button>
            `;
            
            // Используем MainButton для сохранения
            tg.MainButton.setText('Сохранить программу');
            tg.MainButton.show();
            tg.MainButton.onClick(saveProgram);
        }

        function updateProgramName(value) {
            if (!state.editingProgram) state.editingProgram = { name: '', exercises: [] };
            state.editingProgram.name = value;
        }

        function renderWorkout() {
            const w = state.activeWorkout;
            
            let exercisesHTML = w.exercises.map((ex, exIdx) => {
                const completedSets = ex.sets.filter(s => s.weight > 0 && s.reps > 0).length;
                const targetSets = ex.targetSets ?? 3;
                const isComplete = completedSets >= targetSets;

                let setsHTML = ex.sets.map((s, sIdx) => `
                    <div class="flex items-center gap-2 bg-tgBg rounded-xl p-2 mb-2 card-enter" style="animation-delay: ${sIdx * 0.05}s">
                        <span class="w-7 text-tgHint text-sm font-medium text-center">${sIdx + 1}</span>
                        
                        <button onclick="adjustSet(${exIdx}, ${sIdx}, 'weight', -2.5)" class="w-10 h-10 rounded-lg bg-tgSecondaryBg text-lg flex items-center justify-center active:opacity-70 font-bold">−</button>
                        <input type="number" inputmode="decimal" value="${s.weight}" onchange="updateSet(${exIdx}, ${sIdx}, 'weight', parseFloat(this.value)||0)" class="flex-1 h-10 text-center bg-transparent text-lg font-semibold">
                        <button onclick="adjustSet(${exIdx}, ${sIdx}, 'weight', 2.5)" class="w-10 h-10 rounded-lg bg-tgSecondaryBg text-lg flex items-center justify-center active:opacity-70 font-bold">+</button>
                        <span class="text-tgHint text-xs w-8 text-center">кг</span>
                        
                        <button onclick="adjustSet(${exIdx}, ${sIdx}, 'reps', -1)" class="w-10 h-10 rounded-lg bg-tgSecondaryBg text-lg flex items-center justify-center active:opacity-70 font-bold">−</button>
                        <input type="number" inputmode="numeric" value="${s.reps}" onchange="updateSet(${exIdx}, ${sIdx}, 'reps', parseInt(this.value)||0)" class="flex-1 h-10 text-center bg-transparent text-lg font-semibold">
                        <button onclick="adjustSet(${exIdx}, ${sIdx}, 'reps', 1)" class="w-10 h-10 rounded-lg bg-tgSecondaryBg text-lg flex items-center justify-center active:opacity-70 font-bold">+</button>
                        <span class="text-tgHint text-xs w-12 text-center">повт</span>
                        
                        <button onclick="removeSet(${exIdx}, ${sIdx})" aria-label="Удалить подход" class="w-10 h-10 rounded-lg flex items-center justify-center text-red-500 active:opacity-70">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `).join('');

                return `
                    <div class="bg-tgSecondaryBg p-4 rounded-2xl mb-4 card-enter" style="animation-delay: ${exIdx * 0.1}s">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-base">${esc(ex.name)}</h3>
                            <span class="text-xs font-medium px-2 py-1 rounded-md ${isComplete ? 'bg-green-500/20 text-green-500' : 'bg-tgBg text-tgHint'}">
                                ${isComplete ? '✓ Готово' : `${completedSets} из ${targetSets}`}
                            </span>
                        </div>
                        ${setsHTML}
                        <button onclick="addSet(${exIdx})" class="w-full py-3 mt-1 bg-tgBg rounded-xl text-tgLink text-sm font-semibold active:opacity-70 transition-opacity">
                            + Добавить подход
                        </button>
                    </div>
                `;
            }).join('');

            document.getElementById('app-content').innerHTML = `
                <div class="text-center mb-6 card-enter">
                    <div class="text-4xl font-mono font-bold text-tgLink tracking-wider" id="workout-timer">00:00:00</div>
                    <div class="text-tgHint text-xs mt-1 uppercase tracking-wide">Время тренировки</div>
                </div>
                ${exercisesHTML}
            `;
            
            startTimer();
            
            // Главное действие экрана тренировки - через MainButton
            tg.MainButton.setText('Завершить тренировку');
            tg.MainButton.show();
            tg.MainButton.onClick(finishWorkout);
        }

        function adjustSet(exIdx, sIdx, field, delta) {
            const current = state.activeWorkout.exercises[exIdx].sets[sIdx][field] || 0;
            const newVal = field === 'weight' ? Math.max(0, parseFloat((current + delta).toFixed(1))) : Math.max(0, current + delta);
            updateSet(exIdx, sIdx, field, newVal);
            
            // Обновляем значение в input без полной перерисовки для плавности
            // (в простой реализации перерисуем, но с haptic это ощущается хорошо)
            haptic('light');
            renderWorkout();
        }

        function renderHistory() {
            const history = DataAPI.getHistory().sort((a, b) => new Date(b.date) - new Date(a.date));
            let listHTML = history.length ? history.map((h, index) => {
                const date = new Date(h.date);
                const dateStr = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
                const timeStr = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                const durationMin = Math.round(h.duration / 60);
                const totalSets = h.exercises.reduce((acc, ex) => acc + ex.sets.length, 0);

                return `
                    <div onclick='navigate("history_detail", {entryId: "${h.id}"})' 
                        class="bg-tgSecondaryBg p-4 rounded-2xl mb-3 active:scale-[0.98] transition-transform cursor-pointer card-enter" style="animation-delay: ${index * 0.05}s">
                        <div class="flex justify-between items-start mb-2">
                            <div class="font-semibold text-base">${esc(h.programName)}</div>
                            <div class="text-tgHint text-sm">${dateStr}</div>
                        </div>
                        <div class="flex gap-4 text-sm text-tgHint">
                            <span><i class="fa-regular fa-clock mr-1"></i> ${durationMin} мин</span>
                            <span><i class="fa-solid fa-layer-group mr-1"></i> ${totalSets} подх.</span>
                            <span>${timeStr}</span>
                        </div>
                    </div>
                `;
            }).join('') : '<div class="text-center text-tgHint mt-10 card-enter">История пуста</div>';

            document.getElementById('app-content').innerHTML = listHTML;
        }

        function renderHistoryDetail(entryId) {
            const entry = DataAPI.getHistoryEntryById(entryId);
            if (!entry) {
                document.getElementById('app-content').innerHTML = '<p class="text-center text-tgHint mt-10">Запись не найдена</p>';
                return;
            }
            
            const date = new Date(entry.date).toLocaleString('ru-RU');
            let exHTML = entry.exercises.map((ex, idx) => {
                let setsHTML = ex.sets.map((s, i) => `
                    <div class="flex justify-between py-2 border-b border-tgBg last:border-0">
                        <span class="text-tgHint text-sm">${i + 1}.</span>
                        <span class="font-medium">${s.weight} кг × ${s.reps} повт</span>
                    </div>
                `).join('');
                return `
                    <div class="mb-4 card-enter" style="animation-delay: ${idx * 0.05}s">
                        <h3 class="font-bold mb-2 text-base">${esc(ex.name)}</h3>
                        <div class="bg-tgSecondaryBg p-4 rounded-2xl text-sm">
                            ${setsHTML}
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('app-content').innerHTML = `
                <div class="text-center mb-6 card-enter">
                    <h2 class="text-xl font-bold">${esc(entry.programName)}</h2>
                    <p class="text-tgHint text-sm mt-1">${date}</p>
                </div>
                ${exHTML}
            `;
        }

        function addExercise() {
            if (!state.editingProgram) state.editingProgram = { name: '', exercises: [] };
            state.editingProgram.exercises.push({ id: createId(), name: '', muscleGroup: '', targetSets: 3, targetReps: 10 });
            renderProgramEdit();
        }

        function removeExercise(idx) {
            state.editingProgram.exercises.splice(idx, 1);
            renderProgramEdit();
        }

        function updateExercise(idx, field, value) {
            if (!state.editingProgram) state.editingProgram = { name: '', exercises: [] };
            state.editingProgram.exercises[idx][field] = value;
        }

        function saveProgram() {
            const name = document.getElementById('prog-name').value.trim();
            if (!name) { tg.showPopup({message: 'Введите название программы'}); return; }
            if (state.editingProgram.exercises.length === 0) { tg.showPopup({message: 'Добавьте хотя бы одно упражнение'}); return; }

            state.editingProgram.name = name;
            let programs = DataAPI.getPrograms();
            const existIdx = programs.findIndex(p => p.id === state.editingProgram.id);
            
            if (existIdx > -1) programs[existIdx] = state.editingProgram;
            else { state.editingProgram.id = createId(); programs.push(state.editingProgram); }

            DataAPI.savePrograms(programs);
            haptic('success');
            state.editingProgram = null;
            tg.MainButton.hide();
            
            tg.showPopup({ title: 'Сохранено ✓', message: `Программа "${name}" готова` });
            setTimeout(() => navigate('programs'), 400);
        }

        async function deleteProgram(id) {
            const ok = await appConfirm('Удалить программу?');
            if (!ok) return;
            DataAPI.savePrograms(DataAPI.getPrograms().filter(p => p.id !== id));
            renderPrograms();
        }

        function startWorkout(programId) {
            const program = DataAPI.getProgramById(programId);
            if (!program || program.exercises.length === 0) {
                tg.showPopup({message: 'В программе нет упражнений'});
                return;
            }

            state.activeWorkout = {
                programId: program.id,
                programName: program.name,
                startTime: Date.now(),
                exercises: program.exercises.map(ex => ({
                    name: ex.name,
                    muscleGroup: ex.muscleGroup,
                    targetSets: ex.targetSets,
                    targetReps: ex.targetReps,
                    sets: [{ weight: 0, reps: ex.targetReps || 10 }] // Сразу добавляем 1 пустой подход для удобства
                }))
            };
            saveActiveWorkout();
            navigate('workout');
        }

        function addSet(exIdx) {
            const exercise = state.activeWorkout.exercises[exIdx];
            const sets = exercise.sets;
            let defaultWeight = 0, defaultReps = exercise.targetReps ?? 10;
            
            if (sets.length > 0) {
                defaultWeight = sets[sets.length - 1].weight;
                defaultReps = sets[sets.length - 1].reps;
            }
            sets.push({ weight: defaultWeight, reps: defaultReps });
            saveActiveWorkout();
            renderWorkout();
        }

        function removeSet(exIdx, sIdx) {
            state.activeWorkout.exercises[exIdx].sets.splice(sIdx, 1);
            saveActiveWorkout();
            renderWorkout();
        }

        function updateSet(exIdx, sIdx, field, value) {
            state.activeWorkout.exercises[exIdx].sets[sIdx][field] = value;
            saveActiveWorkout();
        }

        function startTimer() {
            if (state.workoutTimer) clearInterval(state.workoutTimer);
            const update = () => {
                if (!state.activeWorkout) return;
                const elapsed = Date.now() - state.activeWorkout.startTime;
                const h = Math.floor(elapsed / 3600000).toString().padStart(2, '0');
                const m = Math.floor((elapsed % 3600000) / 60000).toString().padStart(2, '0');
                const s = Math.floor((elapsed % 60000) / 1000).toString().padStart(2, '0');
                const el = document.getElementById('workout-timer');
                if(el) el.innerText = `${h}:${m}:${s}`;
            };
            update();
            state.workoutTimer = setInterval(update, 1000);
        }

        async function finishWorkout() {
            const ok = await appConfirm('Завершить и сохранить тренировку?');
            if (!ok) return;

            if (state.workoutTimer) { clearInterval(state.workoutTimer); state.workoutTimer = null; }
            
            const w = state.activeWorkout;
            DataAPI.saveHistory([...DataAPI.getHistory(), {
                id: createId(),
                date: new Date(w.startTime).toISOString(),
                duration: Math.round((Date.now() - w.startTime) / 1000),
                programName: w.programName,
                exercises: w.exercises
            }]);
            
            state.activeWorkout = null;
            saveActiveWorkout();
            haptic('success');
            tg.MainButton.hide();
            navigate('stats');
        }

        document.addEventListener('visibilitychange', () => {
            if (state.currentScreen === 'workout' && state.activeWorkout) startTimer();
        });

        // Init
        if (restoreActiveWorkout()) navigate('workout');
        else switchTab('stats');
    </script>
</body>
</html>
