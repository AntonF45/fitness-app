<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fitnary</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tgBg: 'var(--tg-theme-bg-color, #1c1c1e)',
                        tgText: 'var(--tg-theme-text-color, #ffffff)',
                        tgHint: 'var(--tg-theme-hint-color, #8e8e93)',
                        tgLink: 'var(--tg-theme-link-color, #3b82f6)',
                        tgButton: 'var(--tg-theme-button-color, #3b82f6)',
                        tgSecondaryBg: 'var(--tg-theme-secondary-bg-color, #2c2c2e)'
                    }
                }
            }
        };
    </script>

    <style>
        :root {
            --bottom-nav-height: 72px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --card-bg: rgba(59, 130, 246, 0.04);
            --card-border: rgba(59, 130, 246, 0.12);
        }

        body {
            background-color: var(--tg-theme-bg-color, #1c1c1e);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: calc(var(--bottom-nav-height) + var(--safe-bottom) + 16px);
        }

        input, select {
            background-color: var(--tg-theme-secondary-bg-color, #2c2c2e);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid rgba(142, 142, 147, 0.3);
            border-radius: 12px;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .scroll-container { scrollbar-width: none; -ms-overflow-style: none; scroll-padding-left: 16px; scroll-padding-right: 16px; }
        .scroll-container::-webkit-scrollbar { display: none; }
        .snap-x { scroll-snap-type: x mandatory; }
        .snap-center { scroll-snap-align: center; }

        .stat-chip {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            transition: all 0.2s ease;
        }
        .stat-chip:active { transform: scale(0.96); }
        .stat-chip.active { background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.4); color: #ffffff; }
        .stat-chip.inactive { color: var(--tg-theme-hint-color, #8e8e93); }

        .card-enter { animation: cardIn 0.2s ease-out both; }
        @keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .chip-update { animation: chipFade 0.25s ease-out; }
        @keyframes chipFade { from { opacity: 0.5; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }

        .chart-card { background: var(--card-bg); border: 1px solid var(--card-border); }
        .chart-container-fixed { height: 260px; position: relative; overflow: hidden; }
        .chart-wrapper-fixed { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        .chart-empty-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--tg-theme-hint-color, #8e8e93); gap: 8px; }

        .chart-top-bar { position: relative; height: 40px; overflow: hidden; margin-bottom: 8px; }
        .chart-top-slider { display: flex; width: 200%; height: 100%; transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
        .chart-top-slider.show-filter { transform: translateX(-50%); }
        .chart-top-slider > div { width: 50%; height: 100%; flex-shrink: 0; }

        .filter-toggle-btn {
            width: 36px; height: 36px; border-radius: 10px;
            background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.25);
            display: flex; align-items: center; justify-content: center;
            color: var(--tg-theme-link-color, #3b82f6); transition: all 0.2s ease; flex-shrink: 0;
        }
        .filter-toggle-btn:active { transform: scale(0.92); background: rgba(59, 130, 246, 0.2); }
        .filter-toggle-btn.active { background: rgba(59, 130, 246, 0.25); }

        .period-filter { display: flex; gap: 6px; background: rgba(0, 0, 0, 0.2); padding: 4px; border-radius: 12px; }
        .period-btn {
            padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
            color: var(--tg-theme-hint-color, #8e8e93); transition: all 0.2s ease; white-space: nowrap;
        }
        .period-btn.active { background: rgba(59, 130, 246, 0.25); color: #ffffff; }
        .period-btn:active { transform: scale(0.95); }

        .achievement-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; transition: all 0.2s ease; }
        .achievement-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .achievement-icon.gold { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
        .achievement-icon.blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .achievement-icon.green { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .achievement-icon.purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; }

        .set-drop { border-left: 3px solid #f97316; background: linear-gradient(90deg, rgba(249, 115, 22, 0.08), transparent); }
        .bodyweight-badge { display: inline-flex; align-items: center; background: rgba(34, 197, 94, 0.15); color: #4ade80; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; }
        .drop-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(249, 115, 22, 0.2); color: #fb923c; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
        .checkbox-label input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: #4ade80; }
        .keyboard-hidden { display: none !important; }

        .autocomplete-dropdown {
            position: absolute; top: 100%; left: 0; right: 0; z-index: 50; margin-top: 4px;
            background: var(--tg-theme-secondary-bg-color, #2c2c2e); border: 1px solid rgba(142, 142, 147, 0.3);
            border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-height: 200px; overflow-y: auto;
        }
        .autocomplete-item { padding: 12px 16px; font-size: 14px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.15s; }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover, .autocomplete-item:active { background: rgba(255,255,255,0.08); }

        .modal-backdrop { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.65); padding: 16px; }
        .modal-sheet {
            width: 100%; max-width: 480px; background: var(--tg-theme-secondary-bg-color, #2c2c2e);
            color: var(--tg-theme-text-color, #ffffff); border-radius: 24px; padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); animation: modalIn 0.2s ease-out;
        }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>

<body class="min-h-screen">
    <main id="app-content" class="px-4 pt-4"></main>

    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-tgBg border-t border-tgSecondaryBg flex justify-around z-20 transition-all duration-200" style="padding-bottom: max(12px, var(--safe-bottom));">
        <button onclick="switchTab('stats')" id="tab-stats" role="tab" aria-selected="false" class="flex flex-col items-center justify-center min-h-[56px] min-w-[64px] text-tgHint">
            <i class="fa-solid fa-chart-line text-xl mb-1"></i><span class="text-xs font-medium">Статистика</span>
        </button>
        <button onclick="switchTab('programs')" id="tab-programs" role="tab" aria-selected="true" class="flex flex-col items-center justify-center min-h-[56px] min-w-[64px] text-tgLink">
            <i class="fa-solid fa-list-check text-xl mb-1"></i><span class="text-xs font-medium">Программы</span>
        </button>
        <button onclick="switchTab('history')" id="tab-history" role="tab" aria-selected="false" class="flex flex-col items-center justify-center min-h-[56px] min-w-[64px] text-tgHint">
            <i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i><span class="text-xs font-medium">История</span>
        </button>
    </nav>

    <script>
        function esc(str = '') { return String(str).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;'); }
        function createId() { return typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2); }

        const MONTHS_RU = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];
        const MONTHS_FULL = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        const WEEKDAYS_RU = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
        const DEFAULT_MUSCLE_GROUPS = ['Грудь', 'Спина', 'Ноги', 'Плечи', 'Руки'];
        
        function getMuscleGroups() {
            try { const saved = localStorage.getItem(`twa_fitness_muscle_groups_${USER_ID}`); return saved ? JSON.parse(saved) : [...DEFAULT_MUSCLE_GROUPS]; } 
            catch (e) { return [...DEFAULT_MUSCLE_GROUPS]; }
        }
        function saveMuscleGroups(groups) { localStorage.setItem(`twa_fitness_muscle_groups_${USER_ID}`, JSON.stringify(groups)); }

        const tg = window.Telegram.WebApp;
        try { tg.ready(); tg.expand(); } catch (error) { console.warn('Telegram init error:', error); }
        const USER_ID = tg.initDataUnsafe?.user?.id || 'local_test_user_' + Math.random().toString(36).substr(2, 9);

        function haptic(type = 'light') {
            try {
                if (type === 'success' || type === 'error' || type === 'warning') tg.HapticFeedback?.notificationOccurred(type);
                else tg.HapticFeedback?.impactOccurred(type);
            } catch (error) { console.warn('Haptic error:', error); }
        }
        function showAlert(message) { try { tg.showAlert(message); } catch (error) { alert(message); } }
        function showConfirm(message, callback) { try { tg.showConfirm(message, callback); } catch (error) { callback(confirm(message)); } }
        try { tg.BackButton.onClick(() => navigateBack()); } catch (error) { console.warn('BackButton error:', error); }
        function updateBackButton(isSubScreen) { try { if (isSubScreen) tg.BackButton.show(); else tg.BackButton.hide(); } catch (error) {} }
        function clearMainButton() { try { tg.MainButton.hide(); } catch (e) {} }

        const DataAPI = {
            _key(type) { return `twa_fitness_${type}_${USER_ID}`; },
            getPrograms() {
                try {
                    const data = JSON.parse(localStorage.getItem(this._key('programs')) || '[]');
                    return data.map(p => ({ ...p, exercises: (p.exercises || []).map(ex => ({ ...ex, exerciseType: ex.exerciseType || 'weighted', supersetId: ex.supersetId || null })) }));
                } catch (error) { return []; }
            },
            savePrograms(data) { localStorage.setItem(this._key('programs'), JSON.stringify(data)); },
            getHistory() { try { return JSON.parse(localStorage.getItem(this._key('history')) || '[]'); } catch (error) { return []; } },
            saveHistory(data) { localStorage.setItem(this._key('history'), JSON.stringify(data)); },
            getProgramById(id) { return this.getPrograms().find(program => program.id === id); },
            getHistoryEntryById(id) { return this.getHistory().find(entry => entry.id === id); },
            getUserExercises() {
                const exerciseMap = new Map();
                const addExercise = exercise => {
                    if (!exercise || !exercise.name) return;
                    if (!exerciseMap.has(exercise.name)) exerciseMap.set(exercise.name, { name: exercise.name, muscleGroup: exercise.muscleGroup || 'Другое', exerciseType: exercise.exerciseType || 'weighted' });
                };
                this.getPrograms().forEach(program => (program.exercises || []).forEach(addExercise));
                this.getHistory().forEach(entry => (entry.exercises || []).forEach(addExercise));
                return Array.from(exerciseMap.values());
            },
            getExerciseHistory(exerciseName) {
                const results = [];
                this.getHistory().forEach(entry => {
                    (entry.exercises || []).forEach(exercise => {
                        if (exercise.name === exerciseName) (exercise.sets || []).forEach(set => results.push({ date: entry.date, weight: set.weight, reps: set.reps }));
                    });
                });
                return results.sort((a, b) => new Date(a.date) - new Date(b.date));
            }
        };

        const ACTIVE_KEY = `twa_fitness_active_workout_${USER_ID}`;
        function saveActiveWorkout() { if (state.activeWorkout) localStorage.setItem(ACTIVE_KEY, JSON.stringify(state.activeWorkout)); else localStorage.removeItem(ACTIVE_KEY); }
        function restoreActiveWorkout() {
            const saved = localStorage.getItem(ACTIVE_KEY);
            if (!saved) return false;
            try { state.activeWorkout = JSON.parse(saved); return true; } catch (error) { localStorage.removeItem(ACTIVE_KEY); return false; }
        }

        let state = {
            currentScreen: 'programs', currentTab: 'programs', activeWorkout: null, editingProgram: null,
            workoutTimer: null, selectedMuscleGroup: 'Грудь', selectedExercise: null, supersetActiveId: null,
            selectedPeriod: 'month', selectedMonthIndex: null
        };

        function updateTabUI(activeTab) {
            ['stats', 'programs', 'history'].forEach(tab => {
                const button = document.getElementById(`tab-${tab}`);
                if (!button) return;
                if (tab === activeTab) { button.classList.remove('text-tgHint'); button.classList.add('text-tgLink'); button.setAttribute('aria-selected', 'true'); } 
                else { button.classList.remove('text-tgLink'); button.classList.add('text-tgHint'); button.setAttribute('aria-selected', 'false'); }
            });
        }

        function openProgramsScreen() { state.currentTab = 'programs'; state.currentScreen = 'programs'; updateTabUI('programs'); updateBackButton(false); clearMainButton(); renderPrograms(); }
        function navigateToTab(tab) { state.currentTab = tab; updateTabUI(tab); navigate(tab); }
        function switchTab(tab) { if (state.currentScreen === 'workout' && state.activeWorkout && tab !== 'workout') { promptWorkoutExit(tab); return; } haptic('light'); navigateToTab(tab); }
        function navigateBack() {
            if (state.currentScreen === 'workout' && state.activeWorkout) { promptWorkoutExit('programs'); return; }
            haptic('light');
            const tabMap = { program_edit: 'programs', history_detail: 'history', workout: 'programs' };
            navigateToTab(tabMap[state.currentScreen] || state.currentTab || 'programs');
        }
        function navigate(screen, data = {}) {
            haptic('light'); stopWorkoutTimer(); state.currentScreen = screen; state.supersetActiveId = null;
            if (data.programId !== undefined) state.editingProgram = data.programId ? DataAPI.getProgramById(data.programId) : { name: '', exercises: [] };
            updateBackButton(['program_edit', 'history_detail', 'workout'].includes(screen));
            clearMainButton();
            switch (screen) {
                case 'stats': renderStats(); break; case 'programs': renderPrograms(); break; case 'program_edit': renderProgramEdit(); break;
                case 'workout': renderWorkout(); break; case 'history': renderHistory(); break; case 'history_detail': renderHistoryDetail(data.entryId); break;
            }
        }

        // ==========================================
        // СТАТИСТИКА
        // ==========================================
        function getFilteredHistory(history, period) {
            if (period === 'all') return history;
            if (state.selectedMonthIndex !== null) {
                const year = new Date().getFullYear();
                return history.filter(item => { const d = new Date(item.date); return d.getFullYear() === year && d.getMonth() === state.selectedMonthIndex; });
            }
            const now = new Date(); let cutoff;
            if (period === 'week') cutoff = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            else if (period === 'month') cutoff = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
            else if (period === 'quarter') cutoff = new Date(now.getTime() - 90 * 24 * 60 * 60 * 1000);
            return history.filter(item => new Date(item.date) >= cutoff);
        }

        function getAvailableMonthsForExercise(exerciseName) {
            if (!exerciseName) {
                const now = new Date(); const months = [];
                for (let i = 5; i >= 0; i--) months.push({ index: new Date(now.getFullYear(), now.getMonth() - i, 1).getMonth(), label: MONTHS_FULL[new Date(now.getFullYear(), now.getMonth() - i, 1).getMonth()] });
                return months;
            }
            const history = DataAPI.getExerciseHistory(exerciseName); const monthSet = new Set();
            history.forEach(h => { const d = new Date(h.date); if (d.getFullYear() === new Date().getFullYear()) monthSet.add(d.getMonth()); });
            if (monthSet.size === 0) { const now = new Date(); for (let i = 5; i >= 0; i--) monthSet.add(new Date(now.getFullYear(), now.getMonth() - i, 1).getMonth()); }
            return Array.from(monthSet).sort((a, b) => a - b).map(idx => ({ index: idx, label: MONTHS_FULL[idx] }));
        }

        function renderStats() {
            const exercises = DataAPI.getUserExercises(); const muscleGroups = getMuscleGroups();
            const muscleGroupsHTML = muscleGroups.map(group => `<button onclick="selectMuscleGroup('${group}')" role="tab" aria-selected="${state.selectedMuscleGroup === group}" class="stat-chip snap-center min-w-[80px] px-3 py-2 rounded-xl text-xs font-medium whitespace-nowrap ${state.selectedMuscleGroup === group ? 'active' : 'inactive'}">${group}</button>`).join('');
            const filteredExercises = exercises.filter(ex => ex.muscleGroup === state.selectedMuscleGroup);
            const exercisesHTML = filteredExercises.length ? filteredExercises.map(ex => `<button onclick="selectExercise('${esc(ex.name)}')" role="tab" aria-selected="${state.selectedExercise === ex.name}" class="stat-chip snap-center min-w-[110px] px-3 py-2 rounded-xl text-xs font-medium text-center ${state.selectedExercise === ex.name ? 'active' : 'inactive'}">${esc(ex.name)}</button>`).join('') : '<p class="text-tgHint text-xs px-4 py-2">Нет упражнений</p>';
            const availableMonths = getAvailableMonthsForExercise(state.selectedExercise);
            const monthsHTML = availableMonths.map(m => `<button onclick="selectMonthFilter(${m.index})" class="period-btn ${state.selectedMonthIndex === m.index ? 'active' : ''}">${m.label}</button>`).join('');

            document.getElementById('app-content').innerHTML = `
                <div class="chart-card rounded-2xl p-4 mb-3 card-enter" style="animation-delay: 0.05s">
                    <div class="chart-top-bar">
                        <div id="chart-top-slider" class="chart-top-slider">
                            <div class="flex items-center justify-between gap-2 pr-1">
                                <div id="months-scroll" class="flex-1 overflow-x-auto scroll-container flex gap-1.5">${monthsHTML}</div>
                                <button id="filter-toggle-btn" onclick="toggleFilterPanel()" class="filter-toggle-btn"><i class="fa-solid fa-sliders"></i></button>
                            </div>
                            <div class="flex items-center pl-1">
                                <div class="period-filter flex-1">
                                    <button onclick="selectPeriod('week')" class="period-btn ${state.selectedPeriod === 'week' ? 'active' : ''}">Неделя</button>
                                    <button onclick="selectPeriod('month')" class="period-btn ${state.selectedPeriod === 'month' ? 'active' : ''}">Месяц</button>
                                    <button onclick="selectPeriod('quarter')" class="period-btn ${state.selectedPeriod === 'quarter' ? 'active' : ''}">3 мес</button>
                                    <button onclick="selectPeriod('all')" class="period-btn ${state.selectedPeriod === 'all' ? 'active' : ''}">Всё</button>
                                </div>
                                <button onclick="toggleFilterPanel()" class="filter-toggle-btn ml-2"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="chart-container-fixed">
                        <div class="chart-wrapper-fixed"><canvas id="progressChart"></canvas></div>
                        <div id="chart-empty-state" class="chart-empty-state" style="display: ${state.selectedExercise ? 'none' : 'flex'}"><i class="fa-solid fa-chart-line text-2xl"></i><div class="text-xs">Выберите упражнение</div></div>
                    </div>
                </div>
                <div class="mb-3 card-enter" style="animation-delay: 0.1s">
                    <div class="text-xs font-semibold text-tgHint uppercase tracking-wide mb-2 px-1">Группа мышц</div>
                    <div id="muscle-groups-container" class="flex overflow-x-auto gap-2 pb-1 snap-x scroll-container">${muscleGroupsHTML}</div>
                </div>
                <div class="mb-4 card-enter" style="animation-delay: 0.15s">
                    <div class="text-xs font-semibold text-tgHint uppercase tracking-wide mb-2 px-1">Упражнения</div>
                    <div id="exercises-container" class="flex overflow-x-auto gap-2 pb-1 snap-x scroll-container">${exercisesHTML}</div>
                </div>
                <div id="achievements-container">${state.selectedExercise ? renderAchievements() : ''}</div>
            `;
            setTimeout(() => {
                document.querySelectorAll('.scroll-container').forEach(container => {
                    const activeChip = container.querySelector('[aria-selected="true"]');
                    if (activeChip) activeChip.scrollIntoView({ behavior: 'auto', inline: 'center', block: 'nearest' });
                });
            }, 50);
            if (state.selectedExercise) renderChart();
        }

        function toggleFilterPanel() {
            const slider = document.getElementById('chart-top-slider'); const btn = document.getElementById('filter-toggle-btn');
            if (!slider) return; slider.classList.toggle('show-filter'); if (btn) btn.classList.toggle('active'); haptic('light');
        }
        function selectMonthFilter(monthIndex) { state.selectedMonthIndex = monthIndex; state.selectedPeriod = 'month'; haptic('light'); updatePeriodButtons(); updateChartAndAchievements(); }
        function selectPeriod(period) { state.selectedPeriod = period; state.selectedMonthIndex = null; haptic('light'); updatePeriodButtons(); updateChartAndAchievements(); }
        
        function updatePeriodButtons() {
            document.querySelectorAll('.period-btn').forEach(btn => {
                const text = btn.textContent.trim();
                const periodMap = { 'Неделя': 'week', 'Месяц': 'month', '3 мес': 'quarter', 'Всё': 'all' };
                let isActive = periodMap[text] === state.selectedPeriod;
                if (state.selectedMonthIndex !== null && !periodMap[text]) isActive = MONTHS_FULL[state.selectedMonthIndex] === text;
                btn.classList.toggle('active', isActive);
            });
        }

        function updateChartAndAchievements() {
            if (state.selectedExercise) renderChart();
            else {
                const empty = document.getElementById('chart-empty-state'); if (empty) empty.style.display = 'flex';
                const canvas = document.getElementById('progressChart'); if (canvas) { const existing = Chart.getChart(canvas); if (existing) existing.destroy(); }
            }
            const achContainer = document.getElementById('achievements-container');
            if (achContainer) { achContainer.innerHTML = state.selectedExercise ? renderAchievements() : ''; achContainer.classList.add('chip-update'); setTimeout(() => achContainer.classList.remove('chip-update'), 250); }
        }

        function selectMuscleGroup(group) {
            state.selectedMuscleGroup = group; state.selectedExercise = null; state.selectedMonthIndex = null; haptic('light');
            const exercises = DataAPI.getUserExercises(); const filtered = exercises.filter(ex => ex.muscleGroup === group);
            const container = document.getElementById('exercises-container');
            if (container) {

        const SUPERSET_COLORS = [{ border: '#a855f7', bg: 'rgba(168, 85, 247, 0.08)', badgeBg: 'rgba(168, 85, 247, 0.25)', text: '#c084fc' }, { border: '#3b82f6', bg: 'rgba(59, 130, 246, 0.08)', badgeBg: 'rgba(59, 130, 246, 0.25)', text: '#60a5fa' }, { border: '#10b981', bg: 'rgba(16, 185, 129, 0.08)', badgeBg: 'rgba(16, 185, 129, 0.25)', text: '#34d399' }, { border: '#f59e0b', bg: 'rgba(245, 158, 11, 0.08)', badgeBg: 'rgba(245, 158, 11, 0.25)', text: '#fbbf24' }, { border: '#ec4899', bg: 'rgba(236, 72, 153, 0.08)', badgeBg: 'rgba(236, 72, 153, 0.25)', text: '#f472b6' }];

        function renderPrograms() {

font-semibold"><button onclick="adjustProgramParam(${index}, 'targetSets', 1)" class="w-10 h-10 rounded-xl bg-tgBg font-bold active:opacity-70 shrink-0">+</button></div></div><div class="flex-1"><label class="text-xs text-tgHint mb-1 block">Повторения</label><div class="flex items-center gap-1"><button onclick="adjustProgramParam(${index}, 'targetReps', -1)" class="w-10 h-10 rounded-xl bg-tgBg font-bold active:opacity-70 shrink-0">−</button><input type="number" id="reps-${index}" inputmode="numeric" value="${exercise.targetReps ?? 10}" onchange="updateExercise(${index}, 'targetReps', parseInt(this.value) || 10)" class="w-full h-10 rounded-xl text-sm text-center font-semibold"><button onclick="adjustProgramParam(${index}, 'targetReps', 1)" class="w-10 h-10 rounded-xl bg-tgBg font-bold active:opacity-70 shrink-0">+</button></div></div></div></div>`;

        function generateExerciseCardHTML(exIdx, ex, allSsIds) {
            const sets = ex.sets || []; const completed = sets.filter(s => s.weight > 0 && s.reps > 0).length; const target = ex.targetSets ?? 3; const isComplete = completed >= target;
            return `<div id="exercise-card-${exIdx}" class="bg-tgSecondaryBg p-4 rounded-2xl mb-4 card-enter"><div class="flex justify-between items-center mb-3 gap-2"><div class="flex items-center gap-2 flex-1 min-w-0 flex-wrap"><h3 class="font-bold text-sm leading-snug break-words flex-1">${esc(ex.name)}</h3>${ex.exerciseType === 'bodyweight' ? '<span class="bodyweight-badge shrink-0">Собственный вес</span>' : ''}</div><div class="flex items-center gap-2 shrink-0"><span id="badge-${exIdx}" class="text-xs font-medium px-2 py-1 rounded-md ${isComplete ? 'bg-green-500/20 text-green-500' : 'bg-tgBg text-tgHint'}">${isComplete ? '✓ Готово' : `${completed}/${target}`}</span><button onclick="removeWorkoutExercise(${exIdx})" class="w-8 h-8 flex items-center justify-center rounded-full text-red-500 bg-tgBg active:opacity-70"><i class="fa-solid fa-times text-sm"></i></button></div></div><div id="sets-container-${exIdx}">${sets.map((s, i) => generateSetHTML(exIdx, i, s, ex.exerciseType)).join('')}</div><div class="flex gap-2 mt-2"><button onclick="tryAddSet(${exIdx})" class="flex-1 py-3 bg-tgBg rounded-xl text-tgLink text-sm font-semibold active:opacity-70">+ Подход</button><button onclick="tryAddDropSet(${exIdx})" class="flex-1 py-3 bg-orange-500/15 rounded-xl text-orange-400 text-sm font-semibold active:opacity-70"><i class="fa-solid fa-fire mr-1"></i> Дроп-сет</button></div></div>`;
        }

        function updateExerciseCardInDOM(exIdx, ex) {
            const cardHTML = generateExerciseCardHTML(exIdx, ex, state.activeWorkout.exercises.map(e => e.supersetId));
            const existing = document.getElementById(`exercise-card-${exIdx}`); if (existing) existing.outerHTML = cardHTML;
        }

        function removeWorkoutExercise(exIdx) { showConfirm('Убрать упражнение?', ok => { if (ok) { state.activeWorkout.exercises.splice(exIdx, 1); saveActiveWorkout(); haptic('light'); renderWorkout(); } }); }
        function tryAddSet(exIdx) { const sets = state.activeWorkout.exercises[exIdx].sets || []; if (sets.length > 0) { const last = sets[sets.length - 1]; if (!last.weight || Number(last.weight) <= 0 || !last.reps || Number(last.reps) <= 0) { showAlert('Заполните предыдущий подход'); return; } } addSet(exIdx); }
        function tryAddDropSet(exIdx) { const sets = state.activeWorkout.exercises[exIdx].sets || []; if (sets.length === 0) { showAlert('Сначала добавьте обычный подход'); return; } const last = sets[sets.length - 1]; if (!last.weight || Number(last.weight) <= 0 || !last.reps || Number(last.reps) <= 0) { showAlert('Заполните предыдущий подход'); return; } addDropSet(exIdx); }

        function renderWorkout() {
            const workout = state.activeWorkout; if (!workout) { openProgramsScreen(); return; }
            const exercises = workout.exercises || []; const allSsIds = exercises.map(e => e.supersetId); const groups = []; const processed = new Set();
            exercises.forEach((ex, idx) => {
                if (processed.has(idx)) return;
                if (ex.supersetId) { const group = exercises.map((e, i) => ({ ...e, originalIndex: i })).filter(e => e.supersetId === ex.supersetId); group.forEach(e => processed.add(e.originalIndex)); groups.push({ type: 'superset', exercises: group }); }
                else { processed.add(idx); groups.push({ type: 'single', exercise: ex, originalIndex: idx }); }
            });
            let groupsHTML = groups.map((g, gIdx) => {
                if (g.type === 'superset') { const style = getSupersetStyle(g.exercises[0].supersetId, allSsIds); return `<div class="rounded-2xl p-3 mb-4 card-enter shadow-md" style="animation-delay: ${gIdx * 0.1}s; ${style.styleAttr}"><div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-[11px] font-bold mb-3 uppercase tracking-wide shadow-sm" style="${style.badgeStyle}"><i class="fa-solid fa-bolt"></i> СУПЕРСЕТ</div>${g.exercises.map(ex => generateExerciseCardHTML(ex.originalIndex, ex, allSsIds)).join('')}</div>`; }
                return generateExerciseCardHTML(g.originalIndex, g.exercise, allSsIds);
            }).join('');
            document.getElementById('app-content').innerHTML = `<div class="sticky top-0 z-10 bg-tgBg/95 backdrop-blur-md py-4 mb-4 border-b border-tgSecondaryBg card-enter"><div class="text-4xl font-mono font-bold text-tgLink tracking-wider text-center" id="workout-timer">00:00:00</div><div class="text-tgHint text-xs mt-1 uppercase tracking-wide text-center">Время тренировки</div></div>${groupsHTML}<button onclick="promptWorkoutExit('programs')" class="w-full mt-2 mb-4 bg-red-600 text-white font-semibold py-4 rounded-2xl active:opacity-80 card-enter"><i class="fa-solid fa-stop mr-2"></i> Завершить тренировку</button>`;
            startTimer(); clearMainButton();
        }

        function adjustSet(exIdx, setIdx, field, delta) {
            const ex = state.activeWorkout.exercises[exIdx]; const current = ex.sets[setIdx][field] || 0;
            const newValue = field === 'weight' ? Math.max(0, parseFloat((current + delta).toFixed(1))) : Math.max(0, current + delta);
            updateSet(exIdx, setIdx, field, newValue); haptic('light');
            const input = document.getElementById(`set-${exIdx}-${setIdx}-${field}`); if (input) input.value = newValue;
            const completed = ex.sets.filter(s => s.weight > 0 && s.reps > 0).length; const target = ex.targetSets ?? 3;
            const badge = document.getElementById(`badge-${exIdx}`);
            if (badge) { badge.className = `text-xs font-medium px-2 py-1 rounded-md shrink-0 ${completed >= target ? 'bg-green-500/20 text-green-500' : 'bg-tgBg text-tgHint'}`; badge.innerText = completed >= target ? '✓ Готово' : `${completed}/${target}`; }
        }
        function addSet(exIdx) { const ex = state.activeWorkout.exercises[exIdx]; const sets = ex.sets; let w = 0, r = ex.targetReps ?? 10; if (sets.length > 0) { w = sets[sets.length - 1].weight; r = sets[sets.length - 1].reps; } sets.push({ weight: w, reps: r, setType: 'regular' }); saveActiveWorkout(); haptic('light'); updateExerciseCardInDOM(exIdx, ex); }
        function addDropSet(exIdx) { const sets = state.activeWorkout.exercises[exIdx].sets; const last = sets[sets.length - 1]; sets.push({ weight: Math.max(0, Math.round((last.weight * 0.75) / 2.5) * 2.5), reps: last.reps, setType: 'drop' }); saveActiveWorkout(); haptic('medium'); updateExerciseCardInDOM(exIdx, state.activeWorkout.exercises[exIdx]); }
        function removeSet(exIdx, setIdx) { const sets = state.activeWorkout.exercises[exIdx].sets; if (sets.length <= 1) sets[0] = { weight: 0, reps: 10, setType: 'regular' }; else sets.splice(setIdx, 1); saveActiveWorkout(); haptic('light'); updateExerciseCardInDOM(exIdx, state.activeWorkout.exercises[exIdx]); }
        function updateSet(exIdx, setIdx, field, value) { state.activeWorkout.exercises[exIdx].sets[setIdx][field] = value; saveActiveWorkout(); }
        function startWorkout(programId) {
            const program = DataAPI.getProgramById(programId); if (!program || !program.exercises?.length) { showAlert('Нет упражнений'); return; }
            state.activeWorkout = { programId: program.id, programName: program.name, startTime: Date.now(), exercises: program.exercises.map(ex => ({ name: ex.name, muscleGroup: ex.muscleGroup, exerciseType: ex.exerciseType || 'weighted', supersetId: ex.supersetId || null, targetSets: ex.targetSets, targetReps: ex.targetReps, sets: [{ weight: 0, reps: ex.targetReps || 10, setType: 'regular' }] })) };
            saveActiveWorkout(); navigate('workout');
        }
        function startTimer() { stopWorkoutTimer(); const update = () => { if (!state.activeWorkout) return; const e = Date.now() - state.activeWorkout.startTime; const el = document.getElementById('workout-timer'); if (el) el.innerText = `${Math.floor(e/3600000).toString().padStart(2,'0')}:${Math.floor((e%3600000)/60000).toString().padStart(2,'0')}:${Math.floor((e%60000)/1000).toString().padStart(2,'0')}`; }; update(); state.workoutTimer = setInterval(update, 1000); }
        function stopWorkoutTimer() { if (state.workoutTimer) { clearInterval(state.workoutTimer); state.workoutTimer = null; } }
        function clearWorkoutState() { stopWorkoutTimer(); state.activeWorkout = null; saveActiveWorkout(); clearMainButton(); }

        // ==========================================
        // ИСТОРИЯ
        // ==========================================
        function openDataMenuModal() {
            const modal = document.createElement('div'); modal.id = 'data-menu-modal'; modal.className = 'modal-backdrop';
            modal.innerHTML = `<div class="modal-sheet"><div class="w-10 h-1 bg-tgHint/40 rounded-full mx-auto mb-5"></div><h2 class="text-xl font-bold mb-4">Управление данными</h2><div class="space-y-3 mb-4"><button onclick="document.getElementById('data-menu-modal').remove(); exportData();" class="w-full py-3.5 px-4 rounded-xl bg-tgBg text-tgLink font-medium text-sm flex items-center justify-between active:opacity-80"><span><i class="fa-solid fa-download mr-2"></i> Экспорт (бэкап)</span><i class="fa-solid fa-chevron-right text-xs text-tgHint"></i></button><button onclick="document.getElementById('data-menu-modal').remove(); triggerImportFile();" class="w-full py-3.5 px-4 rounded-xl bg-tgBg text-tgLink font-medium text-sm flex items-center justify-between active:opacity-80"><span><i class="fa-solid fa-upload mr-2"></i> Импорт</span><i class="fa-solid fa-chevron-right text-xs text-tgHint"></i></button><button onclick="document.getElementById('data-menu-modal').remove(); resetAllData();" class="w-full py-3.5 px-4 rounded-xl bg-red-500/10 text-red-500 font-medium text-sm flex items-center justify-between active:opacity-80"><span><i class="fa-solid fa-trash-can mr-2"></i> Сбросить всё</span><i class="fa-solid fa-chevron-right text-xs text-red-500/50"></i></button></div><button onclick="document.getElementById('data-menu-modal').remove();" class="w-full py-3 bg-tgBg rounded-2xl font-semibold active:opacity-80">Закрыть</button></div>`;
            document.body.appendChild(modal); modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
        }
        function triggerImportFile() { const input = document.createElement('input'); input.type = 'file'; input.accept = '.json'; input.onchange = e => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = event => { try { const imp = JSON.parse(event.target.result); if (imp.programs && imp.history) { DataAPI.savePrograms(imp.programs); DataAPI.saveHistory(imp.history); if (imp.muscleGroups) saveMuscleGroups(imp.muscleGroups); haptic('success'); showAlert('Восстановлено!'); renderHistory(); } else showAlert('Неверный формат'); } catch (err) { showAlert('Ошибка чтения'); } }; reader.readAsText(file); }; input.click(); }
        async function exportData() {
            try {
                const data = { programs: DataAPI.getPrograms(), history: DataAPI.getHistory(), muscleGroups: getMuscleGroups(), exportDate: new Date().toISOString() };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const file = new File([blob], `fitnary_backup_${new Date().toISOString().slice(0, 10)}.json`, { type: 'application/json' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); haptic('success'); return; }
                const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `fitnary_backup_${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); haptic('success');
            } catch (e) { if (e.name !== 'AbortError') showAlert('Ошибка экспорта'); }
        }
        function resetAllData() { showConfirm('Удалить все данные?', ok => { if (ok) { localStorage.removeItem(DataAPI._key('programs')); localStorage.removeItem(DataAPI._key('history')); localStorage.removeItem(ACTIVE_KEY); localStorage.removeItem(`twa_fitness_muscle_groups_${USER_ID}`); state.activeWorkout = null; haptic('warning'); navigateToTab('programs'); } }); }

        function renderHistory() {
            const history = DataAPI.getHistory().sort((a, b) => new Date(b.date) - new Date(a.date));
            let listHTML = history.length ? history.map((entry, idx) => {
                const date = new Date(entry.date); const dateStr = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' });
                let tonnage = 0; (entry.exercises || []).forEach(ex => (ex.sets || []).forEach(s => tonnage += (Number(s.weight)||0) * (Number(s.reps)||0)));
                return `<div onclick='navigate("history_detail", {entryId: "${entry.id}"})' class="bg-tgSecondaryBg p-4 rounded-2xl mb-3 active:scale-[0.98] transition-transform cursor-pointer card-enter" style="animation-delay: ${idx * 0.05}s"><div class="flex justify-between items-start mb-2"><div class="font-semibold text-base">${esc(entry.programName)}</div><div class="text-tgHint text-sm">${dateStr}</div></div><div class="flex gap-4 text-sm text-tgHint"><span><i class="fa-regular fa-clock mr-1"></i> ${Math.round(entry.duration/60)} мин</span><span><i class="fa-solid fa-dumbbell mr-1"></i> ${(tonnage/1000).toFixed(1)}т</span></div></div>`;
            }).join('') : '<div class="text-center text-tgHint mt-10 card-enter">История пуста</div>';
            document.getElementById('app-content').innerHTML = `${listHTML}<div class="mt-8 pt-6 border-t border-tgSecondaryBg card-enter" style="animation-delay: 0.1s"><button onclick="openDataMenuModal()" class="w-full py-3.5 rounded-xl bg-tgSecondaryBg text-tgText font-semibold text-sm active:opacity-80 flex items-center justify-center gap-2"><i class="fa-solid fa-gear"></i> Управление данными</button></div>`;
        }

        function renderHistoryDetail(entryId) {
            const entry = DataAPI.getHistoryEntryById(entryId); if (!entry) { document.getElementById('app-content').innerHTML = '<p class="text-center text-tgHint mt-10">Не найдено</p>'; return; }
            const date = new Date(entry.date).toLocaleString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            let tonnage = 0; (entry.exercises || []).forEach(ex => (ex.sets || []).forEach(s => tonnage += (Number(s.weight)||0) * (Number(s.reps)||0)));
            const exercises = entry.exercises || []; const allSsIds = exercises.map(e => e.supersetId); const groups = []; const processed = new Set();
            exercises.forEach((ex, idx) => {
                if (processed.has(idx)) return;
                if (ex.supersetId) { const group = exercises.map((e, i) => ({ ...e, originalIndex: i })).filter(e => e.supersetId === ex.supersetId); group.forEach(e => processed.add(e.originalIndex)); groups.push({ type: 'superset', exercises: group }); }
                else { processed.add(idx); groups.push({ type: 'single', exercise: ex, originalIndex: idx }); }
            });
            const renderDetail = ex => {
                const isBw = ex.exerciseType === 'bodyweight';
                const setsHTML = (ex.sets || []).map((s, i) => `<div class="flex justify-between py-2 border-b border-tgBg last:border-0 ${s.setType === 'drop' ? 'text-orange-400' : ''}"><span class="text-tgHint text-sm flex items-center gap-2">${i+1}.${s.setType === 'drop' ? '<span class="drop-badge"><i class="fa-solid fa-fire"></i> ДРОП</span>' : ''}</span><span class="font-medium">${s.weight} кг × ${s.reps} повт</span></div>`).join('');
                return `<div class="mb-4"><div class="flex items-center gap-2 mb-2 flex-wrap"><h3 class="font-bold text-base">${esc(ex.name)}</h3>${isBw ? '<span class="bodyweight-badge">Собственный вес</span>' : ''}</div><div class="bg-tgSecondaryBg p-4 rounded-2xl text-sm">${setsHTML}</div></div>`;
            };
            const exHTML = groups.map(g => g.type === 'superset' ? `<div class="rounded-2xl p-3 mb-4 shadow-md" style="${getSupersetStyle(g.exercises[0].supersetId, allSsIds).styleAttr}"><div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-[11px] font-bold mb-3 uppercase tracking-wide shadow-sm" style="${getSupersetStyle(g.exercises[0].supersetId, allSsIds).badgeStyle}"><i class="fa-solid fa-bolt"></i> СУПЕРСЕТ</div>${g.exercises.map(renderDetail).join('')}</div>` : renderDetail(g.exercise)).join('');
            document.getElementById('app-content').innerHTML = `<div class="text-center mb-6 card-enter"><h2 class="text-xl font-bold">${esc(entry.programName)}</h2><p class="text-tgHint text-sm mt-1">${date}</p><div class="flex justify-center gap-6 mt-3 text-sm text-tgHint bg-tgSecondaryBg py-2.5 px-4 rounded-2xl inline-flex"><span><i class="fa-regular fa-clock mr-1"></i> ${Math.round(entry.duration/60)} мин</span><span><i class="fa-solid fa-dumbbell mr-1"></i> ${(tonnage/1000).toFixed(1)}т</span></div></div>${exHTML}`;
        }

        let workoutDialogOpen = false;
        function promptWorkoutExit(targetTab = 'programs') {
            if (workoutDialogOpen) return; workoutDialogOpen = true; clearMainButton();
            const existing = document.getElementById('workout-exit-modal'); if (existing) existing.remove();
            const modal = document.createElement('div'); modal.id = 'workout-exit-modal'; modal.className = 'modal-backdrop';
            modal.innerHTML = `<div class="modal-sheet"><div class="w-10 h-1 bg-tgHint/40 rounded-full mx-auto mb-5"></div><h2 class="text-xl font-bold text-center mb-2">Завершить тренировку?</h2><p class="text-tgHint text-sm text-center mb-5">Что сделать с текущей тренировкой?</p><div class="space-y-3"><button id="workout-save-btn" class="w-full py-4 rounded-2xl bg-tgButton text-white font-semibold active:opacity-80"><i class="fa-solid fa-check mr-2"></i> Завершить и сохранить</button><button id="workout-discard-btn" class="w-full py-4 rounded-2xl bg-red-500/15 text-red-500 font-semibold active:opacity-80"><i class="fa-solid fa-trash mr-2"></i> Не сохранять</button><button id="workout-cancel-btn" class="w-full py-4 rounded-2xl bg-tgBg text-tgText font-semibold active:opacity-80">Отмена</button></div></div>`;
            document.body.appendChild(modal);
            const close = () => { workoutDialogOpen = false; modal.remove(); };
            document.getElementById('workout-cancel-btn').onclick = () => { close(); haptic('light'); };
            document.getElementById('workout-save-btn').onclick = () => { close(); saveWorkoutAndOpenPrograms(); };
            document.getElementById('workout-discard-btn').onclick = () => { close(); discardWorkoutAndOpenPrograms(); };
            modal.addEventListener('click', e => { if (e.target === modal) close(); });
        }
        function saveWorkoutAndOpenPrograms() {
            try {
                const w = state.activeWorkout;
                if (w) { const hist = DataAPI.getHistory(); hist.push({ id: createId(), date: new Date(w.startTime).toISOString(), duration: Math.max(0, Math.round((Date.now() - w.startTime) / 1000)), programName: w.programName, exercises: w.exercises.map(ex => ({ name: ex.name, muscleGroup: ex.muscleGroup || '', exerciseType: ex.exerciseType || 'weighted', supersetId: ex.supersetId || null, targetSets: ex.targetSets ?? 3, targetReps: ex.targetReps ?? 10, sets: (ex.sets || []).map(s => ({ weight: Number(s.weight)||0, reps: Number(s.reps)||0, setType: s.setType || 'regular' })) })) }); DataAPI.saveHistory(hist); }
                clearWorkoutState(); haptic('success');
            } catch (error) { console.error(error); clearWorkoutState(); }
            openProgramsScreen();
        }
        function discardWorkoutAndOpenPrograms() { clearWorkoutState(); haptic('light'); openProgramsScreen(); }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const nav = document.getElementById('bottom-nav'); if (!nav) return;
                nav.classList.toggle('keyboard-hidden', window.visualViewport.height < window.innerHeight - 150);
            });
        }
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.currentScreen === 'workout' && state.activeWorkout) startTimer(); });

        if (restoreActiveWorkout()) navigate('workout'); else navigateToTab('programs');
    </script>
</body>
</html>
